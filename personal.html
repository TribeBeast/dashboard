<!DOCTYPE html>
<html lang="en">
<head>
<script src="gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #05060F;
    --bg-mid: #0C0F26;
    --panel: #12142C;
    --line: rgba(255,255,255,0.09);
    --text: #EDEBF7;
    --text-dim: #9296B8;
    --c-apps: #FF8A3D;
    --c-social: #FF765C;
    --c-projects: #FFB523;
    --c-other: #FFF284;
    --you-core: #FFBB8F;
    --you-glow: #FDE7D8;
    --you-shadow: #CC5100;
  }
  *{ box-sizing: border-box; }
  html{
    /* iOS specifically paints the zoomed-out / overscroll area using
       this element's solid background-color (a gradient here won't do
       it) — this is what stops white from showing when pinch-zoom
       can't be fully prevented */
    background-color: var(--bg-deep);
  }
  html, body{
    margin:0; padding:0; height:100%; min-height: 100%;
    background: radial-gradient(ellipse at 50% 40%, var(--bg-mid) 0%, var(--bg-deep) 70%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    /* iOS Safari ignores the viewport meta tag's user-scalable=no, but it
       DOES respect touch-action — this is what actually stops pinch from
       being interpreted as a zoom gesture in the first place, rather
       than just trying to hide the result after the fact */
    touch-action: pan-x pan-y;
  }

  #space-bg{
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    will-change: transform;
  }
  #stars{ position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star{ animation: twinkle linear infinite; }
  @keyframes twinkle{
    0%, 100% { opacity: var(--min-op); }
    50% { opacity: var(--max-op); }
  }

  .nebula{
    position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none;
    opacity: 0;
    transition: opacity 2.2s ease-out;
    animation: drift ease-in-out infinite;
  }
  .nebula.n1{ width: 460px; height: 460px; top: -140px; left: -120px; background: var(--c-projects); --op: 0.20; animation-duration: 22s; }
  .nebula.n2{ width: 380px; height: 380px; bottom: -120px; right: -100px; background: var(--c-social); --op: 0.16; animation-duration: 26s; }
  .nebula.n3{ width: 320px; height: 320px; bottom: 10%; left: 8%; background: var(--c-apps); --op: 0.13; animation-duration: 30s; }
  @keyframes drift{
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(40px, 26px) scale(1.12); }
  }

  /* slow-moving dust clouds that drift across the whole scene, behind everything */
  .dust{
    position: fixed; pointer-events: none;
    filter: blur(60px);
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 2.2s ease-out;
    animation: flow linear infinite;
    will-change: transform;
  }
  .dust.d1{
    width: 780px; height: 420px; top: 8%; left: -25%;
    background: radial-gradient(ellipse at 35% 40%, var(--c-projects) 0%, transparent 65%),
                radial-gradient(ellipse at 65% 60%, var(--c-social) 0%, transparent 70%);
    border-radius: 42% 58% 60% 40% / 55% 45% 60% 40%;
    --op: 0.16;
    animation-duration: 95s;
  }
  .dust.d2{
    width: 640px; height: 360px; top: 48%; left: -30%;
    background: radial-gradient(ellipse at 40% 50%, var(--c-apps) 0%, transparent 68%),
                radial-gradient(ellipse at 70% 35%, var(--c-projects) 0%, transparent 70%);
    border-radius: 55% 45% 40% 60% / 40% 60% 45% 55%;
    --op: 0.13;
    animation-duration: 120s;
    animation-delay: -40s;
  }
  .dust.d3{
    width: 560px; height: 320px; top: 74%; left: -20%;
    background: radial-gradient(ellipse at 50% 50%, var(--c-social) 0%, transparent 65%),
                radial-gradient(ellipse at 30% 40%, var(--c-other) 0%, transparent 72%);
    border-radius: 48% 52% 55% 45% / 50% 50% 42% 58%;
    --op: 0.12;
    animation-duration: 80s;
    animation-delay: -18s;
  }
  @keyframes flow{
    0%   { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(72vw, -6vh) rotate(10deg); }
    100% { transform: translate(140vw, 4vh) rotate(0deg); }
  }

  /* NEW: a second, different dust layer in front of the graph — thinner,
     streakier wisps that pass closer to the viewer than the background dust */
  #dust-front{ position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .streak{
    position: fixed;
    filter: blur(34px);
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 2.2s ease-out;
    animation: streak-flow linear infinite;
    will-change: transform;
  }
  .streak.s1{
    width: 620px; height: 150px; top: 18%; left: -35%;
    background: radial-gradient(ellipse at 30% 50%, var(--you-glow) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, var(--c-social) 0%, transparent 65%);
    border-radius: 50% 50% 45% 55% / 65% 65% 35% 35%;
    --op: 0.14;
    animation-duration: 52s;
  }
  .streak.s2{
    width: 520px; height: 130px; top: 62%; left: -30%;
    background: radial-gradient(ellipse at 40% 50%, var(--c-projects) 0%, transparent 62%),
                radial-gradient(ellipse at 65% 50%, var(--you-glow) 0%, transparent 68%);
    border-radius: 55% 45% 50% 50% / 60% 60% 40% 40%;
    --op: 0.12;
    animation-duration: 68s;
    animation-delay: -20s;
  }
  @keyframes streak-flow{
    0%   { transform: translate(0, 0) rotate(-8deg) scaleX(1); }
    50%  { transform: translate(70vw, 3vh) rotate(-4deg) scaleX(1.08); }
    100% { transform: translate(150vw, -2vh) rotate(-8deg) scaleX(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .dust{ animation: none; transition: none; opacity: var(--op, 0.15); }
    .nebula{ animation: none; transition: none; opacity: var(--op, 0.15); }
    .streak{ animation: none; transition: none; opacity: var(--op, 0.15); }
  }

  #warp-flash{
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    opacity: 0;
    mix-blend-mode: screen;
  }

  #fab-controls{
    position: fixed; right: 26px; bottom: 26px; z-index: 6;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  /* fixed to the viewport, not the pannable graph — stays put no
     matter how the person drags around the page */
  #topbar-clock{
    position: fixed; top: 22px; right: 26px; z-index: 6;
    text-align: right; pointer-events: none;
    font-family: 'Fraunces', serif; color: #EDEBF7;
  }
  #topbar-clock-time{
    font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1;
    text-shadow: 0 0 12px rgba(237,235,247,0.65), 0 0 26px rgba(237,235,247,0.3);
  }
  #topbar-clock-date{
    font-family: 'Inter', sans-serif; color: var(--text-dim);
    font-size: 11.5px; margin-top: 6px;
  }
  .topbar-subline{
    font-family: 'Inter', sans-serif; font-size: 11.5px;
    margin-top: 5px; display: flex; justify-content: flex-end; gap: 6px;
  }
  .topbar-sublabel{ color: var(--text-dim); }
  #topbar-cal-settings-btn{
    pointer-events: auto; margin-top: 8px;
    background: none; border: none; color: var(--text-dim);
    font-size: 13px; padding: 2px 0; cursor: pointer;
    opacity: 0.6; transition: opacity .15s ease;
  }
  #topbar-cal-settings-btn:hover{ opacity: 1; background: none; }
  .empty-note{ color: var(--text-dim); font-size: 13px; }
  #cal-modal-overlay{
    position: fixed; inset: 0; background: rgba(2,3,10,0.65);
    display: flex; align-items:center; justify-content:center; z-index: 25;
    opacity: 0; pointer-events: none;
    transition: opacity 180ms ease;
  }
  #cal-modal-overlay.open{ opacity: 1; pointer-events: auto; }
  #cal-modal{
    position: relative;
    background: rgba(20,18,18,0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: none; border-radius: 0;
    padding: 28px 26px; width: 320px;
    box-shadow: 0 30px 60px -18px rgba(0,0,0,0.55);
  }
  #cal-modal-frame{ position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  #cal-modal h2{
    font-family:'Fraunces', serif; font-weight:500; font-size:18px; margin:0 0 20px;
    color: #EDEBF7; text-shadow: 0 0 10px rgba(237,235,247,0.55);
  }
  .icon-btn{
    background: none; border: none; padding: 0; margin: 0;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    text-decoration: none;
    cursor: pointer;
    transition: color .15s ease, transform .15s ease;
  }
  .icon-btn:hover{ color: var(--text); transform: scale(1.1); }
  .icon-btn:focus-visible{ outline: 2px solid var(--c-projects); outline-offset: 4px; border-radius: 50%; }
  .icon-btn svg{ width: 22px; height: 22px; display: block; }
  button{
    font-family: 'Inter', sans-serif;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 15px;
    font-size: 13.5px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  button:hover{ border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); }
  button:focus-visible{ outline: 2px solid var(--c-projects); outline-offset: 2px; }

  svg#graph{
    width: 100vw; height: 100vh; display:block; cursor: grab; position: relative; z-index: 1;
    user-select: none; -webkit-user-select: none;
    /* the whole graph fades in on arrival instead of popping in the
       instant its elements finish building — toggled to opacity 1 a
       beat after buildScene()/relayout() run */
    opacity: 0;
    transition: opacity 700ms ease;
  }
  svg#graph.dragging{ cursor: grabbing; }

  .node-label{
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    fill: var(--text-dim);
    pointer-events: none;
    transition: fill .15s ease;
    /* a solid backdrop behind the text, so a connecting line or a
       neighboring node passing near/behind a label never makes it
       unreadable — the halo just paints over whatever's there */
    paint-order: stroke fill;
    stroke: var(--bg-deep);
    stroke-width: 3px;
    stroke-linejoin: round;
  }
  .node-circle{ transition: filter .15s ease; }
  .node-group{ cursor: pointer; }
  .node-group:hover .node-circle{ filter: brightness(1.3); }
  .star-wrap{
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.15s ease;
  }
  .node-group:hover .star-wrap{ transform: scale(1.4); }
  .hit-area{ fill: transparent; pointer-events: all; }
  .node-label{ user-select: none; }
  .you-label{ user-select: none; }
  .node-star{
    transform-box: fill-box;
    transform-origin: center;
    animation-name: glimmer;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }
  @keyframes glimmer{
    0%, 100% { transform: scale(var(--s-min, 0.8)) rotate(0deg); opacity: var(--o-min, 0.65); }
    50% { transform: scale(var(--s-max, 1.2)) rotate(var(--rot, 5deg)); opacity: var(--o-max, 1); }
  }

  /* a soft, slow-pulsing light behind each star — gives it presence
     without the layered gradient "shading" look; just a gentle glow,
     like the star casting a bit of its own light */
  .node-glow{
    transform-box: fill-box;
    transform-origin: center;
    filter: blur(6px);
    opacity: 0.3;
    animation-name: node-glow-pulse;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }
  @keyframes node-glow-pulse{
    0%, 100% { opacity: 0.18; transform: scale(0.85); }
    50% { opacity: 0.4; transform: scale(1.2); }
  }

  /* the faceted highlight — hard-edged, solid color, no blur — sits
     right on top of the star/circle's own fill */
  .node-facet{ opacity: 0.92; pointer-events: none; }

  /* a tiny specular glint — like light catching a cut gem — flat, not a
     gradient, just a small bright point that flashes on its own cycle,
     giving the star some sparkle without adding any shading */
  .node-glint{
    fill: #FFFFFF;
    animation-name: node-glint-flash;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }
  @keyframes node-glint-flash{
    0%, 82%, 100% { opacity: 0; }
    88% { opacity: 0.95; }
    94% { opacity: 0.2; }
  }

  /* a one-shot ring of energy when a star is actually clicked, right
     before it warps — separate from the ambient glow/glint, this only
     ever plays once per click */
  .click-ring{
    fill: none;
    stroke-width: 1.4;
    pointer-events: none;
    animation: click-ring-burst 480ms ease-out forwards;
  }
  @keyframes click-ring-burst{
    0% { r: 4; stroke-opacity: 0.8; stroke-width: 2.2; }
    100% { r: 26; stroke-opacity: 0; stroke-width: 0.4; }
  }

  @media (prefers-reduced-motion: reduce){
    .node-glint{ animation: none; opacity: 0; }
    .click-ring{ animation: none; display: none; }
  }

  /* each star drifts gently and independently, so the whole field feels
     alive at rest rather than only reacting to hover — purely a local
     offset, doesn't touch the positioning transform the layout controls */
  .float-wrap{
    animation-name: node-float;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }
  @keyframes node-float{
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(var(--float-x, 0px), var(--float-y, -3px)); }
  }

  /* connecting lines get a slow breathing pulse instead of sitting
     perfectly static — reads as a faint current running along them */
  .node-line{
    animation: line-breathe 5s ease-in-out infinite;
  }
  @keyframes line-breathe{
    0%, 100% { opacity: 0.09; }
    50% { opacity: 0.22; }
  }

  @media (prefers-reduced-motion: reduce){
    .node-star, .node-glow, .float-wrap, .node-line{ animation: none; }
  }

  .you-label{
    font-family: 'Fraunces', serif;
    font-size: 15px;
    fill: var(--you-core);
    pointer-events: none;
    text-anchor: middle;
  }
  .you-node{ cursor: pointer; }
  .you-halo{
    transform-box: fill-box;
    transform-origin: center;
    animation: halo-breathe 7s ease-in-out infinite;
  }
  .you-halo-inner{ animation-delay: -3.5s; }
  @keyframes halo-breathe{
    0%, 100% { transform: scale(0.92); opacity: 0.8; }
    50% { transform: scale(1.14); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce){
    .you-halo{ animation: none; }
  }


  /* Modal */
  #modal-overlay{
    position: fixed; inset: 0; background: rgba(2,3,10,0.65);
    display: flex; align-items:center; justify-content:center; z-index: 20;
    opacity: 0; pointer-events: none;
    transition: opacity 180ms ease;
  }
  #modal-overlay.open{ opacity: 1; pointer-events: auto; }
  #modal{
    position: relative;
    background: rgba(20,18,18,0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: none;
    border-radius: 0;
    padding: 28px 26px;
    width: 320px;
    box-shadow: 0 30px 60px -18px rgba(0,0,0,0.55);
  }
  #modal-frame{
    position: absolute; inset: 0; overflow: visible; pointer-events: none;
  }
  .frame-star{ fill: #EDEBF7; }
  #modal h2{
    font-family:'Fraunces', serif; font-weight:500; font-size:18px; margin:0 0 20px;
    color: #EDEBF7;
    text-shadow: 0 0 10px rgba(237,235,247,0.55);
  }
  .field{ margin-bottom: 15px; }
  .field label{
    display:block; font-size: 12px; margin-bottom: 6px;
    color: #EDEBF7;
    text-shadow: 0 0 6px rgba(237,235,247,0.45);
  }
  .field input{
    width: 100%; background: rgba(5,6,15,0.55); border-radius: 7px;
    color: var(--text); font-family: 'Inter', sans-serif; font-size: 13.5px; padding: 9px 10px;
    border: 1px solid rgba(237,235,247,0.55);
    box-shadow: 0 0 7px 0.5px rgba(237,235,247,0.2);
  }
  .field input:focus{
    outline: none;
    border-color: rgba(237,235,247,0.9);
    box-shadow: 0 0 10px 1px rgba(237,235,247,0.4);
  }
  .pills{ display:flex; gap: 8px; flex-wrap: wrap; }
  .pill{
    border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px;
    font-size: 12.5px; cursor:pointer; color: var(--text-dim);
    display:flex; align-items:center; gap:6px;
  }
  .pill .dot{ width:7px; height:7px; border-radius:50%; }
  .pill.selected{ color: var(--text); border-color: currentColor; }
  .modal-actions{ display:flex; justify-content:flex-end; gap: 8px; margin-top: 20px; }
  .btn-primary{ background: #EDEBF7; color: #0C0F26; border: none; font-weight: 600; }
  .btn-primary:hover{ background: #FFFFFF; }

  @media (prefers-reduced-motion: reduce){
    .nebula{ animation: none; opacity: var(--op, 0.15); }
    .star{ animation: none; }
  }
</style>
</head>
<body>

<div id="space-bg">
  <div id="stars"></div>
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>
  <div class="dust d1"></div>
  <div class="dust d2"></div>
  <div class="dust d3"></div>
</div>

<div id="topbar-clock">
  <div id="topbar-clock-time">--:--</div>
  <div id="topbar-clock-date"></div>
  <div class="topbar-subline"><span class="topbar-sublabel">Next Class</span><span id="topbar-next-class">—</span></div>
  <div class="topbar-subline"><span class="topbar-sublabel">Next Shift</span><span id="topbar-next-shift">—</span></div>
  <div class="topbar-subline"><span class="topbar-sublabel">Due Soon</span><span id="topbar-due-soon">—</span></div>
  <button id="topbar-cal-settings-btn" aria-label="Link calendars" title="Link calendars">⚙</button>
</div>

<div id="cal-modal-overlay">
  <div id="cal-modal">
    <svg id="cal-modal-frame"></svg>
    <h2>Link your calendars</h2>
    <div class="field">
      <label for="cal-class-ics">Class calendar ICS URL</label>
      <input id="cal-class-ics" type="text" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics">
    </div>
    <div class="field">
      <label for="cal-shift-ics">Shift calendar ICS URL</label>
      <input id="cal-shift-ics" type="text" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics">
    </div>
    <div class="modal-actions">
      <button id="cal-modal-cancel">Cancel</button>
      <button id="cal-modal-save" class="btn-primary">Save &amp; sync</button>
    </div>
    <div id="cal-modal-status" class="empty-note" style="margin-top:10px;"></div>
  </div>
</div>

<div id="fab-controls">
  <button id="home-icon-btn" class="icon-btn" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/></svg></button>
  <button id="add-btn" class="icon-btn" aria-label="Add a link" title="Add a link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
</div>

<svg id="graph"></svg>
<div id="warp-flash"></div>

<div id="dust-front">
  <div class="streak s1"></div>
  <div class="streak s2"></div>
</div>


<div id="modal-overlay">
  <div id="modal">
    <svg id="modal-frame"></svg>
    <h2>Add a link</h2>
    <div class="field">
      <label for="f-name">Name</label>
      <input id="f-name" type="text" placeholder="e.g. Figma">
    </div>
    <div class="field">
      <label for="f-url">URL</label>
      <input id="f-url" type="text" placeholder="e.g. figma.com">
    </div>
    <div class="field">
      <label>Category</label>
      <div class="pills" id="pills"></div>
    </div>
    <div class="modal-actions">
      <button id="cancel-btn">Cancel</button>
      <button id="save-btn" class="btn-primary">Add</button>
    </div>
  </div>
</div>

<script src="sync.js"></script>
<script>
(function(){
  const CATS = {
    apps:     { label: 'Personal', hex: '#FF8A3D' },
    social:   { label: 'Personal', hex: '#FF765C' },
    projects: { label: 'Personal', hex: '#FFB523' },
    other:    { label: 'Personal', hex: '#FFF284' },
  };

  const DEFAULT_NODES = [
    { id: 'n1', name: 'General Wishlist', url: 'https://example.com', category: 'apps' },
    { id: 'n2', name: 'YouTube',  url: 'https://www.youtube.com/', category: 'social' },
    { id: 'n3', name: 'Game Wishlist', url: 'https://example.com', category: 'projects' },
    { id: 'n6', name: 'Roblox', url: 'https://www.roblox.com/', category: 'other' },
    { id: 'n7', name: 'Recipes', url: 'https://example.com', category: 'social' },
  ];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // fade the nebula/dust/streak clouds in from nothing shortly after load.
  // uses setTimeout rather than requestAnimationFrame — rAF can be fully
  // paused by the browser for a tab that isn't focused, which left these
  // invisible indefinitely until the tab regained focus
  if (!reduceMotion){
    const clouds = document.querySelectorAll('.nebula, .dust, .streak');
    setTimeout(() => {
      clouds.forEach(el => {
        const op = getComputedStyle(el).getPropertyValue('--op').trim() || '0.15';
        el.style.opacity = op;
      });
    }, 60);
  }

  // ---------- starfield ----------
  (function buildStarfield(){
    const wrap = document.getElementById('stars');

  const svg = document.getElementById('graph');

  // ---------- storage (plain localStorage, works on any host) ----------
  async function loadState(){
    // read local data synchronously — the page renders from this right
    // away, with zero network wait. Any fresher cloud copy is checked
    // for and applied in the background afterward, never blocking the
    // initial render.
    const saved = SiteSync.loadLocal('personal-nodes', true);
    nodes = saved && saved.length ? saved : DEFAULT_NODES.map(n => ({...n}));

    SiteSync.checkCloud('personal-nodes', true, (fresher) => {
      if (fresher && fresher.length){

        buildScene();
        relayout();
      }

  async function saveNodes(){

  // ---------- layout ----------
  const RING_RADIUS = { apps: 255, social: 195, projects: 305, other: 230 };
  const CAT_ANGLE_OFFSET = { apps: 210, social: 300, projects: 30, other: 120 };

  // stable pseudo-random 0..1 from a string, so the "natural" jitter
  // stays put across relayouts instead of reshuffling every time
  function hash01(str){
    let h = 0;
    for (let i=0; i<str.length; i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
    return ((h % 1000) + 1000) % 1000 / 1000;
  }

  // blends a hex color toward white by `amt` (0-1) — used for the flat
  // highlight facet on stars/nodes, a distinct solid tone rather than
  // any kind of gradient
  function lighten(hex, amt){
    const c = hex.replace('#', '');
    const full = c.length === 3 ? c.split('').map(x => x+x).join('') : c;
    const num = parseInt(full, 16);
    let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
    r = Math.round(r + (255-r)*amt);
    g = Math.round(g + (255-g)*amt);
    b = Math.round(b + (255-b)*amt);
    return `rgb(${r},${g},${b})`;
  }
  // blends a hex color toward black by `amt` (0-1) — the shadow-side
  // counterpart to lighten(), for the same flat two-tone facet technique
  function darken(hex, amt){
    const c = hex.replace('#', '');
    const full = c.length === 3 ? c.split('').map(x => x+x).join('') : c;
    const num = parseInt(full, 16);
    let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
    r = Math.round(r * (1-amt));
    g = Math.round(g * (1-amt));
    b = Math.round(b * (1-amt));
    return `rgb(${r},${g},${b})`;
  }


  function computeTargets(){
    const byCat = {};
    nodes.forEach(n => { (byCat[n.category] ||= []).push(n); });
    Object.keys(byCat).forEach(cat => {
      const arr = byCat[cat];
      const spread = 130;
      const base = CAT_ANGLE_OFFSET[cat] ?? 270;
      arr.forEach((n, i) => {
        const t = arr.length === 1 ? 0.5 : i/(arr.length-1);
        const rand = hash01(n.id);
        const rand2 = hash01(n.id + 'r');
        const angle = (base - spread/2 + t*spread + (rand-0.5)*46) * Math.PI/180;
        const r = (RING_RADIUS[cat] ?? 220) + (rand2-0.5)*140;
        n.tx = Math.cos(angle) * r;
        n.ty = Math.sin(angle) * r;
        if (n.x === undefined){ n.x = n.tx + (Math.random()-0.5)*20; n.y = n.ty + (Math.random()-0.5)*20; }
      });
    });
  }

  // ---------- render ----------
  let gEls = {};

  function buildScene(){

    const atmoGrad = document.createElementNS(svgNS, 'radialGradient');
    atmoGrad.setAttribute('id', 'atmoGrad');
    atmoGrad.innerHTML = '<stop offset="0%" stop-color="var(--you-glow)" stop-opacity="0.5"/><stop offset="55%" stop-color="var(--you-glow)" stop-opacity="0.16"/><stop offset="100%" stop-color="var(--you-glow)" stop-opacity="0"/>';
    defs.appendChild(atmoGrad);

    // shared clip shapes for the faceted highlight look — a solid-color
    // highlight clipped to the star/circle's own silhouette, hard-edged,
    // no blur or gradient, like one flat facet of a cut gem catching light
    const starClip = document.createElementNS(svgNS, 'clipPath');
    starClip.setAttribute('id', 'starClip');
    starClip.innerHTML = '<path d="M0,-10 C1.1,-3.3 3.3,-1.1 10,0 C3.3,1.1 1.1,3.3 0,10 C-1.1,3.3 -3.3,1.1 -10,0 C-3.3,-1.1 -1.1,-3.3 0,-10 Z"/>';
    defs.appendChild(starClip);

    const circleClip = document.createElementNS(svgNS, 'clipPath');
    circleClip.setAttribute('id', 'circleClip');
    circleClip.innerHTML = '<circle r="20"/>';
    defs.appendChild(circleClip);

    svg.appendChild(defs);

    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('id', 'scene');
    svg.appendChild(g);

    const lineGroup = document.createElementNS(svgNS, 'g');
    lineGroup.id = 'lines';
    g.appendChild(lineGroup);
    nodes.forEach(n => {
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('class', 'node-line');
      line.setAttribute('stroke', '#EDEBF7');

      lineGroup.appendChild(line);

    });

    const you = document.createElementNS(svgNS, 'g');
    you.setAttribute('class', 'you-node');

    const haloOuter = document.createElementNS(svgNS, 'circle');
    haloOuter.setAttribute('class', 'you-halo you-halo-outer');
    haloOuter.setAttribute('r', 68);
    haloOuter.setAttribute('fill', 'url(#atmoGrad)');

    const haloInner = document.createElementNS(svgNS, 'circle');
    haloInner.setAttribute('class', 'you-halo you-halo-inner');
    haloInner.setAttribute('r', 34);
    haloInner.setAttribute('fill', 'url(#atmoGrad)');

    const youCoreHex = getComputedStyle(document.documentElement).getPropertyValue('--you-core').trim();

    // Personal is a geode — a burst of angular crystal shards from a
    // central point, not a circle at all. Genuinely different silhouette
    // from every other node on the site, fitting a personal/one-of-a-
    // kind feel.
    // a solid rounded base underneath the shards, so the overall
    // silhouette reads as full and circular — the shards add crystalline
    // texture and edge detail on top, rather than leaving bare gaps
    // between spiky points
    const geodeBase = document.createElementNS(svgNS, 'circle');
    geodeBase.setAttribute('r', 15);
    geodeBase.setAttribute('fill', darken(youCoreHex, 0.08));
    geodeBase.setAttribute('stroke', darken(youCoreHex, 0.35));
    geodeBase.setAttribute('stroke-width', '0.6');

    function makeShard(angleDeg, len, baseW, tipW, amt){
      const a = angleDeg * Math.PI/180;
      const dx = Math.cos(a), dy = Math.sin(a);
      const px = -dy, py = dx;
      const bx = dx*3, by = dy*3;
      const tx = dx*len, ty = dy*len;
      const d = `M${(bx+px*baseW).toFixed(1)},${(by+py*baseW).toFixed(1)} `
              + `L${(tx+px*tipW).toFixed(1)},${(ty+py*tipW).toFixed(1)} `
              + `L${(tx-px*tipW).toFixed(1)},${(ty-py*tipW).toFixed(1)} `
              + `L${(bx-px*baseW).toFixed(1)},${(by-py*baseW).toFixed(1)} Z`;
      const shard = document.createElementNS(svgNS, 'path');
      shard.setAttribute('d', d);
      shard.setAttribute('fill', amt >= 0 ? lighten(youCoreHex, amt) : darken(youCoreHex, -amt));
      shard.setAttribute('stroke', darken(youCoreHex, 0.35));
      shard.setAttribute('stroke-width', '0.5');
      shard.setAttribute('filter', 'url(#starglow)');
      return shard;
    }
    // six shards, evenly spaced 60° apart, alternating between just two
    // sizes and two tones — a deliberate, symmetric composition instead
    // of many shards at scattered angles and sizes
    const shardDefs = [];
    for (let i = 0; i < 6; i++){
      const long = i % 2 === 0;
      shardDefs.push({
        a: i * 60,
        len: long ? 24 : 18,

    const shards = shardDefs.map(s => makeShard(s.a, s.len, s.baseW, s.tipW, s.amt));

    // a small bright crystal-point glint at the very center, where all

    const centerGlint = document.createElementNS(svgNS, 'circle');
    centerGlint.setAttribute('r', 3);
    centerGlint.setAttribute('fill', lighten(youCoreHex, 0.65));

    function makeSparkleCompanion(radius, dur, size){

    let youDownAt = null, youMoved = false;

    you.addEventListener('pointermove', e => {

    nodes.forEach(n => {

      glow.style.animationDelay = '-' + (Math.random()*6).toFixed(2) + 's';

      const starColor = CATS[n.category]?.hex || CATS.other.hex;

      // a proper layered sparkle burst — long primary rays, shorter

      const raysSecondary = document.createElementNS(svgNS, 'g');
      raysSecondary.setAttribute('transform', 'rotate(45)');
      const raysSecondaryPath = document.createElementNS(svgNS, 'path');
      raysSecondaryPath.setAttribute('d', 'M0,-8 L1.3,-1.3 L8,0 L1.3,1.3 L0,8 L-1.3,1.3 L-8,0 L-1.3,-1.3 Z');
      raysSecondaryPath.setAttribute('fill', lighten(starColor, 0.35));
      raysSecondary.appendChild(raysSecondaryPath);

      const raysPrimary = document.createElementNS(svgNS, 'path');
      raysPrimary.setAttribute('d', 'M0,-14 L2.2,-2.2 L14,0 L2.2,2.2 L0,14 L-2.2,2.2 L-14,0 L-2.2,-2.2 Z');
      raysPrimary.setAttribute('fill', starColor);

      const starCore = document.createElementNS(svgNS, 'circle');

      glint.setAttribute('class', 'node-glint');
      glint.setAttribute('cx', -3.2); glint.setAttribute('cy', -3.2);
      glint.setAttribute('r', 1.4);
      glint.style.animationDuration = (3.5 + Math.random()*3.5).toFixed(2) + 's';
      glint.style.animationDelay = '-' + (Math.random()*7).toFixed(2) + 's';

      const starWrap = document.createElementNS(svgNS, 'g');

      starWrap.appendChild(glow);
      starWrap.appendChild(circle);

      const text = document.createElementNS(svgNS, 'text');
      text.setAttribute('class', 'node-label');
      text.setAttribute('x', 13);
      text.setAttribute('y', 4);
      text.textContent = n.name;

      const floatWrap = document.createElementNS(svgNS, 'g');

      floatWrap.style.animationDuration = (7 + Math.random()*5).toFixed(2) + 's';
      floatWrap.style.animationDelay = '-' + (Math.random()*10).toFixed(2) + 's';
      floatWrap.appendChild(starWrap);
      floatWrap.appendChild(text);

      group.appendChild(floatWrap);
      g.appendChild(group);
      n._group = group;
      n._star = circle;

      let downAt = null, moved = false;
      group.addEventListener('pointerdown', e => { downAt = {x:e.clientX,y:e.clientY}; moved=false; e.stopPropagation(); });
      group.addEventListener('pointermove', e => {
        if (!downAt) return;
        if (Math.abs(e.clientX-downAt.x) > 4 || Math.abs(e.clientY-downAt.y) > 4) moved = true;
      });
      group.addEventListener('pointerup', e => {
        e.stopPropagation();
        if (!moved){ spawnClickRing(n); warpTo(n); }
        downAt = null;
      });
    });

    gEls.g = g;
  }

  // a single expanding ring, fired once right as a star is clicked —
  // separate from the ambient glow/glint, purely a one-shot response
  function spawnClickRing(n){
    if (!n._group) return;
    const ring = document.createElementNS(svgNS, 'circle');
    ring.setAttribute('class', 'click-ring');
    ring.setAttribute('cx', 0); ring.setAttribute('cy', 0);
    ring.setAttribute('r', 4);
    ring.setAttribute('stroke', n.color || CATS[n.category]?.hex || CATS.other.hex);
    n._group.appendChild(ring);
    ring.addEventListener('animationend', () => ring.remove());
  }

  function positionScene(){
    gEls.g.setAttribute('transform', `translate(${cx+pan.x}, ${cy+pan.y})`);
    gEls.you.setAttribute('transform', 'translate(0,0)');
    nodes.forEach(n => {
      n._group.setAttribute('transform', `translate(${n.x},${n.y})`);
      n._line.setAttribute('x1', 0); n._line.setAttribute('y1', 0);
      n._line.setAttribute('x2', n.x); n._line.setAttribute('y2', n.y);
    });
    const bg = document.getElementById('space-bg');
    if (bg) bg.style.transform = `translate(${pan.x*0.4}px, ${pan.y*0.4}px)`;
    // the foreground dust streaks were never wired to the pan at all —
    // they'd sit frozen in place while everything else moved during a
    // drag. give them a slightly stronger factor since they're meant to
    // read as closer to the viewer than the stars/nebula behind them.
    const df = document.getElementById('dust-front');
    if (df) df.style.transform = `translate(${pan.x*0.55}px, ${pan.y*0.55}px)`;
  }

  // ---------- warp into a node ----------
  let warping = false;
  function easeInExpo(t){ return t <= 0 ? 0 : Math.pow(2, 10*t - 10); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  function resolveUrl(url){
    if (/^https?:\/\//i.test(url)) return url;
    if (/\.html?(\?|#|$)/i.test(url)) return url; // relative page on this site
    return 'https://' + url;
  }

  function warpTo(n){
    if (warping) return;
    const url = resolveUrl(n.url);
    if (reduceMotion){ window.location.href = url; return; }

    warping = true;
    svg.style.pointerEvents = 'none';

    const g = gEls.g;
    const bg = document.getElementById('space-bg');
    const startA = cx + pan.x, startB = cy + pan.y;
    const s = 34;
    const targetA = cx - s*n.x, targetB = cy - s*n.y;

    // stop the idle glimmer and drop the glow filter for the duration —
    // re-rasterizing a blur while scaling 34x is expensive and was the
    // real source of the lag; driving everything from one rAF loop here
    // (same approach as the zoom-out-to-home animation) keeps it smooth
    nodes.forEach(o => { o._star.style.animation = 'none'; o._star.style.filter = 'none'; });

    const dur = 420;
    let startTs = null;
    let navigated = false;

    function frame(ts){
      if (startTs === null) startTs = ts;
      const t = Math.min((ts - startTs) / dur, 1);
      const p = easeInExpo(t);

      // camera rushing toward the target star
      const curA = lerp(startA, targetA, p);
      const curB = lerp(startB, targetB, p);
      const curS = lerp(1, s, p);
      g.style.transform = `translate(${curA}px, ${curB}px) scale(${curS})`;

      // the whole starfield surges toward the viewer too
      if (bg) bg.style.transform = `translate(${pan.x*0.4}px, ${pan.y*0.4}px) scale(${lerp(1, 3.6, p)})`;

      // everything else fades away as we dive in
      gEls.you.style.opacity = String(Math.max(0, 1 - p*1.8));
      n._line.style.opacity = String(Math.max(0, 1 - p*1.6));
      n._star.style.opacity = String(Math.max(0, 1 - Math.max(0, p-0.35)/0.5));
      nodes.forEach(o => {
        if (o === n) return;
        o._group.style.opacity = String(Math.max(0, 1 - p*1.6));
      });

      // start the actual page navigation a bit before the animation
      // visually finishes, rather than waiting for a full stop — the
      // browser begins swapping pages while the last bit of motion is
      // still playing, which is what makes it read as one continuous
      // motion instead of "stop, then jump"
      if (!navigated && t >= 0.88){
        navigated = true;
        const flash = document.getElementById('warp-flash');
        flash.style.background = `radial-gradient(circle at 50% 50%, ${n.color || CATS[n.category]?.hex || '#fff'} 0%, transparent 70%)`;
        flash.style.transition = 'opacity 180ms ease';
        flash.style.opacity = '0.7';
        window.location.href = url;
      }

      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        // safety net: if navigation doesn't actually happen, restore
        // the page instead of leaving it faded out and locked forever
        setTimeout(() => {
          nodes.forEach(o => { o._star.style.filter = ''; o._star.style.animation = ''; o._group.style.opacity = ''; });
          n._star.style.opacity = '';
          n._line.style.opacity = '';
          gEls.you.style.opacity = '';
          svg.style.pointerEvents = '';
          warping = false;
        }, 600);
      }
    }
    requestAnimationFrame(frame);
  }
  function resetWarp(){
    const g = gEls.g;
    g.style.transition = 'transform 420ms ease-out';
    g.style.transform = '';
    nodes.forEach(o => {
      o._group.style.opacity = '';
      o._line.style.opacity = '';
      o._star.style.transition = 'opacity 300ms ease, transform 300ms ease';
      o._star.style.transform = '';
      o._star.style.opacity = '';
    });
    gEls.you.style.opacity = '';
    const bg = document.getElementById('space-bg');
    if (bg){ bg.style.transition = 'transform 420ms ease-out'; }
    setTimeout(() => {
      nodes.forEach(o => {
        o._star.style.filter = '';
        o._star.style.animation = '';
        o._star.style.transition = '';
      });
      g.style.transition = '';
      g.style.transform = '';
      svg.style.pointerEvents = '';
      svg.classList.remove('warping');
      warping = false;
      positionScene();
    }, 440);
  }

  // some browsers restore this exact page from a back-forward cache
  // when you hit Back after a star link took you to an external site —
  // that restores the frozen mid-warp visual state (zoomed in, faded
  // out, clicks disabled) instead of a fresh load. Catch that case and
  // put everything back to normal.
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) resetWarp();
  });

  // ---------- zoom out to go home (reverse of warping into a star) ----------
  function zoomOutHome(){
    if (warping) return;
    if (reduceMotion){ window.location.href = 'index.html'; return; }

    warping = true;
    svg.style.pointerEvents = 'none';

    const g = gEls.g;
    const bg = document.getElementById('space-bg');
    const startA = cx + pan.x, startB = cy + pan.y;

    nodes.forEach(o => { o._star.style.animation = 'none'; });

    const flash = document.getElementById('warp-flash');
    flash.style.background = 'radial-gradient(circle at 50% 50%, var(--you-core) 0%, transparent 70%)';
    flash.style.transition = 'opacity 220ms ease';
    flash.style.opacity = '0.7';
    setTimeout(() => { flash.style.opacity = '0'; }, 220);

    const dur = 560;
    let startTs = null;
    let navigated = false;

    function frame(ts){
      if (startTs === null) startTs = ts;
      const t = Math.min((ts - startTs) / dur, 1);
      const p = easeInExpo(t);

      // the whole scene shrinks away and dissolves, in place
      const curS = lerp(1, 0.04, p);
      g.style.transform = `translate(${startA}px, ${startB}px) scale(${curS})`;
      g.style.opacity = String(Math.max(0, 1 - p*1.2));

      // the backdrop recedes too, more gently than the foreground
      if (bg) bg.style.transform = `translate(${pan.x*0.4}px, ${pan.y*0.4}px) scale(${lerp(1, 0.55, p)})`;

      // start navigating shortly before the animation visually
      // finishes, same idea as warpTo — carries the motion through
      // into the next page instead of a dead stop then a jump
      if (!navigated && t >= 0.88){
        navigated = true;
        window.location.href = 'index.html';
      }

      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        // safety net: restore interactivity if navigation didn't
        // actually happen, instead of leaving the graph locked
        setTimeout(() => {
          svg.style.pointerEvents = '';
          warping = false;
        }, 600);
      }
    }
    requestAnimationFrame(frame);
  }

  let settling = true;
  function tick(){
    let stillMoving = false;
    nodes.forEach(n => {
      const dx = n.tx - n.x, dy = n.ty - n.y;
      n.x += dx * 0.08; n.y += dy * 0.08;
      if (Math.abs(dx) > 0.3 || Math.abs(dy) > 0.3) stillMoving = true;
    });
    positionScene();
    if (stillMoving) requestAnimationFrame(tick);
    else settling = false;
  }

  function relayout(){
    computeTargets();
    if (reduceMotion){
      nodes.forEach(n => { n.x = n.tx; n.y = n.ty; });
      positionScene();
    } else {
      // paint the current (pre-settle) positions immediately, so the scene
      // is never blank while waiting on a requestAnimationFrame callback —
      // browsers can defer/pause rAF entirely for a tab that isn't focused,
      // which otherwise left the graph unpositioned until you switched back
      positionScene();
      settling = true;
      requestAnimationFrame(tick);
    }
  }

  svg.addEventListener('pointerdown', e => {
    panning = true; panStart = {x: e.clientX - pan.x, y: e.clientY - pan.y};
    svg.classList.add('dragging');
  });
  window.addEventListener('pointermove', e => {
    if (!panning) return;
    pan.x = e.clientX - panStart.x; pan.y = e.clientY - panStart.y;
    positionScene();
  });
  window.addEventListener('pointerup', () => { panning = false; svg.classList.remove('dragging'); });

  window.addEventListener('resize', () => {
    W = window.innerWidth; H = window.innerHeight; cx = W/2; cy = H/2;
    positionScene();
  });

  document.getElementById('home-icon-btn').addEventListener('click', () => zoomOutHome());

  // ---------- Next Class / Next Shift: linked Google Calendars ----------
  // one Google API key, two separate calendar IDs — one for classes,
  // one for shifts. Stored under a dedicated key so it syncs across
  // devices the same way everything else on the site does.
  const SCHEDULE_WORKER_URL = 'https://site-sync.carlosaq0501.workers.dev/'; // same Worker as sync.js
  function loadCalConfig(){
    try {
      const raw = localStorage.getItem('schedule-calendars-config');
      return raw ? JSON.parse(raw) : { classIcsUrl: '', shiftIcsUrl: '' };
    } catch(e){ return { classIcsUrl: '', shiftIcsUrl: '' }; }
  }
  function saveCalConfig(cfg){
    SiteSync.save('schedule-calendars-config', cfg);
  }
  function setCalStatus(msg, isError){
    const el = document.getElementById('cal-modal-status');
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? '#E4483C' : '';
  }
  // browsers can't fetch most ICS URLs directly (CORS), so this asks
  // the Worker to fetch and parse it server-side instead — same Worker
  // that already handles sync and the password check
  async function fetchNextIcsEvent(icsUrl){
    const res = await fetch(SCHEDULE_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'fetchIcs', url: icsUrl }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || ('Request failed (' + res.status + ')'));
    return data.event || null;
  }
  function formatEventRange(ev){
    if (!ev) return '—';
    const name = ev.summary || '(untitled)';
    if (ev.allDay){
      return name; // all-day event — no meaningful time range to show
    }
    const start = new Date(ev.start);
    const end = new Date(ev.end);
    const startTime = start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const endTime = end.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return `${name} ${startTime}–${endTime}`;
  }
  // returns an array of per-calendar error messages (empty if every
  // linked calendar synced fine) — each calendar is still fetched
  // independently so one failing doesn't block the other from updating,
  // but the caller can now actually see what went wrong, unlike before
  async function refreshScheduleCalendars(){
    const cfg = loadCalConfig();
    const errors = [];
    if (cfg.classIcsUrl){
      try {
        const ev = await fetchNextIcsEvent(cfg.classIcsUrl);
        const el = document.getElementById('topbar-next-class');
        if (el) el.textContent = formatEventRange(ev);
      } catch(e){ errors.push('Class: ' + e.message); }
    }
    if (cfg.shiftIcsUrl){
      try {
        const ev = await fetchNextIcsEvent(cfg.shiftIcsUrl);
        const el = document.getElementById('topbar-next-shift');
        if (el) el.textContent = formatEventRange(ev);
      } catch(e){ errors.push('Shift: ' + e.message); }
    }
    return errors;
  }
  function initCalSettingsUI(){
    const overlay = document.getElementById('cal-modal-overlay');
    const btn = document.getElementById('topbar-cal-settings-btn');
    if (!overlay || !btn) return;
    btn.addEventListener('click', () => {
      const cfg = loadCalConfig();
      document.getElementById('cal-class-ics').value = cfg.classIcsUrl || '';
      document.getElementById('cal-shift-ics').value = cfg.shiftIcsUrl || '';
      setCalStatus('');
      overlay.classList.add('open');
      buildModalFrame('cal-modal', 'cal-modal-frame');
    });
    document.getElementById('cal-modal-cancel').addEventListener('click', () => overlay.classList.remove('open'));
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
    document.getElementById('cal-modal-save').addEventListener('click', async () => {
      const cfg = {
        classIcsUrl: document.getElementById('cal-class-ics').value.trim(),
        shiftIcsUrl: document.getElementById('cal-shift-ics').value.trim(),
      };
      if (!cfg.classIcsUrl && !cfg.shiftIcsUrl){
        setCalStatus('Add at least one calendar\'s ICS URL.', true);
        return;
      }
      saveCalConfig(cfg);
      setCalStatus('Syncing…');
      const errors = await refreshScheduleCalendars();
      if (errors.length){
        setCalStatus(errors.join(' · '), true);
      } else {
        setCalStatus('Synced.');
      }
    });
  }

  // clock — fixed to the top-right of the viewport, independent of
  // the pannable graph
  function updateClock(){
    const now = new Date();
    document.getElementById('topbar-clock-time').textContent =
      now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    document.getElementById('topbar-clock-date').textContent =
      now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
    updateDueSoon();
  }
  // "Due Soon" reads the same To-do task data the To-do page itself
  // uses (alltodo-nodes), so it works from any page without needing
  // its own separate data entry. "Next Class" and "Next Shift" are
  // populated from linked Google Calendars — see the settings gear on
  // the clock widget, and refreshScheduleCalendars() above.
  // dueDate is captured as date+time (e.g. "2026-10-03T15:00") from
  // the To-do page's datetime-local input; older tasks saved before
  // that change only have a plain date ("2026-09-18") and fall back to
  // showing just the date since there's no real time to show
  function updateDueSoon(){
    const el = document.getElementById('topbar-due-soon');
    if (!el) return;
    let tasks = [];
    try {
      const raw = localStorage.getItem('alltodo-nodes');
      tasks = raw ? JSON.parse(raw) : [];
    } catch(e){}
    const now = Date.now();
    let nearest = null;
    tasks.forEach(t => {
      if (!t.dueDate) return;
      const hasTime = t.dueDate.includes('T');
      const d = hasTime ? new Date(t.dueDate) : new Date(t.dueDate + 'T23:59:59');
      const due = d.getTime();
      if (!isNaN(due) && due >= now && (!nearest || due < nearest.due)){
        nearest = { name: t.name, due, hasTime, date: d };
      }
    });
    if (!nearest){
      el.textContent = '—';
    } else if (nearest.hasTime){
      el.textContent = nearest.name + ' ' + nearest.date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    } else {
      el.textContent = nearest.name + ' ' + nearest.date.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }
  }
  updateClock();
  setInterval(updateClock, 1000*15);

  // ---------- add modal ----------
  const overlay = document.getElementById('modal-overlay');
  const pillsEl = document.getElementById('pills');
  Object.entries(CATS).forEach(([key, cat]) => {
    const pill = document.createElement('div');
    pill.className = 'pill' + (key === selectedCategory ? ' selected' : '');
    pill.style.color = key === selectedCategory ? cat.hex : '';
    pill.innerHTML = `<span class="dot" style="background:${cat.hex}"></span>${cat.label}`;
    pill.addEventListener('click', () => {
      selectedCategory = key;
      [...pillsEl.children].forEach(p => { p.classList.remove('selected'); p.style.color=''; });
      pill.classList.add('selected');
      pill.style.color = cat.hex;
    });
    pillsEl.appendChild(pill);
  });

  const modalSvgNS = 'http://www.w3.org/2000/svg';
  const STAR_PATH = 'M0,-10 C1.1,-3.3 3.3,-1.1 10,0 C3.3,1.1 1.1,3.3 0,10 C-1.1,3.3 -3.3,1.1 -10,0 C-3.3,-1.1 -1.1,-3.3 0,-10 Z';

  function buildModalFrame(boxId, svgId){
    boxId = boxId || 'modal';
    svgId = svgId || 'modal-frame';
    const modal = document.getElementById(boxId);
    const svg = document.getElementById(svgId);
    if (!modal || !svg) return;
    const w = modal.offsetWidth, h = modal.offsetHeight;
    if (!w || !h) return;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.innerHTML = '';

    const defs = document.createElementNS(modalSvgNS, 'defs');
    const glow = document.createElementNS(modalSvgNS, 'filter');
    glow.setAttribute('id', 'frameGlow');
    glow.setAttribute('x', '-60%'); glow.setAttribute('y', '-60%');
    glow.setAttribute('width', '220%'); glow.setAttribute('height', '220%');
    glow.innerHTML = '<feGaussianBlur stdDeviation="3.4"/>';
    defs.appendChild(glow);
    svg.appendChild(defs);

    // a solid, glowing border — its corners land exactly on each star's
    // center below, so the frame reads as running straight through them.
    // built from a soft blurred copy underneath a crisp solid line on top.
    const x = 1, y = 1, rw = w - 2, rh = h - 2;
    const glowRect = document.createElementNS(modalSvgNS, 'rect');
    glowRect.setAttribute('x', x); glowRect.setAttribute('y', y);
    glowRect.setAttribute('width', rw); glowRect.setAttribute('height', rh);
    glowRect.setAttribute('fill', 'none');
    glowRect.setAttribute('stroke', '#EDEBF7');
    glowRect.setAttribute('stroke-width', '2.5');
    glowRect.setAttribute('opacity', '0.45');
    glowRect.setAttribute('filter', 'url(#frameGlow)');
    svg.appendChild(glowRect);

    const rect = document.createElementNS(modalSvgNS, 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', rw); rect.setAttribute('height', rh);
    rect.setAttribute('fill', 'none');
    rect.setAttribute('stroke', '#EDEBF7');
    rect.setAttribute('stroke-width', '1.1');
    rect.setAttribute('opacity', '0.9');
    svg.appendChild(rect);

    [[0,0], [w,0], [0,h], [w,h]].forEach(([sx, sy]) => {
      const g = document.createElementNS(modalSvgNS, 'g');
      g.setAttribute('transform', `translate(${sx},${sy}) scale(1.05)`);
      const haloDot = document.createElementNS(modalSvgNS, 'circle');
      haloDot.setAttribute('r', 9);
      haloDot.setAttribute('fill', '#EDEBF7');
      haloDot.setAttribute('opacity', '0.35');
      haloDot.setAttribute('filter', 'url(#frameGlow)');
      g.appendChild(haloDot);
      // static — no glimmer animation, just a steady glow
      const star = document.createElementNS(modalSvgNS, 'path');
      star.setAttribute('class', 'frame-star');
      star.setAttribute('d', STAR_PATH);
      star.style.filter = 'url(#frameGlow)';
      g.appendChild(star);
      svg.appendChild(g);
    });
  }

  document.getElementById('add-btn').addEventListener('click', () => {
    document.getElementById('f-name').value = '';
    document.getElementById('f-url').value = '';
    overlay.classList.add('open');
    document.getElementById('f-name').focus();
    buildModalFrame();
  });
  document.getElementById('cancel-btn').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

  document.getElementById('save-btn').addEventListener('click', () => {
    const name = document.getElementById('f-name').value.trim();
    const url = document.getElementById('f-url').value.trim();
    if (!name || !url) return;
    nodes.push({ id: 'n'+Date.now(), name, url, category: selectedCategory });
    saveNodes();
    overlay.classList.remove('open');
    buildScene();
    relayout();
  });

  // ---------- init ----------
  (async function init(){
    await loadState();
    buildScene();
    relayout();
    // fade the whole graph in, rather than it popping in the instant
    // buildScene() finishes — respects reduced-motion by skipping
    // straight to visible instead of animating
    if (reduceMotion){
      svg.style.opacity = '1';
    } else {
      setTimeout(() => { svg.style.opacity = '1'; }, 60);
    }
    initCalSettingsUI();
    refreshScheduleCalendars();
    setInterval(refreshScheduleCalendars, 10 * 60 * 1000);
  })();
})();
</script>
</body>
</html>
