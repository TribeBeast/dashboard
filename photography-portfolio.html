<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #05060F;
    --bg-mid: #0C0F26;
    --panel: #12142C;
    --line: rgba(255,255,255,0.09);
    --text: #EDEBF7;
    --text-dim: #9296B8;
    --c-apps: #F5F3ED;
    --c-social: #DCE3EC;
    --c-projects: #E9E4F2;
    --c-other: #EDEAE0;
    --you-core: #FFFFFF;
    --you-glow: #E7E2D6;
    --you-shadow: #B9B2A0;
  }
  *{ box-sizing: border-box; }
  html{
    /* iOS specifically paints the zoomed-out / overscroll area using
       this element's solid background-color (a gradient here won't do
       it) — this is what stops white from showing when pinch-zoom
       can't be fully prevented */
    background-color: var(--bg-deep);
  }
  html, body{
    margin:0; padding:0; height:100%; min-height: 100%;
    background: radial-gradient(ellipse at 50% 40%, var(--bg-mid) 0%, var(--bg-deep) 70%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    /* iOS Safari ignores the viewport meta tag's user-scalable=no, but it
       DOES respect touch-action — this is what actually stops pinch from
       being interpreted as a zoom gesture in the first place, rather
       than just trying to hide the result after the fact */
    touch-action: pan-x pan-y;
  }

  /* ---------- background layers (same as the rest of the site) ---------- */
  #space-bg{ position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #stars{ position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star{ animation: twinkle linear infinite; }
  @keyframes twinkle{ 0%,100%{ opacity: var(--min-op); } 50%{ opacity: var(--max-op); } }

  .nebula{
    position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none;
    opacity: 0; transition: opacity 2.2s ease-out;
    animation: drift ease-in-out infinite;
  }
  .nebula.n1{ width: 460px; height: 460px; top: -140px; left: -120px; background: var(--c-projects); --op: 0.20; animation-duration: 22s; }
  .nebula.n2{ width: 380px; height: 380px; bottom: -120px; right: -100px; background: var(--c-social); --op: 0.16; animation-duration: 26s; }
  .nebula.n3{ width: 320px; height: 320px; bottom: 10%; left: 8%; background: var(--c-apps); --op: 0.13; animation-duration: 30s; }
  @keyframes drift{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(40px,26px) scale(1.12); } }

  .dust{
    position: fixed; pointer-events: none; filter: blur(60px); mix-blend-mode: screen;
    opacity: 0; transition: opacity 2.2s ease-out;
    animation: flow linear infinite; will-change: transform;
  }
  .dust.d1{ width: 780px; height: 420px; top: 8%; left: -25%;
    background: radial-gradient(ellipse at 35% 40%, var(--c-projects) 0%, transparent 65%), radial-gradient(ellipse at 65% 60%, var(--c-social) 0%, transparent 70%);
    border-radius: 42% 58% 60% 40% / 55% 45% 60% 40%; --op: 0.16; animation-duration: 95s; }
  .dust.d2{ width: 640px; height: 360px; top: 48%; left: -30%;
    background: radial-gradient(ellipse at 40% 50%, var(--c-apps) 0%, transparent 68%), radial-gradient(ellipse at 70% 35%, var(--c-projects) 0%, transparent 70%);
    border-radius: 55% 45% 40% 60% / 40% 60% 45% 55%; --op: 0.13; animation-duration: 120s; animation-delay: -40s; }
  .dust.d3{ width: 560px; height: 320px; top: 74%; left: -20%;
    background: radial-gradient(ellipse at 50% 50%, var(--c-social) 0%, transparent 65%), radial-gradient(ellipse at 30% 40%, var(--c-other) 0%, transparent 72%);
    border-radius: 48% 52% 55% 45% / 50% 50% 42% 58%; --op: 0.12; animation-duration: 80s; animation-delay: -18s; }
  @keyframes flow{ 0%{ transform: translate(0,0) rotate(0deg); } 50%{ transform: translate(72vw,-6vh) rotate(10deg); } 100%{ transform: translate(140vw,4vh) rotate(0deg); } }

  #dust-front{ position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .streak{
    position: fixed; pointer-events: none; filter: blur(34px); mix-blend-mode: screen;
    opacity: 0; transition: opacity 2.2s ease-out;
    animation: streak-flow linear infinite; will-change: transform;
  }
  .streak.s1{ width: 620px; height: 150px; top: 18%; left: -35%;
    background: radial-gradient(ellipse at 30% 50%, var(--you-glow) 0%, transparent 60%), radial-gradient(ellipse at 70% 50%, var(--c-social) 0%, transparent 65%);
    border-radius: 50% 50% 45% 55% / 65% 65% 35% 35%; --op: 0.14; animation-duration: 52s; }
  .streak.s2{ width: 520px; height: 130px; top: 62%; left: -30%;
    background: radial-gradient(ellipse at 40% 50%, var(--c-projects) 0%, transparent 62%), radial-gradient(ellipse at 65% 50%, var(--you-glow) 0%, transparent 68%);
    border-radius: 55% 45% 50% 50% / 60% 60% 40% 40%; --op: 0.12; animation-duration: 68s; animation-delay: -20s; }
  @keyframes streak-flow{ 0%{ transform: translate(0,0) rotate(-8deg) scaleX(1); } 50%{ transform: translate(70vw,3vh) rotate(-4deg) scaleX(1.08); } 100%{ transform: translate(150vw,-2vh) rotate(-8deg) scaleX(1); } }

  @media (prefers-reduced-motion: reduce){
    .dust{ animation: none; transition: none; opacity: var(--op, 0.15); }
    .nebula{ animation: none; transition: none; opacity: var(--op, 0.15); }
    .streak{ animation: none; transition: none; opacity: var(--op, 0.15); }
  }

  #warp-flash{ position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0; mix-blend-mode: screen; }

  /* ---------- the hero node, fixed near the top instead of centered ---------- */
  #portfolio-hero{
    position: fixed; top: 7%; left: 50%; transform: translateX(-50%);
    z-index: 4; text-align: center; cursor: pointer;
  }
  #hero-svg{ width: 170px; height: 170px; overflow: visible; display: block; }
  .you-halo{ transform-box: fill-box; transform-origin: center; animation: halo-breathe 7s ease-in-out infinite; }
  .you-halo-inner{ animation-delay: -3.5s; }
  @keyframes halo-breathe{ 0%,100%{ transform: scale(0.92); opacity: 0.8; } 50%{ transform: scale(1.14); opacity: 1; } }
  @media (prefers-reduced-motion: reduce){ .you-halo{ animation: none; } }
  .you-label{ font-family: 'Fraunces', serif; font-size: 14px; fill: var(--you-core); pointer-events: none; text-anchor: middle; }

  /* ---------- three looping image belts, alternating direction ---------- */
  .belt-wrap{
    position: fixed; left: 0; right: 0; height: 220px;
    overflow: hidden; z-index: 2;
  }
  #belt-wrap-top{ top: 24%; }
  #belt-wrap-mid{ top: 48%; }
  #belt-wrap-bot{ top: 72%; }
  .belt-wrap::before, .belt-wrap::after{
    content: ''; position: absolute; top: 0; bottom: 0; width: 5%; z-index: 3; pointer-events: none;
  }
  .belt-wrap::before{ left: 0; background: linear-gradient(90deg, var(--bg-deep), transparent); }
  .belt-wrap::after{ right: 0; background: linear-gradient(270deg, var(--bg-deep), transparent); }
  .belt-track{
    display: flex; gap: 20px; align-items: center; height: 100%;
    width: max-content;
    cursor: grab;
    touch-action: pan-y;
    user-select: none;
  }
  .belt-track.dragging{ cursor: grabbing; }
  .belt-item{
    width: 170px; height: 200px; flex-shrink: 0; position: relative;
    border-radius: 2px; overflow: hidden;
    border: 1px solid rgba(237,235,247,0.16);
    box-shadow: 0 18px 40px -14px rgba(0,0,0,0.6);
    background-size: cover; background-position: center;
    transition: transform 0.2s ease;
    -webkit-user-drag: none;
  }
  .belt-item:hover{ transform: translateY(-8px); }
  .belt-item .cap{
    position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 10px;
    background: linear-gradient(0deg, rgba(5,6,15,0.65), transparent);
    font-size: 11.5px; color: #fff;
  }

  /* ---------- add-picture button, bottom left ---------- */
  #add-pic-btn{
    position: fixed; left: 26px; bottom: 26px; z-index: 6;
    background: none; border: none; padding: 0; margin: 0;
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); cursor: pointer;
    transition: color .15s ease, transform .15s ease;
  }
  #add-pic-btn:hover{ color: var(--text); transform: scale(1.1); }
  #add-pic-btn svg{ width: 22px; height: 22px; }

  /* ---------- modal (same glassy, star-framed style as the rest of the site) ---------- */
  /* ---------- lightbox, for clicking a photo to view it large ---------- */
  #lightbox-overlay{
    position: fixed; inset: 0; z-index: 25;
    background: rgba(2,3,10,0.88);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 200ms ease;
  }
  #lightbox-overlay.open{ opacity: 1; pointer-events: auto; }
  #lightbox-img{
    max-width: 86vw; max-height: 80vh; object-fit: contain;
    border-radius: 2px; box-shadow: 0 30px 70px -20px rgba(0,0,0,0.7);
  }
  #lightbox-cap{
    position: absolute; bottom: 6%; left: 0; right: 0; text-align: center;
    font-size: 13.5px; color: var(--text-dim);
  }
  #lightbox-close{
    position: fixed; top: 24px; right: 26px; z-index: 26;
    background: none; border: none; color: var(--text-dim);
    font-size: 18px; cursor: pointer; padding: 6px;
  }
  #lightbox-close:hover{ color: var(--text); }
  #lightbox-delete{
    position: fixed; top: 22px; right: 66px; z-index: 26;
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; padding: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  #lightbox-delete svg{ width: 19px; height: 19px; }
  #lightbox-delete:hover{ color: #E8707A; }

  #modal-overlay{
    position: fixed; inset: 0; background: rgba(2,3,10,0.65);
    display: flex; align-items:center; justify-content:center; z-index: 20;
    opacity: 0; pointer-events: none; transition: opacity 180ms ease;
  }
  #modal-overlay.open{ opacity: 1; pointer-events: auto; }
  #modal{
    position: relative;
    background: rgba(20,18,18,0.18);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 0; padding: 28px 26px; width: 320px;
    box-shadow: 0 30px 60px -18px rgba(0,0,0,0.55);
  }
  #modal-frame{ position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .frame-star{ fill: #EDEBF7; }
  #modal h2{ font-family:'Fraunces', serif; font-weight:500; font-size:18px; margin:0 0 20px; color:#EDEBF7; text-shadow: 0 0 10px rgba(237,235,247,0.55); }
  .field{ margin-bottom: 15px; }
  .field label{ display:block; font-size: 12px; margin-bottom: 6px; color:#EDEBF7; text-shadow: 0 0 6px rgba(237,235,247,0.45); }
  .field input{
    width: 100%; background: rgba(5,6,15,0.55); border-radius: 7px;
    color: var(--text); font-family: 'Inter', sans-serif; font-size: 13.5px; padding: 9px 10px;
    border: 1px solid rgba(237,235,247,0.55);
    box-shadow: 0 0 7px 0.5px rgba(237,235,247,0.2);
  }
  .field input:focus{ outline: none; border-color: rgba(237,235,247,0.9); box-shadow: 0 0 10px 1px rgba(237,235,247,0.4); }
  .field input[type="file"]{
    padding: 8px; font-size: 12.5px; cursor: pointer;
  }
  .field input[type="file"]::file-selector-button{
    background: rgba(237,235,247,0.12); border: none; border-radius: 5px;
    color: var(--text); font-family: 'Inter', sans-serif; font-size: 12px;
    padding: 6px 10px; margin-right: 10px; cursor: pointer;
  }
  .field-note{
    font-size: 11px; color: var(--text-dim); margin: -8px 0 15px; line-height: 1.4;
    overflow-wrap: break-word; word-break: break-word;
  }
  .field-note.warn{ color: #E8B14D; }
  .or-divider{
    display: flex; align-items: center; gap: 10px;
    margin: 4px 0 15px; color: var(--text-dim); font-size: 11px;
  }
  .or-divider::before, .or-divider::after{
    content: ''; flex: 1; height: 1px; background: rgba(237,235,247,0.15);
  }
  .modal-actions{ display:flex; justify-content:flex-end; gap: 8px; margin-top: 20px; }
  button.plain-btn{
    font-family: 'Inter', sans-serif; background: rgba(255,255,255,0.04); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 9px 15px; font-size: 13.5px; cursor: pointer;
  }
  button.plain-btn:hover{ border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); }
  .btn-primary{ background: #EDEBF7; color: #0C0F26; border: none; font-weight: 600; }
  .btn-primary:hover{ background: #FFFFFF; }

  @media (max-width: 600px){
    #portfolio-hero{ top: 1.5%; }
    #hero-svg{ width: 130px; height: 130px; }
    .belt-item{ width: 108px; height: 128px; }
    .belt-track{ gap: 12px; }
    .belt-wrap{ height: 160px; }
  }
</style>
</head>
<body>

<div id="space-bg">
  <div id="stars"></div>
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>
  <div class="dust d1"></div>
  <div class="dust d2"></div>
  <div class="dust d3"></div>
</div>
<div id="dust-front">
  <div class="streak s1"></div>
  <div class="streak s2"></div>
</div>
<div id="warp-flash"></div>

<div id="portfolio-hero">
  <svg id="hero-svg" viewBox="-90 -90 180 180"></svg>
</div>

<div class="belt-wrap" id="belt-wrap-top">
  <div class="belt-track" id="belt-track-top" data-dir="1"></div>
</div>
<div class="belt-wrap" id="belt-wrap-mid">
  <div class="belt-track" id="belt-track-mid" data-dir="-1"></div>
</div>
<div class="belt-wrap" id="belt-wrap-bot">
  <div class="belt-track" id="belt-track-bot" data-dir="1"></div>
</div>

<button id="add-pic-btn" aria-label="Add a picture" title="Add a picture">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="6" width="18" height="14" rx="2"/>
    <circle cx="12" cy="13" r="3.5"/>
    <path d="M8 6l1.5-2.5h5L16 6"/>
  </svg>
</button>

<div id="lightbox-overlay">
  <button id="lightbox-close" aria-label="Close">✕</button>
  <button id="lightbox-delete" aria-label="Remove this photo" title="Remove this photo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
  </button>
  <img id="lightbox-img" alt="">
  <div id="lightbox-cap"></div>
</div>

<div id="modal-overlay">
  <div id="modal">
    <svg id="modal-frame"></svg>
    <h2>Add a picture</h2>
    <div class="field">
      <label for="f-img-file">Upload from your device</label>
      <input id="f-img-file" type="file" accept="image/*">
    </div>
    <div id="upload-warning" class="field-note"></div>
    <div class="or-divider"><span>or</span></div>
    <div class="field">
      <label for="f-img-url">Image URL</label>
      <input id="f-img-url" type="text" placeholder="https://...">
    </div>
    <div class="field">
      <label for="f-img-caption">Caption</label>
      <input id="f-img-caption" type="text" placeholder="e.g. Sunset at the pier">
    </div>
    <div class="modal-actions">
      <button id="cancel-btn" class="plain-btn">Cancel</button>
      <button id="save-btn" class="btn-primary">Add</button>
    </div>
  </div>
</div>

<script src="sync.js"></script>
<script>
(function(){
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const svgNS = 'http://www.w3.org/2000/svg';

  // ---------- starfield ----------
  (function buildStarfield(){
    const wrap = document.getElementById('stars');
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%');
    const count = window.innerWidth < 600 ? 60 : 110;
    for (let i=0; i<count; i++){
      const c = document.createElementNS(svgNS, 'circle');
      c.setAttribute('cx', Math.random()*100 + '%');
      c.setAttribute('cy', Math.random()*100 + '%');
      c.setAttribute('r', (Math.random()*1.1 + 0.4).toFixed(2));
      c.setAttribute('fill', Math.random() > 0.85 ? '#F2B85C' : '#EDEBF7');
      if (!reduceMotion){
        c.classList.add('star');
        c.style.setProperty('--min-op', (0.15 + Math.random()*0.2).toFixed(2));
        c.style.setProperty('--max-op', (0.6 + Math.random()*0.4).toFixed(2));
        c.style.animationDuration = (2 + Math.random()*4).toFixed(1) + 's';
        c.style.animationDelay = (Math.random()*4).toFixed(1) + 's';
      } else {
        c.setAttribute('opacity', '0.5');
      }
      svg.appendChild(c);
    }

    // a handful of loose constellations — small chains of stars linked by
    // faint lines, scattered across the sky. Part of the same svg as the
    // starfield above, so they pan with it exactly the same way.
    const constCount = window.innerWidth < 600 ? 3 : 5;
    for (let ci=0; ci<constCount; ci++){
      const anchorX = Math.random()*window.innerWidth;
      const anchorY = Math.random()*window.innerHeight;
      const pointCount = 4 + Math.floor(Math.random()*4);
      const pts = [];
      let px = 0, py = 0;
      for (let pi=0; pi<pointCount; pi++){
        px += (Math.random()-0.5)*120;
        py += (Math.random()-0.5)*95;
        pts.push([px, py]);
      }
      const cg = document.createElementNS(svgNS, 'g');
      cg.setAttribute('class', 'constellation');
      cg.setAttribute('transform', `translate(${anchorX.toFixed(1)},${anchorY.toFixed(1)})`);

      for (let li=0; li<pts.length-1; li++){
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', pts[li][0].toFixed(1));
        line.setAttribute('y1', pts[li][1].toFixed(1));
        line.setAttribute('x2', pts[li+1][0].toFixed(1));
        line.setAttribute('y2', pts[li+1][1].toFixed(1));
        line.setAttribute('stroke', '#EDEBF7');
        line.setAttribute('stroke-width', '0.6');
        line.setAttribute('opacity', '0.22');
        cg.appendChild(line);
      }
      pts.forEach(([x, y]) => {
        const dot = document.createElementNS(svgNS, 'circle');
        dot.setAttribute('cx', x.toFixed(1));
        dot.setAttribute('cy', y.toFixed(1));
        dot.setAttribute('r', (1.1 + Math.random()*0.6).toFixed(2));
        dot.setAttribute('fill', '#EDEBF7');
        if (!reduceMotion){
          dot.classList.add('star');
          dot.style.setProperty('--min-op', (0.35 + Math.random()*0.15).toFixed(2));
          dot.style.setProperty('--max-op', (0.75 + Math.random()*0.25).toFixed(2));
          dot.style.animationDuration = (2.5 + Math.random()*4).toFixed(1) + 's';
          dot.style.animationDelay = (Math.random()*4).toFixed(1) + 's';
        } else {
          dot.setAttribute('opacity', '0.7');
        }
        cg.appendChild(dot);
      });

      svg.appendChild(cg);
    }

    wrap.appendChild(svg);
  })();

  if (!reduceMotion){
    const clouds = document.querySelectorAll('.nebula, .dust, .streak');
    setTimeout(() => {
      clouds.forEach(el => {
        const op = getComputedStyle(el).getPropertyValue('--op').trim() || '0.15';
        el.style.opacity = op;
      });
    }, 60);
  }

  // ---------- hero node ----------
  (function buildHero(){
    const svg = document.getElementById('hero-svg');

    const defs = document.createElementNS(svgNS, 'defs');
    const glowFilter = document.createElementNS(svgNS, 'filter');
    glowFilter.setAttribute('id', 'starglow');
    glowFilter.setAttribute('x', '-100%'); glowFilter.setAttribute('y', '-100%');
    glowFilter.setAttribute('width', '300%'); glowFilter.setAttribute('height', '300%');
    glowFilter.innerHTML = '<feGaussianBlur stdDeviation="3.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>';
    defs.appendChild(glowFilter);

    const atmoGrad = document.createElementNS(svgNS, 'radialGradient');
    atmoGrad.setAttribute('id', 'atmoGrad');
    atmoGrad.innerHTML = '<stop offset="0%" stop-color="var(--you-glow)" stop-opacity="0.5"/><stop offset="55%" stop-color="var(--you-glow)" stop-opacity="0.16"/><stop offset="100%" stop-color="var(--you-glow)" stop-opacity="0"/>';
    defs.appendChild(atmoGrad);
    svg.appendChild(defs);

    const haloOuter = document.createElementNS(svgNS, 'circle');
    haloOuter.setAttribute('class', 'you-halo you-halo-outer');
    haloOuter.setAttribute('r', 68); haloOuter.setAttribute('fill', 'url(#atmoGrad)');
    const haloInner = document.createElementNS(svgNS, 'circle');
    haloInner.setAttribute('class', 'you-halo you-halo-inner');
    haloInner.setAttribute('r', 34); haloInner.setAttribute('fill', 'url(#atmoGrad)');

    const core = document.createElementNS(svgNS, 'circle');
    core.setAttribute('r', 19); core.setAttribute('fill', 'var(--you-core)'); core.setAttribute('filter', 'url(#starglow)');

    const rim = document.createElementNS(svgNS, 'circle');
    rim.setAttribute('r', 19.5); rim.setAttribute('fill', 'none');
    rim.setAttribute('stroke', 'var(--you-glow)'); rim.setAttribute('stroke-width', '0.7'); rim.setAttribute('opacity', '0.55');

    const label = document.createElementNS(svgNS, 'text');
    label.setAttribute('class', 'you-label'); label.setAttribute('y', 44);
    label.textContent = 'Portfolio';

    svg.appendChild(haloOuter); svg.appendChild(haloInner); svg.appendChild(core); svg.appendChild(rim); svg.appendChild(label);
  })();

  document.getElementById('portfolio-hero').addEventListener('click', goToPhotography);

  function goToPhotography(){
    if (reduceMotion){ window.location.href = 'photography.html'; return; }
    const hero = document.getElementById('portfolio-hero');
    hero.style.pointerEvents = 'none';
    hero.style.transition = 'opacity 300ms ease, transform 300ms ease';
    hero.style.transform = 'translateX(-50%) scale(0.7)';
    hero.style.opacity = '0';
    const flash = document.getElementById('warp-flash');
    flash.style.background = 'radial-gradient(circle at 50% 12%, var(--you-core) 0%, transparent 70%)';
    flash.style.transition = 'opacity 220ms ease';
    setTimeout(() => { flash.style.opacity = '0.7'; }, 200);
    setTimeout(() => { flash.style.opacity = '0'; }, 420);
    setTimeout(() => { window.location.href = 'photography.html'; }, 320);
  }

  // ---------- image belt ----------
  // starter photo — real content from the start, not a placeholder to be
  // wiped when you add your own; it just sits alongside whatever you add
  const DEFAULT_IMAGES = [];

  function loadImages(){
    try {
      const raw = localStorage.getItem('portfolio-images');
      return raw ? JSON.parse(raw) : null;
    } catch(e){ return null; }
  }
  function saveImages(imgs){
    localStorage.setItem('portfolio-images', JSON.stringify(imgs)); // let quota errors propagate — the caller shows the user what happened
    SiteSync.save('portfolio-images', imgs);
  }

  let images = loadImages();
  if (!images || !images.length){
    images = DEFAULT_IMAGES.map(i => ({...i}));
    // only worth persisting if there's actually a real seed photo — with
    // an empty DEFAULT_IMAGES, pushing "nothing" to the cloud on every
    // fresh visit can race against a save you make moments later (e.g.
    // adding your first photo) and, if it arrives at the server second,
    // silently overwrite your real photo with an empty array
    if (images.length){
      try { saveImages(images); } catch(e){}
    }
  }

  const BELT_TRACK_IDS = ['belt-track-top', 'belt-track-mid', 'belt-track-bot'];
  const beltState = {}; // trackId -> { pos, halfWidth, dragging, ... }

  const BELT_KEY_BY_ID = { 'belt-track-top': 'top', 'belt-track-mid': 'mid', 'belt-track-bot': 'bot' };

  function renderBeltInto(trackId){
    const track = document.getElementById(trackId);
    if (!track) return;
    track.innerHTML = '';
    const beltKey = BELT_KEY_BY_ID[trackId];
    const beltImages = images.filter(img => img.belt === beltKey);
    if (!beltImages.length) return; // nothing assigned to this belt yet
    const buildOnce = () => {
      beltImages.forEach(img => {
        const item = document.createElement('div');
        item.className = 'belt-item';
        if (img.url){
          item.style.backgroundImage = `url('${img.url}')`;
          item.dataset.imgUrl = img.url;
          item.dataset.caption = img.caption || '';
          item.dataset.imgId = img.id;
        } else {
          item.style.background = img.bg || 'linear-gradient(135deg, #DCE3EC, #F5F3ED)';
        }
        if (img.caption){
          const cap = document.createElement('div');
          cap.className = 'cap';
          cap.textContent = img.caption;
          item.appendChild(cap);
        }
        track.appendChild(item);
      });
    };
    buildOnce();
    buildOnce(); // duplicate the exact same set — with no extra padding thrown
                 // into the mix, this half-width is exactly what it needs to be
                 // for the loop below to wrap with zero visible seam
  }
  function renderBelt(){
    BELT_TRACK_IDS.forEach(renderBeltInto);
    BELT_TRACK_IDS.forEach(measureBelt);
  }

  function measureBelt(trackId){
    const track = document.getElementById(trackId);
    if (!track) return;
    const st = beltState[trackId] || (beltState[trackId] = { pos: 0, dragging: false, hovering: false });
    st.halfWidth = track.scrollWidth / 2;
  }

  function wrapPos(pos, halfWidth){
    if (!halfWidth) return pos;
    pos = pos % halfWidth;
    if (pos > 0) pos -= halfWidth;
    return pos;
  }

  // ---------- drag-to-scroll, on the same position value the auto-scroll uses ----------
  function setupBeltDrag(trackId){
    const track = document.getElementById(trackId);
    if (!track) return;
    const st = beltState[trackId];

    track.addEventListener('pointerdown', e => {
      st.dragging = true;
      st.dragStartX = e.clientX;
      st.dragStartPos = st.pos;
      st.moved = false;
      st.downTarget = e.target.closest('.belt-item');
      track.classList.add('dragging');
      track.setPointerCapture(e.pointerId);
    });
    track.addEventListener('pointermove', e => {
      if (!st.dragging) return;
      const dx = e.clientX - st.dragStartX;
      if (Math.abs(dx) > 4) st.moved = true;
      st.pos = wrapPos(st.dragStartPos + dx, st.halfWidth);
    });
    function endDrag(){
      // a pointerdown/up with no real movement in between counts as a
      // click on whatever image was under it, rather than a drag
      if (st.dragging && !st.moved && st.downTarget && st.downTarget.dataset.imgUrl){
        openLightbox(st.downTarget.dataset.imgUrl, st.downTarget.dataset.caption, st.downTarget.dataset.imgId);
      }
      st.dragging = false;
      st.downTarget = null;
      track.classList.remove('dragging');
    }
    track.addEventListener('pointerup', endDrag);
    track.addEventListener('pointercancel', endDrag);
    track.addEventListener('pointerenter', () => { st.hovering = true; });
    track.addEventListener('pointerleave', () => { st.hovering = false; if (st.dragging) endDrag(); });
  }

  // ---------- lightbox ----------
  let lightboxImgId = null;
  function openLightbox(url, caption, imgId){
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox-cap').textContent = caption || '';
    lightboxImgId = imgId || null;
    document.getElementById('lightbox-overlay').classList.add('open');
  }
  function closeLightbox(){
    document.getElementById('lightbox-overlay').classList.remove('open');
    lightboxImgId = null;
  }
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.getElementById('lightbox-delete').addEventListener('click', () => {
    if (!lightboxImgId) return;
    images = images.filter(img => img.id !== lightboxImgId);
    try { saveImages(images); } catch(e){}
    closeLightbox();
    renderBelt();
  });
  document.getElementById('lightbox-overlay').addEventListener('click', e => {
    if (e.target.id === 'lightbox-overlay') closeLightbox();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });

  // one rAF loop drives every belt's auto-scroll AND reflects any drag —
  // both write to the same `pos`, so there's never a fight between them
  const BELT_SPEED = 16; // px/sec
  let beltLastTs = null;
  function beltFrame(ts){
    if (beltLastTs === null) beltLastTs = ts;
    const dt = Math.min((ts - beltLastTs) / 1000, 0.1);
    beltLastTs = ts;

    if (!reduceMotion){
      BELT_TRACK_IDS.forEach(id => {
        const track = document.getElementById(id);
        const st = beltState[id];
        if (!track || !st) return;
        if (!st.dragging && !st.hovering){
          const dir = parseFloat(track.dataset.dir) || -1;
          st.pos = wrapPos(st.pos + dir * BELT_SPEED * dt, st.halfWidth);
        }
        track.style.transform = `translateX(${st.pos}px)`;
      });
    }
    requestAnimationFrame(beltFrame);
  }

  renderBelt();
  BELT_TRACK_IDS.forEach(setupBeltDrag);
  // start each belt at a different point along its loop, purely cosmetic
  BELT_TRACK_IDS.forEach((id, i) => {
    const st = beltState[id];
    if (st) st.pos = wrapPos(-i * 260, st.halfWidth);
  });
  requestAnimationFrame(beltFrame);
  window.addEventListener('resize', () => BELT_TRACK_IDS.forEach(measureBelt));

  // check the cloud for a fresher copy (e.g. a photo added on another
  // device) after the initial local render, so the page never sits
  // blank waiting on the network but still catches up shortly after
  (async () => {
    const fresher = await SiteSync.loadFreshest('portfolio-images', true);
    if (fresher && JSON.stringify(fresher) !== JSON.stringify(images)){
      images = fresher;
      renderBelt();
    }
  })();

  // ---------- add picture modal ----------
  const overlay = document.getElementById('modal-overlay');
  const modalSvgNS = svgNS;
  const STAR_PATH = 'M0,-10 C1.1,-3.3 3.3,-1.1 10,0 C3.3,1.1 1.1,3.3 0,10 C-1.1,3.3 -3.3,1.1 -10,0 C-3.3,-1.1 -1.1,-3.3 0,-10 Z';

  function buildModalFrame(){
    const modal = document.getElementById('modal');
    const svg = document.getElementById('modal-frame');
    const w = modal.offsetWidth, h = modal.offsetHeight;
    if (!w || !h) return;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w); svg.setAttribute('height', h);
    svg.innerHTML = '';

    const defs = document.createElementNS(modalSvgNS, 'defs');
    const glow = document.createElementNS(modalSvgNS, 'filter');
    glow.setAttribute('id', 'frameGlow');
    glow.setAttribute('x', '-60%'); glow.setAttribute('y', '-60%');
    glow.setAttribute('width', '220%'); glow.setAttribute('height', '220%');
    glow.innerHTML = '<feGaussianBlur stdDeviation="3.4"/>';
    defs.appendChild(glow);
    svg.appendChild(defs);

    const x = 1, y = 1, rw = w - 2, rh = h - 2;
    const glowRect = document.createElementNS(modalSvgNS, 'rect');
    glowRect.setAttribute('x', x); glowRect.setAttribute('y', y);
    glowRect.setAttribute('width', rw); glowRect.setAttribute('height', rh);
    glowRect.setAttribute('fill', 'none'); glowRect.setAttribute('stroke', '#EDEBF7');
    glowRect.setAttribute('stroke-width', '2.5'); glowRect.setAttribute('opacity', '0.45');
    glowRect.setAttribute('filter', 'url(#frameGlow)');
    svg.appendChild(glowRect);

    const rect = document.createElementNS(modalSvgNS, 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', rw); rect.setAttribute('height', rh);
    rect.setAttribute('fill', 'none'); rect.setAttribute('stroke', '#EDEBF7');
    rect.setAttribute('stroke-width', '1.1'); rect.setAttribute('opacity', '0.9');
    svg.appendChild(rect);

    [[0,0],[w,0],[0,h],[w,h]].forEach(([sx, sy]) => {
      const g = document.createElementNS(modalSvgNS, 'g');
      g.setAttribute('transform', `translate(${sx},${sy}) scale(1.05)`);
      const haloDot = document.createElementNS(modalSvgNS, 'circle');
      haloDot.setAttribute('r', 9); haloDot.setAttribute('fill', '#EDEBF7');
      haloDot.setAttribute('opacity', '0.35'); haloDot.setAttribute('filter', 'url(#frameGlow)');
      g.appendChild(haloDot);
      const star = document.createElementNS(modalSvgNS, 'path');
      star.setAttribute('class', 'frame-star'); star.setAttribute('d', STAR_PATH);
      star.style.filter = 'url(#frameGlow)';
      g.appendChild(star);
      svg.appendChild(g);
    });
  }

  let pendingFileDataUrl = null;

  document.getElementById('add-pic-btn').addEventListener('click', () => {
    document.getElementById('f-img-url').value = '';
    document.getElementById('f-img-caption').value = '';
    document.getElementById('f-img-file').value = '';
    document.getElementById('upload-warning').textContent = '';
    document.getElementById('upload-warning').className = 'field-note';
    pendingFileDataUrl = null;
    overlay.classList.add('open');
    buildModalFrame();
  });
  document.getElementById('cancel-btn').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

  // reading a local file as a data URL, since there's no server to upload
  // it to — this is what actually lets an offline photo end up in the belt
  // shrinks and re-compresses the image on a canvas before it ever gets
  // stored — a 40MP camera photo is enormous, but the belt only ever
  // displays it at ~170x200px, so there's nothing to lose by resizing
  // down to something the browser can actually store cheaply
  function compressImage(file, maxSide, quality){
    return new Promise((resolve, reject) => {
      const objectUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxSide){
          height = Math.round(height * (maxSide / width));
          width = maxSide;
        } else if (height >= width && height > maxSide){
          width = Math.round(width * (maxSide / height));
          height = maxSide;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(objectUrl);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('Could not read that image')); };
      img.src = objectUrl;
    });
  }

  document.getElementById('f-img-file').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    const note = document.getElementById('upload-warning');
    pendingFileDataUrl = null;
    if (!file) { note.textContent = ''; note.className = 'field-note'; return; }

    const originalMB = file.size / (1024*1024);
    note.textContent = `Compressing ${originalMB.toFixed(1)}MB photo…`;
    note.className = 'field-note';

    compressImage(file, 900, 0.82).then(dataUrl => {
      pendingFileDataUrl = dataUrl;
      const compressedKB = (dataUrl.length * 0.75) / 1024; // rough decoded size from base64 length
      note.textContent = `Compressed from ${originalMB.toFixed(1)}MB down to ~${(compressedKB/1024).toFixed(2)}MB — ready to add.`;
      note.className = 'field-note';
    }).catch(err => {
      note.textContent = err.message || 'Could not process that file — try a different one.';
      note.className = 'field-note warn';
    });
  });

  document.getElementById('save-btn').addEventListener('click', () => {
    const url = document.getElementById('f-img-url').value.trim();
    const caption = document.getElementById('f-img-caption').value.trim();
    const finalUrl = pendingFileDataUrl || url;
    if (!finalUrl) return;
    try {
      // spread new additions round-robin across the three belts, so a
      // single photo never gets duplicated into more than one of them
      const belts = ['top', 'mid', 'bot'];
      const belt = belts[images.length % belts.length];
      images.push({ id: 'img'+Date.now(), url: finalUrl, caption, belt });
      saveImages(images);
    } catch(e){
      document.getElementById('upload-warning').textContent = 'Could not save — storage is likely full. Try a smaller photo or remove some existing ones.';
      document.getElementById('upload-warning').className = 'field-note warn';
      return;
    }
    overlay.classList.remove('open');
    renderBelt();
  });
})();
</script>
</body>
</html>
