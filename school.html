<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #05060F;
    --bg-mid: #0C0F26;
    --panel: #12142C;
    --line: rgba(255,255,255,0.09);
    --text: #EDEBF7;
    --text-dim: #9296B8;
    --c-apps: #E13A46;
    --c-social: #E55581;
    --c-projects: #DE4824;
    --c-other: #EAA978;
    --you-core: #EF7D85;
    --you-glow: #F2C2C6;
    --you-shadow: #99111B;
  }
  *{ box-sizing: border-box; }
  html{
    /* iOS specifically paints the zoomed-out / overscroll area using
       this element's solid background-color (a gradient here won't do
       it) — this is what stops white from showing when pinch-zoom
       can't be fully prevented */
    background-color: var(--bg-deep);
  }
  html, body{
    margin:0; padding:0; height:100%; min-height: 100%;
    background: radial-gradient(ellipse at 50% 40%, var(--bg-mid) 0%, var(--bg-deep) 70%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  #space-bg{
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    will-change: transform;
  }
  #stars{ position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star{ animation: twinkle linear infinite; }
  @keyframes twinkle{
    0%, 100% { opacity: var(--min-op); }
    50% { opacity: var(--max-op); }
  }

  .nebula{
    position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none;
    opacity: 0;
    transition: opacity 2.2s ease-out;
    animation: drift ease-in-out infinite;
  }
  .nebula.n1{ width: 460px; height: 460px; top: -140px; left: -120px; background: var(--c-projects); --op: 0.20; animation-duration: 22s; }
  .nebula.n2{ width: 380px; height: 380px; bottom: -120px; right: -100px; background: var(--c-social); --op: 0.16; animation-duration: 26s; }
  .nebula.n3{ width: 320px; height: 320px; bottom: 10%; left: 8%; background: var(--c-apps); --op: 0.13; animation-duration: 30s; }
  @keyframes drift{
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(40px, 26px) scale(1.12); }
  }

  /* slow-moving dust clouds that drift across the whole scene, behind everything */
  .dust{
    position: fixed; pointer-events: none;
    filter: blur(60px);
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 2.2s ease-out;
    animation: flow linear infinite;
    will-change: transform;
  }
  .dust.d1{
    width: 780px; height: 420px; top: 8%; left: -25%;
    background: radial-gradient(ellipse at 35% 40%, var(--c-projects) 0%, transparent 65%),
                radial-gradient(ellipse at 65% 60%, var(--c-social) 0%, transparent 70%);
    border-radius: 42% 58% 60% 40% / 55% 45% 60% 40%;
    --op: 0.16;
    animation-duration: 95s;
  }
  .dust.d2{
    width: 640px; height: 360px; top: 48%; left: -30%;
    background: radial-gradient(ellipse at 40% 50%, var(--c-apps) 0%, transparent 68%),
                radial-gradient(ellipse at 70% 35%, var(--c-projects) 0%, transparent 70%);
    border-radius: 55% 45% 40% 60% / 40% 60% 45% 55%;
    --op: 0.13;
    animation-duration: 120s;
    animation-delay: -40s;
  }
  .dust.d3{
    width: 560px; height: 320px; top: 74%; left: -20%;
    background: radial-gradient(ellipse at 50% 50%, var(--c-social) 0%, transparent 65%),
                radial-gradient(ellipse at 30% 40%, var(--c-other) 0%, transparent 72%);
    border-radius: 48% 52% 55% 45% / 50% 50% 42% 58%;
    --op: 0.12;
    animation-duration: 80s;
    animation-delay: -18s;
  }
  @keyframes flow{
    0%   { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(72vw, -6vh) rotate(10deg); }
    100% { transform: translate(140vw, 4vh) rotate(0deg); }
  }

  /* NEW: a second, different dust layer in front of the graph — thinner,
     streakier wisps that pass closer to the viewer than the background dust */
  #dust-front{ position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .streak{
    position: fixed;
    filter: blur(34px);
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 2.2s ease-out;
    animation: streak-flow linear infinite;
    will-change: transform;
  }
  .streak.s1{
    width: 620px; height: 150px; top: 18%; left: -35%;
    background: radial-gradient(ellipse at 30% 50%, var(--you-glow) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, var(--c-social) 0%, transparent 65%);
    border-radius: 50% 50% 45% 55% / 65% 65% 35% 35%;
    --op: 0.14;
    animation-duration: 52s;
  }
  .streak.s2{
    width: 520px; height: 130px; top: 62%; left: -30%;
    background: radial-gradient(ellipse at 40% 50%, var(--c-projects) 0%, transparent 62%),
                radial-gradient(ellipse at 65% 50%, var(--you-glow) 0%, transparent 68%);
    border-radius: 55% 45% 50% 50% / 60% 60% 40% 40%;
    --op: 0.12;
    animation-duration: 68s;
    animation-delay: -20s;
  }
  @keyframes streak-flow{
    0%   { transform: translate(0, 0) rotate(-8deg) scaleX(1); }
    50%  { transform: translate(70vw, 3vh) rotate(-4deg) scaleX(1.08); }
    100% { transform: translate(150vw, -2vh) rotate(-8deg) scaleX(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .dust{ animation: none; transition: none; opacity: var(--op, 0.15); }
    .nebula{ animation: none; transition: none; opacity: var(--op, 0.15); }
    .streak{ animation: none; transition: none; opacity: var(--op, 0.15); }
  }

  #warp-flash{
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    opacity: 0;
    mix-blend-mode: screen;
  }

  #fab-controls{
    position: fixed; right: 26px; bottom: 26px; z-index: 6;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .icon-btn{
    background: none; border: none; padding: 0; margin: 0;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    text-decoration: none;
    cursor: pointer;
    transition: color .15s ease, transform .15s ease;
  }
  .icon-btn:hover{ color: var(--text); transform: scale(1.1); }
  .icon-btn:focus-visible{ outline: 2px solid var(--c-projects); outline-offset: 4px; border-radius: 50%; }
  .icon-btn svg{ width: 22px; height: 22px; display: block; }
  button{
    font-family: 'Inter', sans-serif;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 15px;
    font-size: 13.5px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  button:hover{ border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); }
  button:focus-visible{ outline: 2px solid var(--c-projects); outline-offset: 2px; }

  svg#graph{ width: 100vw; height: 100vh; display:block; cursor: grab; position: relative; z-index: 1; user-select: none; -webkit-user-select: none; }
  svg#graph.dragging{ cursor: grabbing; }

  .node-label{
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    fill: var(--text-dim);
    pointer-events: none;
    transition: fill .15s ease;
    /* a solid backdrop behind the text, so a connecting line or a
       neighboring node passing near/behind a label never makes it
       unreadable — the halo just paints over whatever's there */
    paint-order: stroke fill;
    stroke: var(--bg-deep);
    stroke-width: 3px;
    stroke-linejoin: round;
  }
  .node-circle{ transition: filter .15s ease; }
  .node-group{ cursor: pointer; }
  .node-group:hover .node-circle{ filter: brightness(1.3); }
  .star-wrap{
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.15s ease;
  }
  .node-group:hover .star-wrap{ transform: scale(1.4); }
  .hit-area{ fill: transparent; pointer-events: all; }
  .node-label{ user-select: none; }
  .you-label{ user-select: none; }
  .node-star{
    transform-box: fill-box;
    transform-origin: center;
    animation-name: glimmer;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }
  @keyframes glimmer{
    0%, 100% { transform: scale(var(--s-min, 0.8)) rotate(0deg); opacity: var(--o-min, 0.65); }
    50% { transform: scale(var(--s-max, 1.2)) rotate(var(--rot, 5deg)); opacity: var(--o-max, 1); }
  }
  @media (prefers-reduced-motion: reduce){
    .node-star{ animation: none; }
  }

  .you-label{
    font-family: 'Fraunces', serif;
    font-size: 15px;
    fill: var(--you-core);
    pointer-events: none;
    text-anchor: middle;
  }
  .you-node{ cursor: pointer; }
  .you-halo{
    transform-box: fill-box;
    transform-origin: center;
    animation: halo-breathe 7s ease-in-out infinite;
  }
  .you-halo-inner{ animation-delay: -3.5s; }
  @keyframes halo-breathe{
    0%, 100% { transform: scale(0.92); opacity: 0.8; }
    50% { transform: scale(1.14); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce){
    .you-halo{ animation: none; }
  }


  /* Drawer */
  #drawer{
    position: fixed; top:0; right:0; height: 100vh; width: 320px;
    background: rgba(20,18,18,0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transform: translateX(100%);
    transition: transform .25s ease;
    z-index: 10;
    padding: 28px 24px;
    overflow-y: auto;
  }
  #drawer.open{ transform: translateX(0); }
  #drawer-frame{
    position: absolute; inset: 0; overflow: visible; pointer-events: none;
  }
  #drawer h2{
    font-family:'Fraunces', serif; font-weight: 500;
    font-size: 18px; margin: 0 0 4px;
  }
  .drawer-section{ margin-top: 26px; }
  .drawer-section h3{
    font-size: 12px; color: var(--text-dim); font-weight: 500;
    margin: 0 0 10px; letter-spacing: 0.3px;
  }
  .gcal-toggle-btn{
    background: none; border: none; color: var(--text-dim);
    font-size: 11.5px; padding: 6px 0 0; margin: 0;
    cursor: pointer; text-decoration: underline;
  }
  .gcal-toggle-btn:hover{ color: var(--text); background: none; border: none; }
  #clock{
    font-family: 'Fraunces', serif;
    font-size: 40px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--you-core);
  }
  #clock-date{ color: var(--text-dim); font-size: 13px; margin-top: 6px; }
  textarea#notes{
    width: 100%; min-height: 120px; resize: vertical;
    background: var(--bg-deep); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font-family: 'Inter', sans-serif; font-size: 13.5px;
    padding: 10px; line-height: 1.5;
  }
  textarea#notes:focus{ outline: 1px solid var(--c-projects); }
  .link-row{
    display:flex; align-items:center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .link-row:last-child{ border-bottom: none; }
  .link-row .dot{
    width: 8px; height: 8px; border-radius: 50%; display:inline-block; margin-right: 9px;
  }
  .link-row .name{ flex: 1; }
  .link-row button{
    padding: 3px 8px; font-size: 11.5px; border-radius: 6px;
  }
  .drawer-close{
    position: absolute; top: 24px; right: 22px;
    background: none; border: none; color: var(--text-dim); font-size: 18px;
    padding: 2px 6px;
  }
  .drawer-close:hover{ color: var(--text); background: none; border:none; }
  .empty-note{ color: var(--text-dim); font-size: 13px; }

  /* Modal */
  #modal-overlay{
    position: fixed; inset: 0; background: rgba(2,3,10,0.65);
    display: flex; align-items:center; justify-content:center; z-index: 20;
    opacity: 0; pointer-events: none;
    transition: opacity 180ms ease;
  }
  #modal-overlay.open{ opacity: 1; pointer-events: auto; }
  #modal{
    position: relative;
    background: rgba(20,18,18,0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: none;
    border-radius: 0;
    padding: 28px 26px;
    width: 320px;
    box-shadow: 0 30px 60px -18px rgba(0,0,0,0.55);
  }
  #modal-frame{
    position: absolute; inset: 0; overflow: visible; pointer-events: none;
  }
  .frame-star{ fill: #EDEBF7; }
  #gcal-box{ position: relative; }
  #modal h2{
    font-family:'Fraunces', serif; font-weight:500; font-size:18px; margin:0 0 20px;
    color: #EDEBF7;
    text-shadow: 0 0 10px rgba(237,235,247,0.55);
  }
  .field{ margin-bottom: 15px; }
  .field label{
    display:block; font-size: 12px; margin-bottom: 6px;
    color: #EDEBF7;
    text-shadow: 0 0 6px rgba(237,235,247,0.45);
  }
  .field input{
    width: 100%; background: rgba(5,6,15,0.55); border-radius: 7px;
    color: var(--text); font-family: 'Inter', sans-serif; font-size: 13.5px; padding: 9px 10px;
    border: 1px solid rgba(237,235,247,0.55);
    box-shadow: 0 0 7px 0.5px rgba(237,235,247,0.2);
  }
  .field input:focus{
    outline: none;
    border-color: rgba(237,235,247,0.9);
    box-shadow: 0 0 10px 1px rgba(237,235,247,0.4);
  }
  .pills{ display:flex; gap: 8px; flex-wrap: wrap; }
  .pill{
    border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px;
    font-size: 12.5px; cursor:pointer; color: var(--text-dim);
    display:flex; align-items:center; gap:6px;
  }
  .pill .dot{ width:7px; height:7px; border-radius:50%; }
  .pill.selected{ color: var(--text); border-color: currentColor; }
  .modal-actions{ display:flex; justify-content:flex-end; gap: 8px; margin-top: 20px; }
  .btn-primary{ background: #EDEBF7; color: #0C0F26; border: none; font-weight: 600; }
  .btn-primary:hover{ background: #FFFFFF; }

  @media (prefers-reduced-motion: reduce){
    .nebula{ animation: none; opacity: var(--op, 0.15); }
    .star{ animation: none; }
  }
</style>
</head>
<body>

<div id="space-bg">
  <div id="stars"></div>
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>
  <div class="dust d1"></div>
  <div class="dust d2"></div>
  <div class="dust d3"></div>
</div>

<div id="fab-controls">
  <button id="home-icon-btn" class="icon-btn" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/></svg></button>
  <button id="drawer-toggle" class="icon-btn" aria-label="Widgets" title="Widgets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="1.6" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r="1.6" fill="currentColor" stroke="none"/></svg></button>
  <button id="add-btn" class="icon-btn" aria-label="Add a link" title="Add a link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
</div>

<svg id="graph"></svg>
<div id="warp-flash"></div>

<div id="dust-front">
  <div class="streak s1"></div>
  <div class="streak s2"></div>
</div>


<div id="drawer">
  <svg id="drawer-frame"></svg>
  <button class="drawer-close" id="drawer-close" aria-label="Close">✕</button>
  <h2>Widgets</h2>

  <div class="drawer-section">
    <h3>Right now</h3>
    <div id="clock">--:--</div>
    <div id="clock-date"></div>
  </div>

  <div class="drawer-section">
    <h3>Upcoming</h3>
    <div id="gcal-box">
      <div id="gcal-list" class="empty-note">Connect a calendar to see your next event here.</div>
      <button id="gcal-toggle" class="gcal-toggle-btn">⚙ Manage calendars</button>
      <div id="gcal-settings" style="display:none;">
        <div class="field" style="margin-top:12px;">
          <label for="gc-key">Google API key</label>
          <input id="gc-key" type="password" placeholder="AIza...">
        </div>

        <div id="gc-cal-rows"></div>

        <div class="field">
          <label for="gc-new-label">Calendar name</label>
          <input id="gc-new-label" type="text" placeholder="e.g. Shifts">
        </div>
        <div class="field">
          <label for="gc-new-id">Calendar ID</label>
          <input id="gc-new-id" type="text" placeholder="you@gmail.com or ...@group.calendar.google.com">
        </div>
        <button id="gc-add-cal" style="width:100%;">+ Add calendar</button>

        <button id="gc-save-sync" class="btn-primary" style="width:100%; margin-top:10px;">Save & sync</button>
        <div id="gc-status" class="empty-note" style="margin-top:10px;"></div>
      </div>
    </div>
  </div>

  <div class="drawer-section">
    <h3>Notes to self</h3>
    <textarea id="notes" placeholder="Jot something down — it stays here next time you visit."></textarea>
  </div>

  <div class="drawer-section">
    <h3>Your links</h3>
    <div id="link-list"></div>
  </div>

</div>

<div id="modal-overlay">
  <div id="modal">
    <svg id="modal-frame"></svg>
    <h2>Add a link</h2>
    <div class="field">
      <label for="f-name">Name</label>
      <input id="f-name" type="text" placeholder="e.g. Figma">
    </div>
    <div class="field">
      <label for="f-url">URL</label>
      <input id="f-url" type="text" placeholder="e.g. figma.com">
    </div>
    <div class="field">
      <label>Category</label>
      <div class="pills" id="pills"></div>
    </div>
    <div class="modal-actions">
      <button id="cancel-btn">Cancel</button>
      <button id="save-btn" class="btn-primary">Add</button>
    </div>
  </div>
</div>

<script src="sync.js"></script>
<script>
(function(){
  const CATS = {
    apps:     { label: 'School', hex: '#E13A46' },
    social:   { label: 'School', hex: '#E55581' },
    projects: { label: 'School', hex: '#DE4824' },
    other:    { label: 'School', hex: '#EAA978' },
  };

  const DEFAULT_NODES = [
    { id: 'n1', name: 'Canvas', url: 'https://canvas.ucsd.edu/', category: 'apps' },
    { id: 'n2', name: 'Drive',  url: 'https://drive.google.com/drive/u/1/my-drive', category: 'social' },
    { id: 'n3', name: 'To-do',  url: 'todo.html', category: 'projects' },
  ];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // fade the nebula/dust/streak clouds in from nothing shortly after load.
  // uses setTimeout rather than requestAnimationFrame — rAF can be fully
  // paused by the browser for a tab that isn't focused, which left these
  // invisible indefinitely until the tab regained focus
  if (!reduceMotion){
    const clouds = document.querySelectorAll('.nebula, .dust, .streak');
    setTimeout(() => {
      clouds.forEach(el => {
        const op = getComputedStyle(el).getPropertyValue('--op').trim() || '0.15';
        el.style.opacity = op;
      });
    }, 60);
  }

  // ---------- starfield ----------
  (function buildStarfield(){
    const wrap = document.getElementById('stars');
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%');
    const count = window.innerWidth < 600 ? 60 : 110;
    for (let i=0; i<count; i++){
      const c = document.createElementNS(svgNS, 'circle');
      c.setAttribute('cx', Math.random()*100 + '%');
      c.setAttribute('cy', Math.random()*100 + '%');
      c.setAttribute('r', (Math.random()*1.1 + 0.4).toFixed(2));
      c.setAttribute('fill', Math.random() > 0.85 ? '#F2B85C' : '#EDEBF7');
      if (!reduceMotion){
        c.classList.add('star');
        c.style.setProperty('--min-op', (0.15 + Math.random()*0.2).toFixed(2));
        c.style.setProperty('--max-op', (0.6 + Math.random()*0.4).toFixed(2));
        c.style.animationDuration = (2 + Math.random()*4).toFixed(1) + 's';
        c.style.animationDelay = (Math.random()*4).toFixed(1) + 's';
      } else {
        c.setAttribute('opacity', '0.5');
      }
      svg.appendChild(c);
    }

    // a handful of loose constellations — small chains of stars linked by
    // faint lines, scattered across the sky. Part of the same svg as the
    // starfield above, so they pan with it exactly the same way.
    const constCount = window.innerWidth < 600 ? 3 : 5;
    for (let ci=0; ci<constCount; ci++){
      const anchorX = Math.random()*window.innerWidth;
      const anchorY = Math.random()*window.innerHeight;
      const pointCount = 4 + Math.floor(Math.random()*4);
      const pts = [];
      let px = 0, py = 0;
      for (let pi=0; pi<pointCount; pi++){
        px += (Math.random()-0.5)*120;
        py += (Math.random()-0.5)*95;
        pts.push([px, py]);
      }
      const cg = document.createElementNS(svgNS, 'g');
      cg.setAttribute('class', 'constellation');
      cg.setAttribute('transform', `translate(${anchorX.toFixed(1)},${anchorY.toFixed(1)})`);

      for (let li=0; li<pts.length-1; li++){
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', pts[li][0].toFixed(1));
        line.setAttribute('y1', pts[li][1].toFixed(1));
        line.setAttribute('x2', pts[li+1][0].toFixed(1));
        line.setAttribute('y2', pts[li+1][1].toFixed(1));
        line.setAttribute('stroke', '#EDEBF7');
        line.setAttribute('stroke-width', '0.6');
        line.setAttribute('opacity', '0.22');
        cg.appendChild(line);
      }
      pts.forEach(([x, y]) => {
        const dot = document.createElementNS(svgNS, 'circle');
        dot.setAttribute('cx', x.toFixed(1));
        dot.setAttribute('cy', y.toFixed(1));
        dot.setAttribute('r', (1.1 + Math.random()*0.6).toFixed(2));
        dot.setAttribute('fill', '#EDEBF7');
        if (!reduceMotion){
          dot.classList.add('star');
          dot.style.setProperty('--min-op', (0.35 + Math.random()*0.15).toFixed(2));
          dot.style.setProperty('--max-op', (0.75 + Math.random()*0.25).toFixed(2));
          dot.style.animationDuration = (2.5 + Math.random()*4).toFixed(1) + 's';

    wrap.appendChild(svg);
  })();

  const svg = document.getElementById('graph');
  const svgNS = 'http://www.w3.org/2000/svg';
  let W = window.innerWidth, H = window.innerHeight;
  let cx = W/2, cy = H/2;

  let nodes = [];
  let selectedCategory = 'apps';
  let pan = {x:0, y:0};
  let panning = false, panStart = null;

  // ---------- storage (plain localStorage, works on any host) ----------
  async function loadState(){
    const saved = await SiteSync.loadFreshest('school-nodes', true);
    nodes = saved && saved.length ? saved : DEFAULT_NODES.map(n => ({...n}));

    const nt = await SiteSync.loadFreshest('school-notes', false);
    if (nt) document.getElementById('notes').value = nt;
  }
  async function saveNodes(){
    SiteSync.save('school-nodes', nodes);
  }
  async function saveNotes(val){

  }


  // ---------- Google Calendar: shared "Upcoming" widget ----------
  // stored under one unprefixed key so every page (same origin) reads
  // and writes the exact same data — add a calendar once, see it everywhere
  function loadGcalConfig(){
    try {
      const raw = localStorage.getItem('gcal-config');
      return raw ? JSON.parse(raw) : { apiKey: '', calendars: [] };
    } catch(e){ return { apiKey: '', calendars: [] }; }
  }
  function saveGcalConfig(cfg){
    SiteSync.save('gcal-config', cfg);
  }
  function setGcStatus(msg, isError){
    const el = document.getElementById('gc-status');
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? (CATS.apps?.hex || '#E4483C') : '';
  }
  function formatEventWhen(ev){
    const start = ev.start.dateTime || ev.start.date;
    const d = new Date(start);
    if (ev.start.date && !ev.start.dateTime){
      return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ' (all day)';
    }
    return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })
      + ' · ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function renderGcCalRows(){
    const cfg = loadGcalConfig();
    const wrap = document.getElementById('gc-cal-rows');
    if (!wrap) return;
    if (!cfg.calendars.length){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = cfg.calendars.map(cal => `
      <div class="link-row">
        <span class="dot" style="background:${CATS.apps?.hex || '#EDEBF7'}"></span>
        <span class="name">${cal.label}</span>
        <button data-remove-cal="${cal.id}">Remove</button>
      </div>
    `).join('');
    wrap.querySelectorAll('[data-remove-cal]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cfg2 = loadGcalConfig();
        cfg2.calendars = cfg2.calendars.filter(c => c.id !== btn.dataset.removeCal);
        saveGcalConfig(cfg2);
        renderGcCalRows();
      });
    });
  }
  async function fetchCalendarEvents(apiKey, calendarId){
    const timeMin = new Date().toISOString();
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calendarId)}/events`
      + `?key=${encodeURIComponent(apiKey)}&timeMin=${encodeURIComponent(timeMin)}`
      + `&maxResults=5&orderBy=startTime&singleEvents=true`;
    const res = await fetch(url);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || ('Request failed (' + res.status + ')'));
    return data.items || [];
  }
  async function syncAllCalendars(){
    const cfg = loadGcalConfig();
    const listEl = document.getElementById('gcal-list');
    if (!cfg.apiKey || !cfg.calendars.length){
      setGcStatus(!cfg.apiKey ? 'Add your API key first.' : 'Add a calendar to sync.', true);
      if (listEl){ listEl.textContent = 'Connect a calendar to see your next event here.'; listEl.className = 'empty-note'; }
      return;
    }
    setGcStatus('Syncing…');
    try {
      const all = [];
      for (const cal of cfg.calendars){
        const items = await fetchCalendarEvents(cfg.apiKey, cal.calendarId);
        items.forEach(ev => all.push({ ev, label: cal.label }));
      }
      all.sort((a, b) => {
        const ta = new Date(a.ev.start.dateTime || a.ev.start.date).getTime();
        const tb = new Date(b.ev.start.dateTime || b.ev.start.date).getTime();
        return ta - tb;
      });
      const top = all.slice(0, 1); // just the next upcoming event
      if (listEl){
        if (!top.length){
          listEl.textContent = 'Nothing upcoming.';
          listEl.className = 'empty-note';
        } else {
          listEl.className = '';
          listEl.innerHTML = top.map(({ev, label}) => `
            <div class="link-row">
              <span class="dot" style="background:${CATS.apps?.hex || '#EDEBF7'}"></span>
              <span class="name">${ev.summary || '(untitled)'}<br><span style="color:var(--text-dim); font-size:11.5px;">${label} · ${formatEventWhen(ev)}</span></span>
            </div>
          `).join('');
        }
      }
      setGcStatus(`Synced — ${all.length} upcoming across ${cfg.calendars.length} calendar${cfg.calendars.length===1?'':'s'}.`);
    } catch(e){
      setGcStatus('Sync failed: ' + e.message, true);
    }
  }
  function initGcalUI(){
    const cfg = loadGcalConfig();
    document.getElementById('gc-key').value = cfg.apiKey || '';
    renderGcCalRows();

    document.getElementById('gcal-toggle').addEventListener('click', () => {

    document.getElementById('gc-add-cal').addEventListener('click', () => {

      const cfg2 = loadGcalConfig();

      saveGcalConfig(cfg2);
      document.getElementById('gc-new-label').value = '';

      renderGcCalRows();
      if (apiKey){

    document.getElementById('gc-save-sync').addEventListener('click', () => {

    });

    if (cfg.apiKey && cfg.calendars.length){
      syncAllCalendars();
    }

    // keep it fresh for tabs left open, without needing a reload
    setInterval(() => { syncAllCalendars(); }, 10 * 60 * 1000);
  }

  // ---------- layout ----------
  const RING_RADIUS = { apps: 190, social: 140, projects: 240, other: 280 };
  const CAT_ANGLE_OFFSET = { apps: -60, social: 90, projects: 210, other: 320 };

  // stable pseudo-random 0..1 from a string, so the "natural" jitter
  // stays put across relayouts instead of reshuffling every time
  function hash01(str){
    let h = 0;
    for (let i=0; i<str.length; i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
    return ((h % 1000) + 1000) % 1000 / 1000;
  }


  function computeTargets(){
    const byCat = {};
    nodes.forEach(n => { (byCat[n.category] ||= []).push(n); });
    Object.keys(byCat).forEach(cat => {
      const arr = byCat[cat];
      const spread = 130;
      const base = CAT_ANGLE_OFFSET[cat] ?? 270;
      arr.forEach((n, i) => {
        const t = arr.length === 1 ? 0.5 : i/(arr.length-1);
        const rand = hash01(n.id);
        const rand2 = hash01(n.id + 'r');
        const angle = (base - spread/2 + t*spread + (rand-0.5)*46) * Math.PI/180;
        const r = (RING_RADIUS[cat] ?? 220) + (rand2-0.5)*140;
        n.tx = Math.cos(angle) * r;
        n.ty = Math.sin(angle) * r;
        if (n.x === undefined){ n.x = n.tx + (Math.random()-0.5)*20; n.y = n.ty + (Math.random()-0.5)*20; }
      });
    });
  }

  // ---------- render ----------
  let gEls = {};

  function buildScene(){
    svg.innerHTML = '';
    const defs = document.createElementNS(svgNS, 'defs');
    const glowFilter = document.createElementNS(svgNS, 'filter');
    glowFilter.setAttribute('id', 'starglow');
    glowFilter.setAttribute('x', '-100%'); glowFilter.setAttribute('y', '-100%');
    glowFilter.setAttribute('width', '300%'); glowFilter.setAttribute('height', '300%');
    glowFilter.innerHTML = '<feGaussianBlur stdDeviation="3.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>';
    defs.appendChild(glowFilter);

    const atmoGrad = document.createElementNS(svgNS, 'radialGradient');
    atmoGrad.setAttribute('id', 'atmoGrad');
    atmoGrad.innerHTML = '<stop offset="0%" stop-color="var(--you-glow)" stop-opacity="0.5"/><stop offset="55%" stop-color="var(--you-glow)" stop-opacity="0.16"/><stop offset="100%" stop-color="var(--you-glow)" stop-opacity="0"/>';
    defs.appendChild(atmoGrad);

    svg.appendChild(defs);

    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('id', 'scene');
    svg.appendChild(g);

    const lineGroup = document.createElementNS(svgNS, 'g');
    lineGroup.id = 'lines';
    g.appendChild(lineGroup);
    nodes.forEach(n => {
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('stroke', 'rgba(255,255,255,0.12)');
      line.setAttribute('stroke-width', '1');
      lineGroup.appendChild(line);
      n._line = line;
    });

    const you = document.createElementNS(svgNS, 'g');
    you.setAttribute('class', 'you-node');

    const haloOuter = document.createElementNS(svgNS, 'circle');
    haloOuter.setAttribute('class', 'you-halo you-halo-outer');
    haloOuter.setAttribute('r', 68);
    haloOuter.setAttribute('fill', 'url(#atmoGrad)');

    const haloInner = document.createElementNS(svgNS, 'circle');
    haloInner.setAttribute('class', 'you-halo you-halo-inner');
    haloInner.setAttribute('r', 34);
    haloInner.setAttribute('fill', 'url(#atmoGrad)');

    const core = document.createElementNS(svgNS, 'circle');
    core.setAttribute('r', 19);
    core.setAttribute('fill', 'var(--you-core)');
    core.setAttribute('filter', 'url(#starglow)');

    const rim = document.createElementNS(svgNS, 'circle');
    rim.setAttribute('r', 19.5);
    rim.setAttribute('fill', 'none');
    rim.setAttribute('stroke', 'var(--you-glow)');
    rim.setAttribute('stroke-width', '0.7');
    rim.setAttribute('opacity', '0.55');

    const label = document.createElementNS(svgNS, 'text');
    label.setAttribute('class', 'you-label');
    label.setAttribute('y', 44);
    label.textContent = 'School';

    you.appendChild(haloOuter);
    you.appendChild(haloInner);
    you.appendChild(core);
    you.appendChild(rim);
    you.appendChild(label);
    g.appendChild(you);
    gEls.you = you;

    let youDownAt = null, youMoved = false;
    you.addEventListener('pointerdown', e => { youDownAt = {x:e.clientX,y:e.clientY}; youMoved = false; e.stopPropagation(); });
    you.addEventListener('pointermove', e => {
      if (!youDownAt) return;
      if (Math.abs(e.clientX-youDownAt.x) > 4 || Math.abs(e.clientY-youDownAt.y) > 4) youMoved = true;
    });
    you.addEventListener('pointerup', e => {
      e.stopPropagation();
      if (!youMoved) zoomOutHome();
      youDownAt = null;
    });

    nodes.forEach(n => {
      const group = document.createElementNS(svgNS, 'g');
      group.setAttribute('class', 'node-group');

      // invisible larger hit area — the visible star shape is small and
      // fiddly to hover/click precisely, this extends both without
      // affecting how anything looks
      const hitArea = document.createElementNS(svgNS, 'circle');
      hitArea.setAttribute('class', 'hit-area');
      hitArea.setAttribute('r', 22);
      group.appendChild(hitArea);

      const circle = document.createElementNS(svgNS, 'path');
      circle.setAttribute('class', 'node-circle node-star');
      circle.setAttribute('d', 'M0,-10 C1.1,-3.3 3.3,-1.1 10,0 C3.3,1.1 1.1,3.3 0,10 C-1.1,3.3 -3.3,1.1 -10,0 C-3.3,-1.1 -1.1,-3.3 0,-10 Z');
      circle.setAttribute('fill', CATS[n.category]?.hex || CATS.other.hex);
      circle.setAttribute('filter', 'url(#starglow)');
      circle.style.setProperty('--s-min', (0.72 + Math.random()*0.12).toFixed(2));
      circle.style.setProperty('--s-max', (1.12 + Math.random()*0.22).toFixed(2));
      circle.style.setProperty('--o-min', (0.5 + Math.random()*0.2).toFixed(2));
      circle.style.setProperty('--o-max', (0.92 + Math.random()*0.08).toFixed(2));
      circle.style.setProperty('--rot', (Math.random()*10 - 5).toFixed(1) + 'deg');
      circle.style.animationDuration = (6 + Math.random()*6).toFixed(2) + 's';
      circle.style.animationDelay = '-' + (Math.random()*12).toFixed(2) + 's';
      const starWrap = document.createElementNS(svgNS, 'g');
      starWrap.setAttribute('class', 'star-wrap');
      starWrap.appendChild(circle);

      const text = document.createElementNS(svgNS, 'text');
      text.setAttribute('class', 'node-label');
      text.setAttribute('x', 13);
      text.setAttribute('y', 4);
      text.textContent = n.name;
      group.appendChild(starWrap);
      group.appendChild(text);
      g.appendChild(group);
      n._group = group;
      n._star = circle;

      let downAt = null, moved = false;
      group.addEventListener('pointerdown', e => { downAt = {x:e.clientX,y:e.clientY}; moved=false; e.stopPropagation(); });
      group.addEventListener('pointermove', e => {
        if (!downAt) return;
        if (Math.abs(e.clientX-downAt.x) > 4 || Math.abs(e.clientY-downAt.y) > 4) moved = true;
      });
      group.addEventListener('pointerup', e => {
        e.stopPropagation();
        if (!moved) warpTo(n);
        downAt = null;
      });
    });

    gEls.g = g;
  }

  function positionScene(){
    gEls.g.setAttribute('transform', `translate(${cx+pan.x}, ${cy+pan.y})`);
    gEls.you.setAttribute('transform', 'translate(0,0)');
    nodes.forEach(n => {
      n._group.setAttribute('transform', `translate(${n.x},${n.y})`);
      n._line.setAttribute('x1', 0); n._line.setAttribute('y1', 0);
      n._line.setAttribute('x2', n.x); n._line.setAttribute('y2', n.y);
    });
    const bg = document.getElementById('space-bg');
    if (bg) bg.style.transform = `translate(${pan.x*0.4}px, ${pan.y*0.4}px)`;
    // the foreground dust streaks were never wired to the pan at all —
    // they'd sit frozen in place while everything else moved during a
    // drag. give them a slightly stronger factor since they're meant to
    // read as closer to the viewer than the stars/nebula behind them.
    const df = document.getElementById('dust-front');
    if (df) df.style.transform = `translate(${pan.x*0.55}px, ${pan.y*0.55}px)`;
  }

  // ---------- warp into a node ----------
  let warping = false;
  function easeInExpo(t){ return t <= 0 ? 0 : Math.pow(2, 10*t - 10); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  function resolveUrl(url){
    if (/^https?:\/\//i.test(url)) return url;
    if (/\.html?(\?|#|$)/i.test(url)) return url; // relative page on this site
    return 'https://' + url;
  }

  function warpTo(n){
    if (warping) return;
    const url = resolveUrl(n.url);
    if (reduceMotion){ window.location.href = url; return; }

    warping = true;
    svg.style.pointerEvents = 'none';

    const g = gEls.g;
    const bg = document.getElementById('space-bg');
    const startA = cx + pan.x, startB = cy + pan.y;
    const s = 34;
    const targetA = cx - s*n.x, targetB = cy - s*n.y;

    // stop the idle glimmer and drop the glow filter for the duration —
    // re-rasterizing a blur while scaling 34x is expensive and was the
    // real source of the lag; driving everything from one rAF loop here
    // (same approach as the zoom-out-to-home animation) keeps it smooth
    nodes.forEach(o => { o._star.style.animation = 'none'; o._star.style.filter = 'none'; });

    const dur = 420;
    let startTs = null;

    function frame(ts){
      if (startTs === null) startTs = ts;
      const t = Math.min((ts - startTs) / dur, 1);
      const p = easeInExpo(t);

      // camera rushing toward the target star
      const curA = lerp(startA, targetA, p);
      const curB = lerp(startB, targetB, p);
      const curS = lerp(1, s, p);
      g.style.transform = `translate(${curA}px, ${curB}px) scale(${curS})`;

      // the whole starfield surges toward the viewer too
      if (bg) bg.style.transform = `translate(${pan.x*0.4}px, ${pan.y*0.4}px) scale(${lerp(1, 3.6, p)})`;

      // everything else fades away as we dive in
      gEls.you.style.opacity = String(Math.max(0, 1 - p*1.8));
      n._line.style.opacity = String(Math.max(0, 1 - p*1.6));
      n._star.style.opacity = String(Math.max(0, 1 - Math.max(0, p-0.35)/0.5));
      nodes.forEach(o => {
        if (o === n) return;
        o._group.style.opacity = String(Math.max(0, 1 - p*1.6));
      });

      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        const flash = document.getElementById('warp-flash');
        flash.style.background = `radial-gradient(circle at 50% 50%, ${n.color || CATS[n.category]?.hex || '#fff'} 0%, transparent 70%)`;
        flash.style.transition = 'opacity 180ms ease';
        flash.style.opacity = '0.7';
        setTimeout(() => { flash.style.opacity = '0'; }, 180);
        window.location.href = url;

        // safety net: if navigation doesn't actually happen, restore
        // the page instead of leaving it faded out and locked forever
        setTimeout(() => {
          nodes.forEach(o => { o._star.style.filter = ''; o._star.style.animation = ''; o._group.style.opacity = ''; });
          n._star.style.opacity = '';
          n._line.style.opacity = '';
          gEls.you.style.opacity = '';
          svg.style.pointerEvents = '';
          warping = false;
        }, 600);
      }
    }
    requestAnimationFrame(frame);
  }
  function resetWarp(){
    const g = gEls.g;
    g.style.transition = 'transform 420ms ease-out';
    g.style.transform = '';
    nodes.forEach(o => {
      o._group.style.opacity = '';
      o._line.style.opacity = '';
      o._star.style.transition = 'opacity 300ms ease, transform 300ms ease';
      o._star.style.transform = '';
      o._star.style.opacity = '';
    });
    gEls.you.style.opacity = '';
    const bg = document.getElementById('space-bg');
    if (bg){ bg.style.transition = 'transform 420ms ease-out'; }
    setTimeout(() => {
      nodes.forEach(o => {
        o._star.style.filter = '';
        o._star.style.animation = '';
        o._star.style.transition = '';
      });
      g.style.transition = '';
      g.style.transform = '';
      svg.style.pointerEvents = '';
      svg.classList.remove('warping');
      warping = false;
      positionScene();
    }, 440);
  }

  // ---------- zoom out to go home (reverse of warping into a star) ----------
  function zoomOutHome(){
    if (warping) return;
    if (reduceMotion){ window.location.href = 'index.html'; return; }

    warping = true;
    svg.style.pointerEvents = 'none';

    const g = gEls.g;
    const bg = document.getElementById('space-bg');
    const startA = cx + pan.x, startB = cy + pan.y;

    nodes.forEach(o => { o._star.style.animation = 'none'; });

    const flash = document.getElementById('warp-flash');
    flash.style.background = 'radial-gradient(circle at 50% 50%, var(--you-core) 0%, transparent 70%)';
    flash.style.transition = 'opacity 220ms ease';
    flash.style.opacity = '0.7';
    setTimeout(() => { flash.style.opacity = '0'; }, 220);

    const dur = 560;
    let startTs = null;

    function frame(ts){
      if (startTs === null) startTs = ts;
      const t = Math.min((ts - startTs) / dur, 1);
      const p = easeInExpo(t);

      // the whole scene shrinks away and dissolves, in place
      const curS = lerp(1, 0.04, p);
      g.style.transform = `translate(${startA}px, ${startB}px) scale(${curS})`;
      g.style.opacity = String(Math.max(0, 1 - p*1.2));

      // the backdrop recedes too, more gently than the foreground
      if (bg) bg.style.transform = `translate(${pan.x*0.4}px, ${pan.y*0.4}px) scale(${lerp(1, 0.55, p)})`;

      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        window.location.href = 'index.html';

        // safety net: restore interactivity if navigation didn't
        // actually happen, instead of leaving the graph locked
        setTimeout(() => {
          svg.style.pointerEvents = '';
          warping = false;
        }, 600);
      }
    }
    requestAnimationFrame(frame);
  }

  let settling = true;
  function tick(){
    let stillMoving = false;
    nodes.forEach(n => {
      const dx = n.tx - n.x, dy = n.ty - n.y;
      n.x += dx * 0.08; n.y += dy * 0.08;
      if (Math.abs(dx) > 0.3 || Math.abs(dy) > 0.3) stillMoving = true;
    });
    positionScene();
    if (stillMoving) requestAnimationFrame(tick);
    else settling = false;
  }

  function relayout(){
    computeTargets();
    if (reduceMotion){
      nodes.forEach(n => { n.x = n.tx; n.y = n.ty; });
      positionScene();
    } else {
      // paint the current (pre-settle) positions immediately, so the scene
      // is never blank while waiting on a requestAnimationFrame callback —
      // browsers can defer/pause rAF entirely for a tab that isn't focused,
      // which otherwise left the graph unpositioned until you switched back
      positionScene();
      settling = true;
      requestAnimationFrame(tick);
    }
  }

  svg.addEventListener('pointerdown', e => {
    panning = true; panStart = {x: e.clientX - pan.x, y: e.clientY - pan.y};
    svg.classList.add('dragging');
  });
  window.addEventListener('pointermove', e => {
    if (!panning) return;
    pan.x = e.clientX - panStart.x; pan.y = e.clientY - panStart.y;
    positionScene();
  });
  window.addEventListener('pointerup', () => { panning = false; svg.classList.remove('dragging'); });

  window.addEventListener('resize', () => {
    W = window.innerWidth; H = window.innerHeight; cx = W/2; cy = H/2;
    positionScene();
  });

  // ---------- drawer ----------
  const drawer = document.getElementById('drawer');
  document.getElementById('home-icon-btn').addEventListener('click', () => zoomOutHome());
  document.getElementById('drawer-toggle').addEventListener('click', () => {
    drawer.classList.add('open'); renderLinkList();
    buildModalFrame('drawer', 'drawer-frame');
  });
  document.getElementById('drawer-close').addEventListener('click', () => drawer.classList.remove('open'));

  function renderLinkList(){
    const list = document.getElementById('link-list');
    list.innerHTML = '';
    if (!nodes.length){
      list.innerHTML = '<div class="empty-note">Nothing added yet.</div>';
      return;
    }
    nodes.forEach(n => {
      const row = document.createElement('div');
      row.className = 'link-row';
      row.innerHTML = `
        <span class="dot" style="background:${CATS[n.category]?.hex || CATS.other.hex}"></span>
        <span class="name">${n.name}</span>
        <button data-id="${n.id}">Remove</button>
      `;
      row.querySelector('button').addEventListener('click', () => removeNode(n.id));
      list.appendChild(row);
    });
  }

  function removeNode(id){
    nodes = nodes.filter(n => n.id !== id);
    saveNodes();
    buildScene();
    relayout();
    renderLinkList();
  }

  // clock
  function updateClock(){
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    document.getElementById('clock-date').textContent =
      now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
  }
  updateClock();
  setInterval(updateClock, 1000*15);

  // notes
  const notesEl = document.getElementById('notes');
  let notesTimer = null;
  notesEl.addEventListener('input', () => {
    clearTimeout(notesTimer);
    notesTimer = setTimeout(() => saveNotes(notesEl.value), 500);
  });

  // ---------- add modal ----------
  const overlay = document.getElementById('modal-overlay');
  const pillsEl = document.getElementById('pills');
  Object.entries(CATS).forEach(([key, cat]) => {
    const pill = document.createElement('div');
    pill.className = 'pill' + (key === selectedCategory ? ' selected' : '');
    pill.style.color = key === selectedCategory ? cat.hex : '';
    pill.innerHTML = `<span class="dot" style="background:${cat.hex}"></span>${cat.label}`;
    pill.addEventListener('click', () => {
      selectedCategory = key;
      [...pillsEl.children].forEach(p => { p.classList.remove('selected'); p.style.color=''; });
      pill.classList.add('selected');
      pill.style.color = cat.hex;
    });
    pillsEl.appendChild(pill);
  });

  const modalSvgNS = 'http://www.w3.org/2000/svg';
  const STAR_PATH = 'M0,-10 C1.1,-3.3 3.3,-1.1 10,0 C3.3,1.1 1.1,3.3 0,10 C-1.1,3.3 -3.3,1.1 -10,0 C-3.3,-1.1 -1.1,-3.3 0,-10 Z';

  function buildModalFrame(boxId, svgId){
    boxId = boxId || 'modal';
    svgId = svgId || 'modal-frame';
    const modal = document.getElementById(boxId);
    const svg = document.getElementById(svgId);
    if (!modal || !svg) return;
    const w = modal.offsetWidth, h = modal.offsetHeight;
    if (!w || !h) return;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.innerHTML = '';

    const defs = document.createElementNS(modalSvgNS, 'defs');
    const glow = document.createElementNS(modalSvgNS, 'filter');
    glow.setAttribute('id', 'frameGlow');
    glow.setAttribute('x', '-60%'); glow.setAttribute('y', '-60%');
    glow.setAttribute('width', '220%'); glow.setAttribute('height', '220%');
    glow.innerHTML = '<feGaussianBlur stdDeviation="3.4"/>';
    defs.appendChild(glow);
    svg.appendChild(defs);

    // a solid, glowing border — its corners land exactly on each star's
    // center below, so the frame reads as running straight through them.
    // built from a soft blurred copy underneath a crisp solid line on top.
    const x = 1, y = 1, rw = w - 2, rh = h - 2;
    const glowRect = document.createElementNS(modalSvgNS, 'rect');
    glowRect.setAttribute('x', x); glowRect.setAttribute('y', y);
    glowRect.setAttribute('width', rw); glowRect.setAttribute('height', rh);
    glowRect.setAttribute('fill', 'none');
    glowRect.setAttribute('stroke', '#EDEBF7');
    glowRect.setAttribute('stroke-width', '2.5');
    glowRect.setAttribute('opacity', '0.45');
    glowRect.setAttribute('filter', 'url(#frameGlow)');
    svg.appendChild(glowRect);

    const rect = document.createElementNS(modalSvgNS, 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', rw); rect.setAttribute('height', rh);
    rect.setAttribute('fill', 'none');
    rect.setAttribute('stroke', '#EDEBF7');
    rect.setAttribute('stroke-width', '1.1');
    rect.setAttribute('opacity', '0.9');
    svg.appendChild(rect);

    [[0,0], [w,0], [0,h], [w,h]].forEach(([sx, sy]) => {
      const g = document.createElementNS(modalSvgNS, 'g');
      g.setAttribute('transform', `translate(${sx},${sy}) scale(1.05)`);
      const haloDot = document.createElementNS(modalSvgNS, 'circle');
      haloDot.setAttribute('r', 9);
      haloDot.setAttribute('fill', '#EDEBF7');
      haloDot.setAttribute('opacity', '0.35');
      haloDot.setAttribute('filter', 'url(#frameGlow)');
      g.appendChild(haloDot);
      // static — no glimmer animation, just a steady glow
      const star = document.createElementNS(modalSvgNS, 'path');
      star.setAttribute('class', 'frame-star');
      star.setAttribute('d', STAR_PATH);
      star.style.filter = 'url(#frameGlow)';
      g.appendChild(star);
      svg.appendChild(g);
    });
  }

  document.getElementById('add-btn').addEventListener('click', () => {
    document.getElementById('f-name').value = '';
    document.getElementById('f-url').value = '';
    overlay.classList.add('open');
    document.getElementById('f-name').focus();
    buildModalFrame();
  });
  document.getElementById('cancel-btn').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

  document.getElementById('save-btn').addEventListener('click', () => {
    const name = document.getElementById('f-name').value.trim();
    const url = document.getElementById('f-url').value.trim();
    if (!name || !url) return;
    nodes.push({ id: 'n'+Date.now(), name, url, category: selectedCategory });
    saveNodes();
    overlay.classList.remove('open');
    buildScene();
    relayout();
    renderLinkList();
  });

  // ---------- init ----------
  (async function init(){
    await loadState();
    await SiteSync.loadFreshest('gcal-config', true);
    buildScene();
    relayout();
    initGcalUI();
  })();
})();
</script>
</body>
</html>
