<!DOCTYPE html>
<html lang="en">
<head>
<script src="gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>To-do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #05060F;
    --bg-mid: #0C0F26;
    --panel: #12142C;
    --line: rgba(255,255,255,0.09);
    --text: #EDEBF7;
    --text-dim: #9296B8;
    --c-apps: #2ECC71;
    --c-social: #27AE60;
    --c-projects: #3CB371;
    --c-other: #66BB6A;
    --you-core: #6EE7A8;
    --you-glow: #B8F5D0;
    --you-shadow: #1B8A4C;
  }
  *{ box-sizing: border-box; }
  html{
    /* iOS specifically paints the zoomed-out / overscroll area using
       this element's solid background-color (a gradient here won't do
       it) — this is what stops white from showing when pinch-zoom
       can't be fully prevented */
    background-color: var(--bg-deep);
  }
  html, body{
    margin:0; padding:0; height:100%; min-height: 100%;
    background: radial-gradient(ellipse at 50% 40%, var(--bg-mid) 0%, var(--bg-deep) 70%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    /* iOS Safari ignores the viewport meta tag's user-scalable=no, but it
       DOES respect touch-action — this is what actually stops pinch from
       being interpreted as a zoom gesture in the first place, rather
       than just trying to hide the result after the fact */
    touch-action: pan-x pan-y;
  }

  #space-bg{
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    will-change: transform;
  }
  #stars{ position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star{ animation: twinkle linear infinite; }
  @keyframes twinkle{
    0%, 100% { opacity: var(--min-op); }
    50% { opacity: var(--max-op); }
  }

  .nebula{
    position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none;
    opacity: 0;
    transition: opacity 2.2s ease-out;
    animation: drift ease-in-out infinite;
  }
  .nebula.n1{ width: 460px; height: 460px; top: -140px; left: -120px; background: var(--c-projects); --op: 0.20; animation-duration: 22s; }
  .nebula.n2{ width: 380px; height: 380px; bottom: -120px; right: -100px; background: var(--c-social); --op: 0.16; animation-duration: 26s; }
  .nebula.n3{ width: 320px; height: 320px; bottom: 10%; left: 8%; background: var(--c-apps); --op: 0.13; animation-duration: 30s; }
  @keyframes drift{
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(40px, 26px) scale(1.12); }
  }

  /* slow-moving dust clouds that drift across the whole scene, behind everything */
  .dust{
    position: fixed; pointer-events: none;
    filter: blur(60px);
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 2.2s ease-out;
    animation: flow linear infinite;
    will-change: transform;
  }
  .dust.d1{
    width: 780px; height: 420px; top: 8%; left: -25%;
    background: radial-gradient(ellipse at 35% 40%, var(--c-projects) 0%, transparent 65%),
                radial-gradient(ellipse at 65% 60%, var(--c-social) 0%, transparent 70%);
    border-radius: 42% 58% 60% 40% / 55% 45% 60% 40%;
    --op: 0.16;
    animation-duration: 95s;
  }
  .dust.d2{
    width: 640px; height: 360px; top: 48%; left: -30%;
    background: radial-gradient(ellipse at 40% 50%, var(--c-apps) 0%, transparent 68%),
                radial-gradient(ellipse at 70% 35%, var(--c-projects) 0%, transparent 70%);
    border-radius: 55% 45% 40% 60% / 40% 60% 45% 55%;
    --op: 0.13;
    animation-duration: 120s;
    animation-delay: -40s;
  }
  .dust.d3{
    width: 560px; height: 320px; top: 74%; left: -20%;
    background: radial-gradient(ellipse at 50% 50%, var(--c-social) 0%, transparent 65%),
                radial-gradient(ellipse at 30% 40%, var(--c-other) 0%, transparent 72%);
    border-radius: 48% 52% 55% 45% / 50% 50% 42% 58%;
    --op: 0.12;
    animation-duration: 80s;
    animation-delay: -18s;
  }
  @keyframes flow{
    0%   { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(72vw, -6vh) rotate(10deg); }
    100% { transform: translate(140vw, 4vh) rotate(0deg); }
  }

  /* NEW: a second, different dust layer in front of the graph — thinner,
     streakier wisps that pass closer to the viewer than the background dust */
  #dust-front{ position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .streak{
    position: fixed;
    filter: blur(34px);
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 2.2s ease-out;
    animation: streak-flow linear infinite;
    will-change: transform;
  }
  .streak.s1{
    width: 620px; height: 150px; top: 18%; left: -35%;
    background: radial-gradient(ellipse at 30% 50%, var(--you-glow) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, var(--c-social) 0%, transparent 65%);
    border-radius: 50% 50% 45% 55% / 65% 65% 35% 35%;
    --op: 0.14;
    animation-duration: 52s;
  }
  .streak.s2{
    width: 520px; height: 130px; top: 62%; left: -30%;
    background: radial-gradient(ellipse at 40% 50%, var(--c-projects) 0%, transparent 62%),
                radial-gradient(ellipse at 65% 50%, var(--you-glow) 0%, transparent 68%);
    border-radius: 55% 45% 50% 50% / 60% 60% 40% 40%;
    --op: 0.12;
    animation-duration: 68s;
    animation-delay: -20s;
  }
  @keyframes streak-flow{
    0%   { transform: translate(0, 0) rotate(-8deg) scaleX(1); }
    50%  { transform: translate(70vw, 3vh) rotate(-4deg) scaleX(1.08); }
    100% { transform: translate(150vw, -2vh) rotate(-8deg) scaleX(1); }
  }

  @media (prefers-reduced-motion: reduce){
    .dust{ animation: none; transition: none; opacity: var(--op, 0.15); }
    .nebula{ animation: none; transition: none; opacity: var(--op, 0.15); }
    .streak{ animation: none; transition: none; opacity: var(--op, 0.15); }
  }

  #warp-flash{
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    opacity: 0;
    mix-blend-mode: screen;
  }

  #fab-controls{
    position: fixed; right: 26px; bottom: 26px; z-index: 6;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  /* fixed to the viewport, not the pannable graph — stays put no
     matter how the person drags around the page */
  #topbar-clock{
    position: fixed; top: 22px; right: 26px; z-index: 6;
    text-align: right; pointer-events: none;
    font-family: 'Fraunces', serif; color: #EDEBF7;
  }
  #topbar-clock-time{
    font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1;
    text-shadow: 0 0 12px rgba(237,235,247,0.65), 0 0 26px rgba(237,235,247,0.3);
  }
  #topbar-clock-date{
    font-family: 'Inter', sans-serif; color: var(--text-dim);
    font-size: 11.5px; margin-top: 6px;
  }
  .topbar-subline{
    font-family: 'Inter', sans-serif; font-size: 11.5px;
    margin-top: 5px; display: flex; justify-content: flex-end; gap: 6px;
  }
  .topbar-sublabel{ color: var(--text-dim); }
  #topbar-cal-settings-btn{
    pointer-events: auto; margin-top: 8px;
    background: none; border: none; color: var(--text-dim);
    font-size: 13px; padding: 2px 0; cursor: pointer;
    opacity: 0.6; transition: opacity .15s ease;
  }
  #topbar-cal-settings-btn:hover{ opacity: 1; background: none; }
  .empty-note{ color: var(--text-dim); font-size: 13px; }
  #cal-modal-overlay{
    position: fixed; inset: 0; background: rgba(2,3,10,0.65);
    display: flex; align-items:center; justify-content:center; z-index: 25;
    opacity: 0; pointer-events: none;
    transition: opacity 180ms ease;
  }
  #cal-modal-overlay.open{ opacity: 1; pointer-events: auto; }
  #cal-modal{
    position: relative;
    background: rgba(20,18,18,0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: none; border-radius: 0;
    padding: 28px 26px; width: 320px;
    box-shadow: 0 30px 60px -18px rgba(0,0,0,0.55);
  }
  #cal-modal-frame{ position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  #cal-modal h2{
    font-family:'Fraunces', serif; font-weight:500; font-size:18px; margin:0 0 20px;
    color: #EDEBF7; text-shadow: 0 0 10px rgba(237,235,247,0.55);
  }
  .icon-btn{
    background: none; border: none; padding: 0; margin: 0;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    text-decoration: none;
    cursor: pointer;
    transition: color .15s ease, transform .15s ease;
  }
  .icon-btn:hover{ color: var(--text); transform: scale(1.1); }
  .icon-btn:focus-visible{ outline: 2px solid var(--c-projects); outline-offset: 4px; border-radius: 50%; }
  .icon-btn svg{ width: 22px; height: 22px; display: block; }
  button{
    font-family: 'Inter', sans-serif;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 9px 15px;
    font-size: 13.5px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  button:hover{ border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); }
  button:focus-visible{ outline: 2px solid var(--c-projects); outline-offset: 2px; }

  svg#graph{
    width: 100vw; height: 100vh; display:block; cursor: grab; position: relative; z-index: 1;
    user-select: none; -webkit-user-select: none;
    /* the whole graph fades in on arrival instead of popping in the
       instant its elements finish building — toggled to opacity 1 a
       beat after buildScene()/relayout() run */
    opacity: 0;
    transition: opacity 700ms ease;
  }
  svg#graph.dragging{ cursor: grabbing; }

  .node-label{
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    fill: var(--text-dim);
    pointer-events: none;
    transition: fill .15s ease;
    /* a solid backdrop behind the text, so a connecting line or a
       neighboring node passing near/behind a label never makes it
       unreadable — the halo just paints over whatever's there */
    paint-order: stroke fill;
    stroke: var(--bg-deep);
    stroke-width: 3px;
    stroke-linejoin: round;
  }
  .node-circle{ transition: filter .15s ease; }
  .node-group{ cursor: pointer; }
  .node-group:hover .node-circle{ filter: brightness(1.3); }
  .star-wrap{
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.15s ease;
  }
  .node-group:hover .star-wrap{ transform: scale(1.4); }
  .hit-area{ fill: transparent; pointer-events: all; }
  .node-label{ user-select: none; }
  .you-label{ user-select: none; }
  .node-star{
    transform-box: fill-box;
    transform-origin: center;
    animation-name: glimmer;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }
  @keyframes glimmer{
    0%, 100% { transform: scale(var(--s-min, 0.8)) rotate(0deg); opacity: var(--o-min, 0.65); }
    50% { transform: scale(var(--s-max, 1.2)) rotate(var(--rot, 5deg)); opacity: var(--o-max, 1); }
  }

  /* a soft, slow-pulsing light behind each star — gives it presence
     without the layered gradient "shading" look; just a gentle glow,
     like the star casting a bit of its own light */
  .node-glow{
    transform-box: fill-box;
    transform-origin: center;
    filter: blur(6px);
    opacity: 0.3;
    animation-name: node-glow-pulse;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }
  @keyframes node-glow-pulse{
    0%, 100% { opacity: 0.18; transform: scale(0.85); }
    50% { opacity: 0.4; transform: scale(1.2); }
  }

  /* the faceted highlight — hard-edged, solid color, no blur — sits
     right on top of the star/circle's own fill */
  .node-facet{ opacity: 0.92; pointer-events: none; }

  /* a tiny specular glint — like light catching a cut gem — flat, not a
     gradient, just a small bright point that flashes on its own cycle,
     giving the star some sparkle without adding any shading */
  .node-glint{
    fill: #FFFFFF;
    animation-name: node-glint-flash;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }
  @keyframes node-glint-flash{
    0%, 82%, 100% { opacity: 0; }
    88% { opacity: 0.95; }
    94% { opacity: 0.2; }
  }

  /* a one-shot ring of energy when a star is actually clicked, right
     before it warps — separate from the ambient glow/glint, this only
     ever plays once per click */
  .click-ring{
    fill: none;
    stroke-width: 1.4;
    pointer-events: none;
    animation: click-ring-burst 480ms ease-out forwards;
  }
  @keyframes click-ring-burst{
    0% { r: 4; stroke-opacity: 0.8; stroke-width: 2.2; }
    100% { r: 26; stroke-opacity: 0; stroke-width: 0.4; }
  }

  @media (prefers-reduced-motion: reduce){
    .node-glint{ animation: none; opacity: 0; }
    .click-ring{ animation: none; display: none; }
  }

  /* each star drifts gently and independently, so the whole field feels
     alive at rest rather than only reacting to hover — purely a local
     offset, doesn't touch the positioning transform the layout controls */
  .float-wrap{
    animation-name: node-float;
    animation-iteration-count: infinite;
    animation-timing-function: ease-in-out;
  }
  @keyframes node-float{
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(var(--float-x, 0px), var(--float-y, -3px)); }
  }

  /* connecting lines get a slow breathing pulse instead of sitting
     perfectly static — reads as a faint current running along them */
  .node-line{
    animation: line-breathe 5s ease-in-out infinite;
  }
  @keyframes line-breathe{
    0%, 100% { opacity: 0.09; }
    50% { opacity: 0.22; }
  }

  @media (prefers-reduced-motion: reduce){
    .node-star, .node-glow, .float-wrap, .node-line{ animation: none; }
  }

  .you-label{
    font-family: 'Fraunces', serif;
    font-size: 15px;
    fill: var(--you-core);
    pointer-events: none;
    text-anchor: middle;
  }
  .you-node{ cursor: pointer; }
  .sun-rays{
    transform-box: fill-box;
    transform-origin: center;
    animation: sun-spin 70s linear infinite;
  }
  @keyframes sun-spin{
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .sun-rays{ animation: none; }
  }
  .you-halo{
    transform-box: fill-box;
    transform-origin: center;
    animation: halo-breathe 7s ease-in-out infinite;
  }
  .you-halo-inner{ animation-delay: -3.5s; }
  @keyframes halo-breathe{
    0%, 100% { transform: scale(0.92); opacity: 0.8; }
    50% { transform: scale(1.14); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce){
    .you-halo{ animation: none; }
  }


  /* Modal — the "Add a task" form, styled like it's threaded together
     from a small constellation rather than a plain settings box */
  #modal-overlay{
    position: fixed; inset: 0; background: rgba(2,3,10,0.65);
    display: flex; align-items:center; justify-content:center; z-index: 20;
    opacity: 0; pointer-events: none;
    transition: opacity 180ms ease;
  }
  #modal-overlay.open{ opacity: 1; pointer-events: auto; }
  #modal{
    position: relative;
    background: rgba(20,18,18,0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: none;
    border-radius: 0;
    padding: 28px 26px;
    width: 320px;
    box-shadow: 0 30px 60px -18px rgba(0,0,0,0.55);
  }
  #modal-frame{
    position: absolute; inset: 0; overflow: visible; pointer-events: none;
  }
  .frame-star{ fill: #EDEBF7; }
  #modal h2{
    font-family:'Fraunces', serif; font-weight:500; font-size:18px; margin:0 0 20px;
    color: #EDEBF7;
    text-shadow: 0 0 10px rgba(237,235,247,0.55);
  }
  .field{ margin-bottom: 15px; }
  .field label{
    display:block; font-size: 12px; margin-bottom: 6px;
    color: #EDEBF7;
    text-shadow: 0 0 6px rgba(237,235,247,0.45);
  }
  .field input, .field select{
    width: 100%; background: rgba(5,6,15,0.55); border-radius: 7px;
    color: var(--text); font-family: 'Inter', sans-serif; font-size: 13.5px; padding: 9px 10px;
    border: 1px solid rgba(237,235,247,0.55);
    box-shadow: 0 0 7px 0.5px rgba(237,235,247,0.2);
  }
  .field input:focus{
    outline: none;
    border-color: rgba(237,235,247,0.9);
    box-shadow: 0 0 10px 1px rgba(237,235,247,0.4);
  }
  .field input[type="color"]{
    padding: 4px; height: 40px; cursor: pointer;
  }
  .field input[type="date"]{ color-scheme: dark; }
  .pills{ display:flex; gap: 8px; flex-wrap: wrap; }
  .pill{
    border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px;
    font-size: 12.5px; cursor:pointer; color: var(--text-dim);
    display:flex; align-items:center; gap:6px;
  }
  .pill .dot{ width:7px; height:7px; border-radius:50%; }
  .pill.selected{ color: var(--text); border-color: currentColor; }
  .modal-actions{ display:flex; justify-content:flex-end; gap: 8px; margin-top: 20px; }
  .btn-primary{ background: #EDEBF7; color: #0C0F26; border: none; font-weight: 600; }
  .btn-primary:hover{ background: #FFFFFF; }

  /* task detail "menu" — rendered entirely as a small constellation:
     connected star-points with floating labels, no card or box at all */
  .node-due{ font-size: 10.5px; opacity: 0.72; }
  #popup-line{ position: fixed; inset: 0; z-index: 14; pointer-events: none; width: 100vw; height: 100vh; }
  #popup-line text{ font-family: 'Inter', sans-serif; user-select: none; }
  #popup-line .pl-caption{ fill: var(--text-dim); font-size: 10px; }
  #popup-line .pl-value{ fill: var(--text); font-size: 12.5px; }
  #popup-line .pl-link{ cursor: pointer; text-decoration: underline; }

  @media (prefers-reduced-motion: reduce){
    .nebula{ animation: none; opacity: var(--op, 0.15); }
    .star{ animation: none; }
  }
</style>
</head>
<body>

<div id="space-bg">
  <div id="stars"></div>
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>
  <div class="dust d1"></div>
  <div class="dust d2"></div>
  <div class="dust d3"></div>
</div>

<div id="topbar-clock">
  <div id="topbar-clock-time">--:--</div>
  <div id="topbar-clock-date"></div>
  <div class="topbar-subline"><span class="topbar-sublabel">Next Class</span><span id="topbar-next-class">—</span></div>
  <div class="topbar-subline"><span class="topbar-sublabel">Next Shift</span><span id="topbar-next-shift">—</span></div>
  <div class="topbar-subline"><span class="topbar-sublabel">Due Soon</span><span id="topbar-due-soon">—</span></div>
  <button id="topbar-cal-settings-btn" aria-label="Link calendars" title="Link calendars">⚙</button>
</div>

<div id="cal-modal-overlay">
  <div id="cal-modal">
    <svg id="cal-modal-frame"></svg>
    <h2>Link your calendars</h2>
    <div class="field">
      <label for="cal-class-ics">Class calendar ICS URL</label>
      <input id="cal-class-ics" type="text" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics">
    </div>
    <div class="field">
      <label for="cal-shift-ics">Shift calendar ICS URL</label>
      <input id="cal-shift-ics" type="text" placeholder="https://calendar.google.com/calendar/ical/.../basic.ics">
    </div>
    <div class="modal-actions">
      <button id="cal-modal-cancel">Cancel</button>
      <button id="cal-modal-save" class="btn-primary">Save &amp; sync</button>
    </div>
    <div id="cal-modal-status" class="empty-note" style="margin-top:10px;"></div>
  </div>
</div>

<div id="fab-controls">
  <button id="home-icon-btn" class="icon-btn" aria-label="Back to Home" title="Back to Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/></svg></button>
  <button id="add-btn" class="icon-btn" aria-label="Add a link" title="Add a link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
</div>

<svg id="graph"></svg>
<div id="warp-flash"></div>

<div id="dust-front">
  <div class="streak s1"></div>
  <div class="streak s2"></div>
</div>


<div id="modal-overlay">
  <div id="modal">
    <svg id="modal-frame"></svg>
    <h2>Add a task</h2>
    <div class="field">
      <label for="f-hub">Belongs to</label>
      <select id="f-hub">
        <option value="school">School</option>
        <option value="ra">RA</option>
        <option value="lab">Lab</option>
      </select>
    </div>
    <div class="field">
      <label for="f-name">Assignment name</label>
      <input id="f-name" type="text" placeholder="e.g. Chapter 5 questions">
    </div>
    <div class="field">
      <label for="f-subject">Subject</label>
      <input id="f-subject" type="text" placeholder="e.g. History">
    </div>
    <div class="field">
      <label for="f-due">Due date &amp; time</label>
      <input id="f-due" type="datetime-local">
    </div>
    <div class="field">
      <label for="f-url">Link</label>
      <input id="f-url" type="text" placeholder="e.g. canvas link">
    </div>
    <div class="field">
      <label for="f-color">Color</label>
      <input id="f-color" type="color" value="#2ECC71">
    </div>
    <div class="modal-actions">
      <button id="cancel-btn">Cancel</button>
      <button id="save-btn" class="btn-primary">Add</button>
    </div>
  </div>
</div>

<svg id="popup-line"></svg>

<script src="sync.js"></script>
<script>
(function(){
  const CATS = {
    apps:     { label: 'To-do', hex: '#2ECC71' },
    social:   { label: 'To-do', hex: '#27AE60' },
    projects: { label: 'To-do', hex: '#3CB371' },
    other:    { label: 'To-do', hex: '#66BB6A' },
  };

  // this page used to be three separate To-do pages (School, RA, Lab) —
  // now they're three orbiting clusters on one page, School/RA/Lab tasks
  // kept exactly as they were, just tagged with which hub they belong to
  const DEFAULT_NODES = [
    { id: 'test1', name: 'Read Chapter 5', subject: 'History', dueDate: '2026-09-18', url: '', category: 'apps', hub: 'school' },
    { id: 'n1', name: 'Pick Project', url: '', subject: '', dueDate: '', category: 'apps', hub: 'lab' },
  ];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // fade the nebula/dust/streak clouds in from nothing shortly after load.
  // uses setTimeout rather than requestAnimationFrame — rAF can be fully
  // paused by the browser for a tab that isn't focused, which left these
  // invisible indefinitely until the tab regained focus
  if (!reduceMotion){
    const clouds = document.querySelectorAll('.nebula, .dust, .streak');
    setTimeout(() => {
      clouds.forEach(el => {
        const op = getComputedStyle(el).getPropertyValue('--op').trim() || '0.15';
        el.style.opacity = op;
      });
    }, 60);
  }

  // ---------- starfield ----------
  (function buildStarfield(){
    const wrap = document.getElementById('stars');
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%');
    const count = window.innerWidth < 600 ? 60 : 110;
    for (let i=0; i<count; i++){
      const c = document.createElementNS(svgNS, 'circle');
      c.setAttribute('cx', Math.random()*100 + '%');
      c.setAttribute('cy', Math.random()*100 + '%');
      c.setAttribute('r', (Math.random()*1.1 + 0.4).toFixed(2));
      c.setAttribute('fill', Math.random() > 0.85 ? '#F2B85C' : '#EDEBF7');
      if (!reduceMotion){
        c.classList.add('star');
        c.style.setProperty('--min-op', (0.15 + Math.random()*0.2).toFixed(2));
        c.style.setProperty('--max-op', (0.6 + Math.random()*0.4).toFixed(2));
        c.style.animationDuration = (2 + Math.random()*4).toFixed(1) + 's';
        c.style.animationDelay = (Math.random()*4).toFixed(1) + 's';
      } else {
        c.setAttribute('opacity', '0.5');
      }
      svg.appendChild(c);
    }

    // a handful of loose constellations — small chains of stars linked by
    // faint lines, scattered across the sky. Part of the same svg as the
    // starfield above, so they pan with it exactly the same way.
    const constCount = window.innerWidth < 600 ? 3 : 5;
    for (let ci=0; ci<constCount; ci++){
      const anchorX = Math.random()*window.innerWidth;
      const anchorY = Math.random()*window.innerHeight;
      const pointCount = 4 + Math.floor(Math.random()*4);
      const pts = [];
      let px = 0, py = 0;
      for (let pi=0; pi<pointCount; pi++){
        px += (Math.random()-0.5)*120;
        py += (Math.random()-0.5)*95;
        pts.push([px, py]);
      }
      const cg = document.createElementNS(svgNS, 'g');
      cg.setAttribute('class', 'constellation');
      cg.setAttribute('transform', `translate(${anchorX.toFixed(1)},${anchorY.toFixed(1)})`);

      for (let li=0; li<pts.length-1; li++){
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', pts[li][0].toFixed(1));
        line.setAttribute('y1', pts[li][1].toFixed(1));
        line.setAttribute('x2', pts[li+1][0].toFixed(1));
        line.setAttribute('y2', pts[li+1][1].toFixed(1));
        line.setAttribute('stroke', '#EDEBF7');
        line.setAttribute('stroke-width', '0.6');
        line.setAttribute('opacity', '0.22');
        cg.appendChild(line);
      }
      pts.forEach(([x, y]) => {
        const dot = document.createElementNS(svgNS, 'circle');
        dot.setAttribute('cx', x.toFixed(1));
        dot.setAttribute('cy', y.toFixed(1));
        dot.setAttribute('r', (1.1 + Math.random()*0.6).toFixed(2));
        dot.setAttribute('fill', '#EDEBF7');
        if (!reduceMotion){
          dot.classList.add('star');
          dot.style.setProperty('--min-op', (0.35 + Math.random()*0.15).toFixed(2));
          dot.style.setProperty('--max-op', (0.75 + Math.random()*0.25).toFixed(2));
          dot.style.animationDuration = (2.5 + Math.random()*4).toFixed(1) + 's';
          dot.style.animationDelay = (Math.random()*4).toFixed(1) + 's';
        } else {
          dot.setAttribute('opacity', '0.7');
        }
        cg.appendChild(dot);
      });

      svg.appendChild(cg);
    }

    wrap.appendChild(svg);
  })();

  const svg = document.getElementById('graph');
  const svgNS = 'http://www.w3.org/2000/svg';
  let W = window.innerWidth, H = window.innerHeight;
  let cx = W/2, cy = H/2;

  let nodes = [];
  let pan = {x:0, y:0};
  let panning = false, panStart = null;

  // ---------- storage (plain localStorage, works on any host) ----------
  async function loadState(){
    // read local data synchronously — the page renders from this right
    // away, with zero network wait. Any fresher cloud copy is checked
    // for and applied in the background afterward, never blocking the
    // initial render.
    const saved = SiteSync.loadLocal('alltodo-nodes', true);
    nodes = saved && saved.length ? saved : DEFAULT_NODES.map(n => ({...n}));

    SiteSync.checkCloud('alltodo-nodes', true, (fresher) => {
      if (fresher && fresher.length){
        nodes = fresher;
        buildScene();
        relayout();
      }
    });
  }
  async function saveNodes(){
    SiteSync.save('alltodo-nodes', nodes);
  }
  // ---------- layout ----------
  // School, RA, and Lab are their own separate clusters on this same
  // page, each with their own anchor point — To-do stays the true
  // center, with no line connecting it to any cluster
  const HUB_ANCHORS = {
    todo:   { x: 0, y: 0 },
    school: { x: -259.8, y: -150 },
    ra:     { x: 259.8, y: -150 },
    lab:    { x: 0, y: 300 },
  };
  // all three share the same orbit speed so the 120° spacing between
  // them stays exact forever, rotating together as a fixed formation
  const ORBIT = {
    school: { radius: Math.hypot(HUB_ANCHORS.school.x, HUB_ANCHORS.school.y), angle: Math.atan2(HUB_ANCHORS.school.y, HUB_ANCHORS.school.x), speed: (2*Math.PI)/340 },
    ra:     { radius: Math.hypot(HUB_ANCHORS.ra.x, HUB_ANCHORS.ra.y), angle: Math.atan2(HUB_ANCHORS.ra.y, HUB_ANCHORS.ra.x), speed: (2*Math.PI)/340 },
    lab:    { radius: Math.hypot(HUB_ANCHORS.lab.x, HUB_ANCHORS.lab.y), angle: Math.atan2(HUB_ANCHORS.lab.y, HUB_ANCHORS.lab.x), speed: (2*Math.PI)/340 },
  };
  const RING_RADIUS = { apps: 105, social: 145, projects: 95, other: 125 };
  const CAT_ANGLE_OFFSET = { apps: 15, social: 110, projects: 205, other: 300 };

  // stable pseudo-random 0..1 from a string, so the "natural" jitter
  // stays put across relayouts instead of reshuffling every time
  function hash01(str){
    let h = 0;
    for (let i=0; i<str.length; i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
    return ((h % 1000) + 1000) % 1000 / 1000;
  }

  // blends a hex color toward white by `amt` (0-1) — used for the flat
  // highlight facet on stars/nodes, a distinct solid tone rather than
  // any kind of gradient
  function lighten(hex, amt){
    const c = hex.replace('#', '');
    const full = c.length === 3 ? c.split('').map(x => x+x).join('') : c;
    const num = parseInt(full, 16);
    let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
    r = Math.round(r + (255-r)*amt);
    g = Math.round(g + (255-g)*amt);
    b = Math.round(b + (255-b)*amt);
    return `rgb(${r},${g},${b})`;
  }
  // blends a hex color toward black by `amt` (0-1) — the shadow-side
  // counterpart to lighten(), for the same flat two-tone facet technique
  function darken(hex, amt){
    const c = hex.replace('#', '');
    const full = c.length === 3 ? c.split('').map(x => x+x).join('') : c;
    const num = parseInt(full, 16);
    let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
    r = Math.round(r * (1-amt));
    g = Math.round(g * (1-amt));
    b = Math.round(b * (1-amt));
    return `rgb(${r},${g},${b})`;
  }


  function computeTargets(){
    const byGroup = {};
    nodes.forEach(n => {
      const hub = n.hub || 'todo';
      const key = hub + '|' + n.category;
      (byGroup[key] ||= []).push(n);
    });
    Object.keys(byGroup).forEach(key => {
      const [hub, cat] = key.split('|');
      const anchor = HUB_ANCHORS[hub] || HUB_ANCHORS.todo;
      const arr = byGroup[key];
      const spread = 65;
      const base = CAT_ANGLE_OFFSET[cat] ?? 270;
      arr.forEach((n, i) => {
        const t = arr.length === 1 ? 0.5 : i/(arr.length-1);
        const rand = hash01(n.id);
        const rand2 = hash01(n.id + 'r');
        const angle = (base - spread/2 + t*spread + (rand-0.5)*26) * Math.PI/180;
        const r = Math.max(115, (RING_RADIUS[cat] ?? 130) + (rand2-0.5)*40);
        n.tx = anchor.x + Math.cos(angle) * r;
        n.ty = anchor.y + Math.sin(angle) * r;
        // remember this node's position relative to its own hub, so that
        // as the hub orbits, the node can just be re-anchored each frame
        n.relX = n.tx - anchor.x;
        n.relY = n.ty - anchor.y;
        if (n.x === undefined){ n.x = n.tx + (Math.random()-0.5)*20; n.y = n.ty + (Math.random()-0.5)*20; }
      });
    });
  }

  // ---------- render ----------
  let gEls = {};

  function buildScene(){
    svg.innerHTML = '';
    const defs = document.createElementNS(svgNS, 'defs');
    const glowFilter = document.createElementNS(svgNS, 'filter');
    glowFilter.setAttribute('id', 'starglow');
    glowFilter.setAttribute('x', '-100%'); glowFilter.setAttribute('y', '-100%');
    glowFilter.setAttribute('width', '300%'); glowFilter.setAttribute('height', '300%');
    glowFilter.innerHTML = '<feGaussianBlur stdDeviation="3.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>';
    defs.appendChild(glowFilter);

    const atmoGrad = document.createElementNS(svgNS, 'radialGradient');
    atmoGrad.setAttribute('id', 'atmoGrad');
    atmoGrad.innerHTML = '<stop offset="0%" stop-color="var(--you-glow)" stop-opacity="0.5"/><stop offset="55%" stop-color="var(--you-glow)" stop-opacity="0.16"/><stop offset="100%" stop-color="var(--you-glow)" stop-opacity="0"/>';
    defs.appendChild(atmoGrad);

    // shared clip shapes for the faceted highlight look — a solid-color
    // highlight clipped to the star/circle's own silhouette, hard-edged,
    // no blur or gradient, like one flat facet of a cut gem catching light
    const starClip = document.createElementNS(svgNS, 'clipPath');
    starClip.setAttribute('id', 'starClip');
    starClip.innerHTML = '<path d="M0,-10 C1.1,-3.3 3.3,-1.1 10,0 C3.3,1.1 1.1,3.3 0,10 C-1.1,3.3 -3.3,1.1 -10,0 C-3.3,-1.1 -1.1,-3.3 0,-10 Z"/>';
    defs.appendChild(starClip);

    const circleClip = document.createElementNS(svgNS, 'clipPath');
    circleClip.setAttribute('id', 'circleClip');
    circleClip.innerHTML = '<circle r="20"/>';
    defs.appendChild(circleClip);

    const circleClipSmall = document.createElementNS(svgNS, 'clipPath');
    circleClipSmall.setAttribute('id', 'circleClipSmall');
    circleClipSmall.innerHTML = '<circle r="11"/>';
    defs.appendChild(circleClipSmall);

    svg.appendChild(defs);

    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('id', 'scene');
    svg.appendChild(g);

    // faint orbit rings, drawn first so they sit behind everything else
    ['school', 'ra', 'lab'].forEach(hub => {
      const ring = document.createElementNS(svgNS, 'circle');
      ring.setAttribute('cx', 0); ring.setAttribute('cy', 0);
      ring.setAttribute('r', ORBIT[hub].radius);
      ring.setAttribute('fill', 'none');
      ring.setAttribute('stroke', 'rgba(237,235,247,0.09)');
      ring.setAttribute('stroke-width', '1');
      ring.setAttribute('stroke-dasharray', '2,6');
      g.appendChild(ring);
    });

    const lineGroup = document.createElementNS(svgNS, 'g');
    lineGroup.id = 'lines';
    g.appendChild(lineGroup);
    nodes.forEach(n => {
      const line = document.createElementNS(svgNS, 'line');
      line.setAttribute('class', 'node-line');
      line.setAttribute('stroke', '#EDEBF7');
      line.setAttribute('stroke-width', '1');
      // stagger each line's breathing so they don't all pulse in lockstep
      line.style.animationDelay = '-' + (Math.random()*5).toFixed(2) + 's';
      lineGroup.appendChild(line);
      n._line = line;
    });

    const you = document.createElementNS(svgNS, 'g');
    you.setAttribute('class', 'you-node');

    const haloOuter = document.createElementNS(svgNS, 'circle');
    haloOuter.setAttribute('class', 'you-halo you-halo-outer');
    haloOuter.setAttribute('r', 68);
    haloOuter.setAttribute('fill', 'url(#atmoGrad)');

    const haloInner = document.createElementNS(svgNS, 'circle');
    haloInner.setAttribute('class', 'you-halo you-halo-inner');
    haloInner.setAttribute('r', 34);
    haloInner.setAttribute('fill', 'url(#atmoGrad)');

    const youCoreHex = getComputedStyle(document.documentElement).getPropertyValue('--you-core').trim();

    // To-do is a clockwork gear that also radiates like a sun — fitting
    // for a hub with its own orbiting sub-hubs (School, RA, Lab), the
    // same reasoning Home and Work use. 12 rays echo a clock face's
    // hour marks, and rotate slowly on their own, layered against the
    // faster-sweeping second hand and the mostly-static gear body.
    const clockRays = document.createElementNS(svgNS, 'g');
    clockRays.setAttribute('class', 'sun-rays');
    for (let i = 0; i < 12; i++){
      const ray = document.createElementNS(svgNS, 'path');
      const isHour = i % 3 === 0;
      const len = isHour ? 30 : 25;
      const w = isHour ? 1.3 : 0.8;
      ray.setAttribute('d', `M-${w},-20 L0,-${len} L${w},-20 Z`);
      ray.setAttribute('transform', `rotate(${(360/12)*i})`);
      ray.setAttribute('fill', isHour ? lighten(youCoreHex, 0.3) : darken(youCoreHex, 0.05));
      ray.setAttribute('opacity', isHour ? '0.75' : '0.45');
      clockRays.appendChild(ray);
    }

    // gear teeth around the main gear's rim
    const core = document.createElementNS(svgNS, 'circle');
    core.setAttribute('r', 17);
    core.setAttribute('fill', 'var(--you-core)');
    core.setAttribute('stroke', 'var(--you-shadow)');
    core.setAttribute('stroke-width', '1.2');
    core.setAttribute('filter', 'url(#starglow)');

    const mainTeeth = document.createElementNS(svgNS, 'g');
    for (let i = 0; i < 12; i++){
      const tooth = document.createElementNS(svgNS, 'rect');
      tooth.setAttribute('x', -1.3); tooth.setAttribute('y', -19.5);
      tooth.setAttribute('width', '2.6'); tooth.setAttribute('height', '3');
      tooth.setAttribute('fill', darken(youCoreHex, 0.25));
      tooth.setAttribute('stroke', darken(youCoreHex, 0.4));
      tooth.setAttribute('stroke-width', '0.3');
      tooth.setAttribute('transform', `rotate(${(360/12)*i})`);
      mainTeeth.appendChild(tooth);
    }

    // a ring of small bolts/rivets, a mechanical detail
    const bolts = document.createElementNS(svgNS, 'g');
    for (let i = 0; i < 6; i++){
      const bolt = document.createElementNS(svgNS, 'circle');
      const a = (Math.PI/180) * (60*i);
      bolt.setAttribute('cx', (12*Math.cos(a)).toFixed(1));
      bolt.setAttribute('cy', (12*Math.sin(a)).toFixed(1));
      bolt.setAttribute('r', 1.3);
      bolt.setAttribute('fill', darken(youCoreHex, 0.3));
      bolt.setAttribute('opacity', '0.6');
      bolts.appendChild(bolt);
    }

    // a sweeping second hand, continuously rotating
    const handWrap = document.createElementNS(svgNS, 'g');
    const hand = document.createElementNS(svgNS, 'line');
    hand.setAttribute('x1', 0); hand.setAttribute('y1', 0);
    hand.setAttribute('x2', 0); hand.setAttribute('y2', -14);
    hand.setAttribute('stroke', darken(youCoreHex, 0.4));
    hand.setAttribute('stroke-width', '1.2');
    hand.setAttribute('stroke-linecap', 'round');
    const handHub = document.createElementNS(svgNS, 'circle');
    handHub.setAttribute('r', 1.6);
    handHub.setAttribute('fill', darken(youCoreHex, 0.4));
    handWrap.appendChild(hand);
    handWrap.appendChild(handHub);
    // rotation driven by decorFrame() below instead of SMIL — starts
    // immediately and reliably rather than sometimes appearing frozen
    // right after buildScene()'s heavy synchronous DOM construction
    gEls.handWrap = handWrap;

    // a smaller gear meshing alongside the main one
    // a small energy flare near the rim — a spark catching light off
    // the gear's teeth, in place of what was a redundant extra circle
    const flare = document.createElementNS(svgNS, 'path');
    const fSize = 3.6;
    flare.setAttribute('d', `M0,-${fSize} L${fSize*0.2},-${fSize*0.2} L${fSize},0 L${fSize*0.2},${fSize*0.2} L0,${fSize} L-${fSize*0.2},${fSize*0.2} L-${fSize},0 L-${fSize*0.2},-${fSize*0.2} Z`);
    flare.setAttribute('transform', 'translate(25,-16)');
    flare.setAttribute('fill', lighten(youCoreHex, 0.65));
    flare.setAttribute('class', 'node-glint');
    flare.style.animationDuration = '3.2s';

    const label = document.createElementNS(svgNS, 'text');
    label.setAttribute('class', 'you-label');
    label.setAttribute('y', 44);
    label.textContent = 'To-do';

    you.appendChild(haloOuter);
    you.appendChild(haloInner);
    you.appendChild(clockRays);
    you.appendChild(flare);
    you.appendChild(mainTeeth);
    you.appendChild(core);
    you.appendChild(bolts);
    you.appendChild(handWrap);
    you.appendChild(label);
    g.appendChild(you);
    gEls.you = you;

    // School, RA, and Lab get their own small hub markers, positioned at
    // their anchors — decorative labels for the cluster, not clickable,
    // deliberately not connected back to To-do by any line
    gEls.miniHubs = {};
    [
      { hub: 'school', label: 'School' },
      { hub: 'ra', label: 'RA' },
      { hub: 'lab', label: 'Lab' },
    ].forEach(({ hub, label: hubLabel }) => {
      const anchor = HUB_ANCHORS[hub];
      const mini = document.createElementNS(svgNS, 'g');
      mini.setAttribute('class', 'you-node');
      mini.setAttribute('transform', `translate(${anchor.x},${anchor.y})`);
      gEls.miniHubs[hub] = mini;

      const mHaloOuter = document.createElementNS(svgNS, 'circle');
      mHaloOuter.setAttribute('class', 'you-halo you-halo-outer');
      mHaloOuter.setAttribute('r', 34);
      mHaloOuter.setAttribute('fill', 'url(#atmoGrad)');

      const mHaloInner = document.createElementNS(svgNS, 'circle');
      mHaloInner.setAttribute('class', 'you-halo you-halo-inner');
      mHaloInner.setAttribute('r', 17);
      mHaloInner.setAttribute('fill', 'url(#atmoGrad)');

      const mCoreHex = getComputedStyle(document.documentElement).getPropertyValue('--you-core').trim();

      const mCore = document.createElementNS(svgNS, 'circle');
      mCore.setAttribute('r', 10);
      mCore.setAttribute('fill', 'var(--you-core)');
      mCore.setAttribute('stroke', 'var(--you-shadow)');
      mCore.setAttribute('stroke-width', '1');
      mCore.setAttribute('filter', 'url(#starglow)');

      const mRim = document.createElementNS(svgNS, 'circle');
      mRim.setAttribute('r', 10.4);
      mRim.setAttribute('fill', 'none');
      mRim.setAttribute('stroke', 'var(--you-glow)');
      mRim.setAttribute('stroke-width', '0.6');
      mRim.setAttribute('opacity', '0.5');

      const mLabel = document.createElementNS(svgNS, 'text');
      mLabel.setAttribute('class', 'you-label');
      mLabel.setAttribute('y', 26);
      mLabel.setAttribute('font-size', '12');
      mLabel.textContent = hubLabel;

      mini.appendChild(mHaloOuter);
      mini.appendChild(mHaloInner);

      // each mini-hub gets its own distinct "generic planet" flavor —
      // different combinations of ring/bands/craters/moons, so School,
      // RA, and Lab are visually varied instead of identical circles
      function moonOn(mini, radius, size, dur, reverse){
        const orbit = document.createElementNS(svgNS, 'g');
        const m = document.createElementNS(svgNS, 'circle');
        m.setAttribute('cx', radius); m.setAttribute('cy', 0);
        m.setAttribute('r', size);
        m.setAttribute('fill', lighten(mCoreHex, 0.55));
        m.setAttribute('stroke', darken(mCoreHex, 0.3));
        m.setAttribute('stroke-width', '0.5');
        orbit.appendChild(m);
        if (!reduceMotion){
          const anim = document.createElementNS(svgNS, 'animateTransform');
          anim.setAttribute('attributeName', 'transform');
          anim.setAttribute('type', 'rotate');
          anim.setAttribute('from', reverse ? '360 0 0' : '0 0 0');
          anim.setAttribute('to', reverse ? '0 0 0' : '360 0 0');
          anim.setAttribute('dur', dur + 's');
          anim.setAttribute('repeatCount', 'indefinite');
          orbit.appendChild(anim);
        }
        mini.appendChild(orbit);
      }

      if (hub === 'school'){
        // a ringed planet with two small moons
        const ring = document.createElementNS(svgNS, 'ellipse');
        ring.setAttribute('rx', 16); ring.setAttribute('ry', 4.2);
        ring.setAttribute('transform', 'rotate(-14)');
        ring.setAttribute('fill', 'none');
        ring.setAttribute('stroke', 'var(--you-glow)');
        ring.setAttribute('stroke-width', '1.1');
        ring.setAttribute('opacity', '0.5');
        mini.appendChild(ring);
        mini.appendChild(mCore);
        moonOn(mini, 17, 1.3, (12 + Math.random()*4).toFixed(1), false);
        moonOn(mini, 13, 1, (8 + Math.random()*3).toFixed(1), true);
      } else if (hub === 'ra'){
        // a banded planet with a bright spot — no ring, no moon
        mini.appendChild(mCore);
        const bandDark = document.createElementNS(svgNS, 'ellipse');
        bandDark.setAttribute('cx', 1); bandDark.setAttribute('cy', 4);
        bandDark.setAttribute('rx', 11); bandDark.setAttribute('ry', 3.4);
        bandDark.setAttribute('transform', 'rotate(-9)');
        bandDark.setAttribute('fill', darken(mCoreHex, 0.22));
        bandDark.setAttribute('opacity', '0.75');
        bandDark.setAttribute('clip-path', 'url(#circleClipSmall)');
        mini.appendChild(bandDark);
        const bandLight = document.createElementNS(svgNS, 'ellipse');
        bandLight.setAttribute('cx', -2); bandLight.setAttribute('cy', -4);
        bandLight.setAttribute('rx', 10); bandLight.setAttribute('ry', 3);
        bandLight.setAttribute('transform', 'rotate(11)');
        bandLight.setAttribute('fill', lighten(mCoreHex, 0.35));
        bandLight.setAttribute('opacity', '0.8');
        bandLight.setAttribute('clip-path', 'url(#circleClipSmall)');
        mini.appendChild(bandLight);
        const spot = document.createElementNS(svgNS, 'ellipse');
        spot.setAttribute('cx', 3); spot.setAttribute('cy', 1);
        spot.setAttribute('rx', 2.2); spot.setAttribute('ry', 1.4);
        spot.setAttribute('fill', lighten(mCoreHex, 0.6));
        spot.setAttribute('opacity', '0.8');
        spot.setAttribute('clip-path', 'url(#circleClipSmall)');
        mini.appendChild(spot);
      } else {
        // a cratered moon with a soft shine highlight — no ring, no moon
        mini.appendChild(mCore);
        [[-3,-2,3],[2.5,2,2],[-1,3.5,1.6]].forEach(([cx,cy,r]) => {
          const crater = document.createElementNS(svgNS, 'circle');
          crater.setAttribute('cx', cx); crater.setAttribute('cy', cy); crater.setAttribute('r', r);
          crater.setAttribute('fill', darken(mCoreHex, 0.18));
          crater.setAttribute('opacity', '0.5');
          crater.setAttribute('clip-path', 'url(#circleClipSmall)');
          mini.appendChild(crater);
        });
        const shine = document.createElementNS(svgNS, 'ellipse');
        shine.setAttribute('cx', -3); shine.setAttribute('cy', -4);
        shine.setAttribute('rx', 3.5); shine.setAttribute('ry', 2.6);
        shine.setAttribute('fill', lighten(mCoreHex, 0.4));
        shine.setAttribute('opacity', '0.5');
        shine.setAttribute('clip-path', 'url(#circleClipSmall)');
        mini.appendChild(shine);
      }

      mini.appendChild(mRim);
      mini.appendChild(mLabel);

      // clicking a mini-hub opens "Add a task" pre-set to that hub,
      // instead of having to open it plain and pick from the dropdown
      let miniDownAt = null, miniMoved = false;
      mini.addEventListener('pointerdown', e => { miniDownAt = {x:e.clientX,y:e.clientY}; miniMoved = false; e.stopPropagation(); });
      mini.addEventListener('pointermove', e => {
        if (!miniDownAt) return;
        if (Math.hypot(e.clientX-miniDownAt.x, e.clientY-miniDownAt.y) > 6) miniMoved = true;
      });
      mini.addEventListener('pointerup', e => {
        e.stopPropagation();
        if (!miniMoved){
          document.getElementById('f-hub').value = hub;
          document.getElementById('f-name').value = '';
          document.getElementById('f-subject').value = '';
          document.getElementById('f-due').value = '';
          document.getElementById('f-url').value = '';
          document.getElementById('f-color').value = '#2ECC71';
          overlay.classList.add('open');
          document.getElementById('f-name').focus();
          buildModalFrame();
        }
        miniDownAt = null;
      });

      g.appendChild(mini);
    });

    let youDownAt = null, youMoved = false;
    you.addEventListener('pointerdown', e => { youDownAt = {x:e.clientX,y:e.clientY}; youMoved = false; e.stopPropagation(); });
    you.addEventListener('pointermove', e => {
      if (!youDownAt) return;
      if (Math.abs(e.clientX-youDownAt.x) > 4 || Math.abs(e.clientY-youDownAt.y) > 4) youMoved = true;
    });
    you.addEventListener('pointerup', e => {
      e.stopPropagation();
      if (!youMoved) zoomOutHome();
      youDownAt = null;
    });

    nodes.forEach(n => {
      const group = document.createElementNS(svgNS, 'g');
      group.setAttribute('class', 'node-group');

      // invisible larger hit area — the visible star shape is small and
      // fiddly to hover/click precisely, this extends both without
      // affecting how anything looks
      const hitArea = document.createElementNS(svgNS, 'circle');
      hitArea.setAttribute('class', 'hit-area');
      hitArea.setAttribute('r', 22);
      group.appendChild(hitArea);

      // a soft pulsing glow sitting behind the star itself — separate
      // timing from the star's own twinkle so the two never sync up
      const glow = document.createElementNS(svgNS, 'circle');
      glow.setAttribute('class', 'node-glow');
      glow.setAttribute('r', 9);
      glow.setAttribute('fill', n.color || CATS[n.category]?.hex || CATS.other.hex);
      glow.style.animationDuration = (4 + Math.random()*3).toFixed(2) + 's';
      glow.style.animationDelay = '-' + (Math.random()*6).toFixed(2) + 's';

      const starColor = n.color || CATS[n.category]?.hex || CATS.other.hex;

      // a proper layered sparkle burst — long primary rays, shorter
      // secondary rays rotated 45°, and a bright core — each a distinct
      // flat tone. Genuinely more visual richness than a single blob,
      // still zero gradients/blur in the shapes themselves.
      const circle = document.createElementNS(svgNS, 'g');
      circle.setAttribute('class', 'node-circle node-star');
      circle.setAttribute('filter', 'url(#starglow)');
      circle.style.setProperty('--s-min', (0.72 + Math.random()*0.12).toFixed(2));
      circle.style.setProperty('--s-max', (1.12 + Math.random()*0.22).toFixed(2));
      circle.style.setProperty('--o-min', (0.5 + Math.random()*0.2).toFixed(2));
      circle.style.setProperty('--o-max', (0.92 + Math.random()*0.08).toFixed(2));
      circle.style.setProperty('--rot', (Math.random()*10 - 5).toFixed(1) + 'deg');
      circle.style.animationDuration = (6 + Math.random()*6).toFixed(2) + 's';
      circle.style.animationDelay = '-' + (Math.random()*12).toFixed(2) + 's';

      const raysSecondary = document.createElementNS(svgNS, 'g');
      raysSecondary.setAttribute('transform', 'rotate(45)');
      const raysSecondaryPath = document.createElementNS(svgNS, 'path');
      raysSecondaryPath.setAttribute('d', 'M0,-8 L1.3,-1.3 L8,0 L1.3,1.3 L0,8 L-1.3,1.3 L-8,0 L-1.3,-1.3 Z');
      raysSecondaryPath.setAttribute('fill', lighten(starColor, 0.35));
      raysSecondary.appendChild(raysSecondaryPath);

      const raysPrimary = document.createElementNS(svgNS, 'path');
      raysPrimary.setAttribute('d', 'M0,-14 L2.2,-2.2 L14,0 L2.2,2.2 L0,14 L-2.2,2.2 L-14,0 L-2.2,-2.2 Z');
      raysPrimary.setAttribute('fill', starColor);
      raysPrimary.setAttribute('stroke', darken(starColor, 0.35));
      raysPrimary.setAttribute('stroke-width', '0.6');

      const starCore = document.createElementNS(svgNS, 'circle');
      starCore.setAttribute('r', 2.6);
      starCore.setAttribute('fill', lighten(starColor, 0.78));

      circle.appendChild(raysSecondary);
      circle.appendChild(raysPrimary);
      circle.appendChild(starCore);

      // small glint highlight, offset slightly off-center like light
      // catching one point of the burst rather than the whole thing
      const glint = document.createElementNS(svgNS, 'circle');
      glint.setAttribute('class', 'node-glint');
      glint.setAttribute('cx', -3.2); glint.setAttribute('cy', -3.2);
      glint.setAttribute('r', 1.4);
      glint.style.animationDuration = (3.5 + Math.random()*3.5).toFixed(2) + 's';
      glint.style.animationDelay = '-' + (Math.random()*7).toFixed(2) + 's';

      const starWrap = document.createElementNS(svgNS, 'g');
      starWrap.setAttribute('class', 'star-wrap');
      starWrap.appendChild(glow);
      starWrap.appendChild(circle);
      starWrap.appendChild(glint);

      // labels point away from this node's hub rather than always
      // rightward — a node landing on the LEFT side of its hub had its
      // label extending back through the hub's own label before this
      const catAngle = CAT_ANGLE_OFFSET[n.category] ?? 0;
      const labelLeft = catAngle > 90 && catAngle < 270;
      const labelX = labelLeft ? -13 : 13;

      const text = document.createElementNS(svgNS, 'text');
      text.setAttribute('class', 'node-label');
      text.setAttribute('x', labelX);
      text.setAttribute('y', 4);
      if (labelLeft) text.setAttribute('text-anchor', 'end');
      text.textContent = n.name;

      // the star, its label, and its due date (if any) float together as
      // one gently drifting unit — independent per-star timing/range so
      // the whole field moves organically rather than in unison
      const floatWrap = document.createElementNS(svgNS, 'g');
      floatWrap.setAttribute('class', 'float-wrap');
      floatWrap.style.setProperty('--float-x', (Math.random()*6 - 3).toFixed(1) + 'px');
      floatWrap.style.setProperty('--float-y', (Math.random()*8 - 4).toFixed(1) + 'px');
      floatWrap.style.animationDuration = (7 + Math.random()*5).toFixed(2) + 's';
      floatWrap.style.animationDelay = '-' + (Math.random()*10).toFixed(2) + 's';
      floatWrap.appendChild(starWrap);
      floatWrap.appendChild(text);

      if (n.dueDate){
        const due = document.createElementNS(svgNS, 'text');
        due.setAttribute('class', 'node-label node-due');
        due.setAttribute('x', labelX);
        due.setAttribute('y', 18);
        if (labelLeft) due.setAttribute('text-anchor', 'end');
        due.textContent = formatDueShort(n.dueDate);
        floatWrap.appendChild(due);
      }

      group.appendChild(floatWrap);
      g.appendChild(group);
      n._group = group;
      n._star = circle;
      n._nameLabel = text;
      n._dueLabel = n.dueDate ? floatWrap.querySelector('.node-due') : null;

      let downAt = null, moved = false;
      group.addEventListener('pointerdown', e => {
        if (e.button !== 0) return; // right-click is handled by contextmenu below, not this
        downAt = {x:e.clientX,y:e.clientY}; moved=false; e.stopPropagation();
      });
      group.addEventListener('pointermove', e => {
        if (!downAt) return;
        if (Math.abs(e.clientX-downAt.x) > 4 || Math.abs(e.clientY-downAt.y) > 4) moved = true;
      });
      group.addEventListener('pointerup', e => {
        if (e.button !== 0 || !downAt) return;
        e.stopPropagation();
        if (!moved){
          spawnClickRing(n);
          if (n.url) warpTo(n); else toggleTaskDetails(n, e);
        }
        downAt = null;
      });
      group.addEventListener('contextmenu', e => {
        e.preventDefault();
        e.stopPropagation();
        toggleTaskDetails(n, e);
      });
    });

    gEls.g = g;
  }

  // a single expanding ring, fired once right as a star is clicked —
  // separate from the ambient glow/glint, purely a one-shot response
  function spawnClickRing(n){
    if (!n._group) return;
    const ring = document.createElementNS(svgNS, 'circle');
    ring.setAttribute('class', 'click-ring');
    ring.setAttribute('cx', 0); ring.setAttribute('cy', 0);
    ring.setAttribute('r', 4);
    ring.setAttribute('stroke', n.color || CATS[n.category]?.hex || CATS.other.hex);
    n._group.appendChild(ring);
    ring.addEventListener('animationend', () => ring.remove());
  }

  function positionScene(){
    gEls.g.setAttribute('transform', `translate(${cx+pan.x}, ${cy+pan.y})`);
    gEls.you.setAttribute('transform', 'translate(0,0)');
    nodes.forEach(n => {
      n._group.setAttribute('transform', `translate(${n.x},${n.y})`);
      const anchor = HUB_ANCHORS[n.hub || 'todo'];
      n._line.setAttribute('x1', anchor.x); n._line.setAttribute('y1', anchor.y);
      n._line.setAttribute('x2', n.x); n._line.setAttribute('y2', n.y);
    });
    const bg = document.getElementById('space-bg');
    if (bg) bg.style.transform = `translate(${pan.x*0.4}px, ${pan.y*0.4}px)`;
    // the foreground dust streaks were never wired to the pan at all —
    // they'd sit frozen in place while everything else moved during a
    // drag. give them a slightly stronger factor since they're meant to
    // read as closer to the viewer than the stars/nebula behind them.
    const df = document.getElementById('dust-front');
    if (df) df.style.transform = `translate(${pan.x*0.55}px, ${pan.y*0.55}px)`;
  }

  // ---------- warp into a node ----------
  let warping = false;
  function easeInExpo(t){ return t <= 0 ? 0 : Math.pow(2, 10*t - 10); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  function resolveUrl(url){
    if (/^https?:\/\//i.test(url)) return url;
    if (/\.html?(\?|#|$)/i.test(url)) return url; // relative page on this site
    return 'https://' + url;
  }

  // ---------- task details popup ----------
  // dueDate is now captured as date+time (e.g. "2026-10-03T15:00") from
  // the datetime-local input, but older tasks saved before this change
  // only have a plain date ("2026-09-18") — both are handled here
  function parseDue(dueStr){
    if (!dueStr) return null;
    const d = dueStr.includes('T') ? new Date(dueStr) : new Date(dueStr + 'T00:00:00');
    return isNaN(d.getTime()) ? null : d;
  }
  function formatDueShort(dueStr){
    const d = parseDue(dueStr);
    if (!d) return dueStr || '';
    const datePart = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    if (!dueStr.includes('T')) return datePart;
    return datePart + ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function formatDueFull(dueStr){
    const d = parseDue(dueStr);
    if (!d) return dueStr || '';
    const datePart = d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
    if (!dueStr.includes('T')) return datePart;
    return datePart + ' · ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  // The task details "menu" is a small constellation built on the fly:
  // the star itself is the first point, then a chain of further points
  // branch off it — one per piece of info — each with a label floating
  // beside it, connected by thin dashed lines and small glowing dots.
  // There is no card, box, or background at all.
  const popupSvgNS = 'http://www.w3.org/2000/svg';
  let popupOpen = false;
  let openPopupId = null;
  let chainNode = null;
  let chainAnchorX = 0, chainAnchorY = 0; // the star's screen position when the chain was drawn
  let chainGroupEl = null;

  // keeps the whole chain rigidly attached to its star as the star moves
  // (from orbiting, panning, or both) — called every animation frame
  // while a popup is open, rather than the chain being drawn once and
  // left behind wherever the star used to be
  function updateChainPosition(){
    if (!popupOpen || !chainNode || !chainGroupEl || !chainNode._star) return;
    const rect = chainNode._star.getBoundingClientRect();
    const sx = rect.left + rect.width/2;
    const sy = rect.top + rect.height/2;
    chainGroupEl.setAttribute('transform', `translate(${sx - chainAnchorX},${sy - chainAnchorY})`);
  }

  function popupDot(svg, x, y, color, r){
    const dot = document.createElementNS(popupSvgNS, 'circle');
    dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('r', r || 2.6);
    dot.setAttribute('fill', color);
    dot.setAttribute('opacity', '0.9');
    dot.style.filter = 'url(#starglow)';
    svg.appendChild(dot);
    return dot;
  }
  // a line that draws itself in over `dur` ms, starting after `delay` ms —
  // the dashed pattern is preserved by animating stroke-dashoffset rather
  // than the line's actual length
  function popupLineGrow(svg, x1, y1, x2, y2, color, delay, dur){
    const len = Math.hypot(x2-x1, y2-y1);
    const line = document.createElementNS(popupSvgNS, 'line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke', color);
    line.setAttribute('stroke-width', '1');
    // a single solid dash exactly as long as the line itself, so sliding
    // its offset reveals the line growing point-by-point rather than a
    // dash pattern flickering past
    line.setAttribute('stroke-dasharray', `${len},${len}`);
    line.setAttribute('opacity', '0.55');
    line.style.strokeDashoffset = len;
    line.style.transition = `stroke-dashoffset ${dur}ms linear ${delay}ms`;
    svg.appendChild(line);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      line.style.strokeDashoffset = '0';
    }));
    return line;
  }
  function popupText(svg, x, y, str, cls, anchorEnd){
    const t = document.createElementNS(popupSvgNS, 'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    if (anchorEnd) t.setAttribute('text-anchor', 'end');
    t.setAttribute('class', cls);
    t.textContent = str;
    svg.appendChild(t);
    return t;
  }
  // fades an element in after `delay` ms — used for the node dot + label
  // that appear once their line has finished drawing in to reach them
  function fadeInAfter(el, delay, toOpacity){
    el.style.opacity = '0';
    el.style.transition = `opacity 160ms ease-out ${delay}ms`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.opacity = toOpacity;
    }));
  }

  function toggleTaskDetails(n, evt){
    if (evt && evt.preventDefault) evt.preventDefault();
    if (popupOpen && openPopupId === n.id) hideTaskDetails();
    else showTaskDetails(n, evt);
  }
  function showTaskDetails(n, evt){
    if (evt && evt.preventDefault) evt.preventDefault();
    const svg = document.getElementById('popup-line');
    svg.innerHTML = '';

    const rect = n._star.getBoundingClientRect();
    const sx = rect.left + rect.width/2;
    const sy = rect.top + rect.height/2;
    const color = n.color || CATS[n.category]?.hex || '#EDEBF7';

    // everything below gets drawn into this group instead of straight
    // into the svg, so the whole chain can be shifted as one rigid unit
    // to follow the star every frame (see updateChainPosition)
    const chainGroup = document.createElementNS(svg.namespaceURI, 'g');
    svg.appendChild(chainGroup);
    chainNode = n;
    chainAnchorX = sx; chainAnchorY = sy;
    chainGroupEl = chainGroup;
    const container = chainGroup;

    // branch away from whichever side of the screen has more room
    const flip = sx > window.innerWidth * 0.6;
    const dir = flip ? -1 : 1;

    // the star's own labels get hidden for the duration — they sit
    // right next to the star, which is exactly where the chain's first
    // points land, so they were overlapping. The task name becomes the
    // chain's own first field instead, so nothing is lost.
    if (n._nameLabel) n._nameLabel.style.display = 'none';
    if (n._dueLabel) n._dueLabel.style.display = 'none';

    const fields = [];
    fields.push({ value: n.name, caption: 'Task' });
    if (n.subject) fields.push({ value: n.subject, caption: 'Subject' });
    if (n.dueDate) fields.push({ value: formatDueFull(n.dueDate), caption: 'Due' });
    if (n.url) fields.push({ value: 'Open ↗', caption: 'Link', isLink: true });
    fields.push({ value: 'Mark done ✓', caption: 'Complete', isAction: true });

    // a gentle zigzag so points don't run in a straight line — spaced
    // further apart than before so text never runs into the next point
    const deltas = [[78,-50], [70,50], [-58,50], [-66,-46], [64,-40]];
    const segDur = 260; // how long each segment's line takes to draw in

    // keep every point clear of the screen edges and away from the fixed
    // icon buttons in the bottom-right corner, so the chain never runs
    // off-screen or under anything else
    const marginTop = 24, marginBottom = 24, marginSide = 130;
    const fabZoneX = window.innerWidth - 100, fabZoneY = window.innerHeight - 170;

    let px = sx, py = sy;
    popupDot(container, sx, sy, color, 2.6);

    const segments = [];

    fields.forEach((f, i) => {
      const [ddx, ddy] = deltas[i % deltas.length];
      let nx = px + ddx * dir;
      let ny = py + ddy;

      ny = Math.max(marginTop, Math.min(window.innerHeight - marginBottom, ny));
      nx = dir > 0
        ? Math.min(nx, window.innerWidth - marginSide)
        : Math.max(nx, marginSide);
      if (nx > fabZoneX && ny > fabZoneY) ny = fabZoneY - 10;

      const delay = i * segDur;

      // the line grows out to this point first...
      const line = popupLineGrow(container, px, py, nx, ny, color, delay, segDur);

      // ...then its node and label fade in right as it arrives
      const revealAt = delay + segDur - 70;
      const dot = popupDot(container, nx, ny, color, 2.4);
      fadeInAfter(dot, revealAt, '0.9');

      const textX = nx + 9 * dir;
      const anchorEnd = dir < 0;
      const capEl = popupText(container, textX, ny - 3, f.caption, 'pl-caption', anchorEnd);
      const valEl = popupText(container, textX, ny + 11, f.value, 'pl-value', anchorEnd);
      fadeInAfter(capEl, revealAt, '1');
      fadeInAfter(valEl, revealAt, '1');
      if (f.isLink){
        valEl.classList.add('pl-link');
        valEl.style.fill = color;
        valEl.style.pointerEvents = 'auto';
        valEl.addEventListener('click', () => window.open(resolveUrl(n.url), '_blank', 'noopener'));
      }
      if (f.isAction){
        valEl.classList.add('pl-link');
        valEl.style.fill = '#7CD992';
        valEl.style.pointerEvents = 'auto';
        valEl.addEventListener('click', () => collapseChain(n, segments));
      }
      segments.push({ line, dot, capEl, valEl });
      px = nx; py = ny;
    });

    popupOpen = true;
    openPopupId = n.id;
  }

  // reverses the reveal: each segment fades out and its line retracts
  // back toward the previous point, working from the outermost point in
  // to the center, before the task is actually removed
  function collapseChain(n, segments){
    const stepDur = 160;
    const reversed = segments.slice().reverse();

    reversed.forEach((seg, idx) => {
      const delay = idx * stepDur;

      seg.capEl.style.transition = `opacity 140ms ease-in ${delay}ms`;
      seg.valEl.style.transition = `opacity 140ms ease-in ${delay}ms`;
      seg.dot.style.transition = `opacity 140ms ease-in ${delay}ms`;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        seg.capEl.style.opacity = '0';
        seg.valEl.style.opacity = '0';
        seg.dot.style.opacity = '0';
      }));

      const lineDelay = delay + 90;
      const lineDur = Math.max(80, stepDur - 90);
      const x1 = parseFloat(seg.line.getAttribute('x1'));
      const y1 = parseFloat(seg.line.getAttribute('y1'));
      const x2 = parseFloat(seg.line.getAttribute('x2'));
      const y2 = parseFloat(seg.line.getAttribute('y2'));
      const len = Math.hypot(x2 - x1, y2 - y1);
      seg.line.style.transition = `stroke-dashoffset ${lineDur}ms linear ${lineDelay}ms`;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        seg.line.style.strokeDashoffset = String(len);
      }));
    });

    const totalDur = reversed.length * stepDur + 80;
    setTimeout(() => {
      hideTaskDetails();
      retractGraphNode(n, () => removeNode(n.id));
    }, totalDur);
  }

  // once the popup itself has collapsed, the star's actual line back to
  // the center node retracts the same way before the star disappears
  function retractGraphNode(n, callback){
    const line = n._line;
    const star = n._star;
    if (!line || !star){ callback(); return; }

    const dur = 200;
    const x2 = parseFloat(line.getAttribute('x2'));
    const y2 = parseFloat(line.getAttribute('y2'));
    const len = Math.hypot(x2, y2) || 1;

    line.style.animation = 'none';
    line.style.strokeDasharray = `${len},${len}`;
    line.style.strokeDashoffset = '0';
    line.style.transition = `stroke-dashoffset ${dur}ms linear`;

    star.style.animation = 'none';
    star.style.transition = `opacity ${Math.round(dur*0.6)}ms ease-in`;
    const label = n._group ? n._group.querySelectorAll('.node-label') : [];

    requestAnimationFrame(() => requestAnimationFrame(() => {
      line.style.strokeDashoffset = String(len);
      star.style.opacity = '0';
      label.forEach(t => { t.style.transition = `opacity ${Math.round(dur*0.6)}ms ease-in`; t.style.opacity = '0'; });
    }));

    setTimeout(callback, dur + 20);
  }

  function hideTaskDetails(){
    popupOpen = false;
    openPopupId = null;
    if (chainNode){
      if (chainNode._nameLabel) chainNode._nameLabel.style.display = '';
      if (chainNode._dueLabel) chainNode._dueLabel.style.display = '';
    }
    chainNode = null;
    chainGroupEl = null;
    const svg = document.getElementById('popup-line');
    if (svg) svg.innerHTML = '';
  }
  document.addEventListener('pointerdown', e => {
    if (popupOpen && !e.target.closest('#popup-line')) hideTaskDetails();
  });

  function warpTo(n){
    if (warping) return;
    const url = resolveUrl(n.url);
    if (reduceMotion){ window.location.href = url; return; }

    warping = true;
    svg.style.pointerEvents = 'none';

    const g = gEls.g;
    const bg = document.getElementById('space-bg');
    const startA = cx + pan.x, startB = cy + pan.y;
    const s = 34;
    const targetA = cx - s*n.x, targetB = cy - s*n.y;

    // stop the idle glimmer and drop the glow filter for the duration —
    // re-rasterizing a blur while scaling 34x is expensive and was the
    // real source of the lag; driving everything from one rAF loop here
    // (same approach as the zoom-out-to-home animation) keeps it smooth
    nodes.forEach(o => { o._star.style.animation = 'none'; o._star.style.filter = 'none'; });

    const dur = 420;
    let startTs = null;
    let navigated = false;

    function frame(ts){
      if (startTs === null) startTs = ts;
      const t = Math.min((ts - startTs) / dur, 1);
      const p = easeInExpo(t);

      // camera rushing toward the target star
      const curA = lerp(startA, targetA, p);
      const curB = lerp(startB, targetB, p);
      const curS = lerp(1, s, p);
      g.style.transform = `translate(${curA}px, ${curB}px) scale(${curS})`;

      // the whole starfield surges toward the viewer too
      if (bg) bg.style.transform = `translate(${pan.x*0.4}px, ${pan.y*0.4}px) scale(${lerp(1, 3.6, p)})`;

      // everything else fades away as we dive in
      gEls.you.style.opacity = String(Math.max(0, 1 - p*1.8));
      n._line.style.opacity = String(Math.max(0, 1 - p*1.6));
      n._star.style.opacity = String(Math.max(0, 1 - Math.max(0, p-0.35)/0.5));
      nodes.forEach(o => {
        if (o === n) return;
        o._group.style.opacity = String(Math.max(0, 1 - p*1.6));
      });

      // start the actual page navigation a bit before the animation
      // visually finishes, rather than waiting for a full stop — the
      // browser begins swapping pages while the last bit of motion is
      // still playing, which is what makes it read as one continuous
      // motion instead of "stop, then jump"
      if (!navigated && t >= 0.88){
        navigated = true;
        const flash = document.getElementById('warp-flash');
        flash.style.background = `radial-gradient(circle at 50% 50%, ${n.color || CATS[n.category]?.hex || '#fff'} 0%, transparent 70%)`;
        flash.style.transition = 'opacity 180ms ease';
        flash.style.opacity = '0.7';
        window.location.href = url;
      }

      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        // safety net: if navigation doesn't actually happen, restore
        // the page instead of leaving it faded out and locked forever
        setTimeout(() => {
          nodes.forEach(o => { o._star.style.filter = ''; o._star.style.animation = ''; o._group.style.opacity = ''; });
          n._star.style.opacity = '';
          n._line.style.opacity = '';
          gEls.you.style.opacity = '';
          svg.style.pointerEvents = '';
          warping = false;
        }, 600);
      }
    }
    requestAnimationFrame(frame);
  }
  function resetWarp(){
    const g = gEls.g;
    g.style.transition = 'transform 420ms ease-out';
    g.style.transform = '';
    nodes.forEach(o => {
      o._group.style.opacity = '';
      o._line.style.opacity = '';
      o._star.style.transition = 'opacity 300ms ease, transform 300ms ease';
      o._star.style.transform = '';
      o._star.style.opacity = '';
    });
    gEls.you.style.opacity = '';
    const bg = document.getElementById('space-bg');
    if (bg){ bg.style.transition = 'transform 420ms ease-out'; }
    setTimeout(() => {
      nodes.forEach(o => {
        o._star.style.filter = '';
        o._star.style.animation = '';
        o._star.style.transition = '';
      });
      g.style.transition = '';
      g.style.transform = '';
      svg.style.pointerEvents = '';
      svg.classList.remove('warping');
      warping = false;
      positionScene();
    }, 440);
  }

  // some browsers restore this exact page from a back-forward cache
  // when you hit Back after a star link took you to an external site —
  // that restores the frozen mid-warp visual state (zoomed in, faded
  // out, clicks disabled) instead of a fresh load. Catch that case and
  // put everything back to normal.
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) resetWarp();
  });

  // ---------- zoom out to go home (reverse of warping into a star) ----------
  function zoomOutHome(){
    if (warping) return;
    if (reduceMotion){ window.location.href = 'index.html'; return; }

    warping = true;
    svg.style.pointerEvents = 'none';

    const g = gEls.g;
    const bg = document.getElementById('space-bg');
    const startA = cx + pan.x, startB = cy + pan.y;

    nodes.forEach(o => { o._star.style.animation = 'none'; });

    const flash = document.getElementById('warp-flash');
    flash.style.background = 'radial-gradient(circle at 50% 50%, var(--you-core) 0%, transparent 70%)';
    flash.style.transition = 'opacity 220ms ease';
    flash.style.opacity = '0.7';
    setTimeout(() => { flash.style.opacity = '0'; }, 220);

    const dur = 560;
    let startTs = null;
    let navigated = false;

    function frame(ts){
      if (startTs === null) startTs = ts;
      const t = Math.min((ts - startTs) / dur, 1);
      const p = easeInExpo(t);

      // the whole scene shrinks away and dissolves, in place
      const curS = lerp(1, 0.04, p);
      g.style.transform = `translate(${startA}px, ${startB}px) scale(${curS})`;
      g.style.opacity = String(Math.max(0, 1 - p*1.2));

      // the backdrop recedes too, more gently than the foreground
      if (bg) bg.style.transform = `translate(${pan.x*0.4}px, ${pan.y*0.4}px) scale(${lerp(1, 0.55, p)})`;

      // start navigating shortly before the animation visually
      // finishes, same idea as warpTo — carries the motion through
      // into the next page instead of a dead stop then a jump
      if (!navigated && t >= 0.88){
        navigated = true;
        window.location.href = 'index.html';
      }

      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        // safety net: restore interactivity if navigation didn't
        // actually happen, instead of leaving the graph locked
        setTimeout(() => {
          svg.style.pointerEvents = '';
          warping = false;
        }, 600);
      }
    }
    requestAnimationFrame(frame);
  }

  let settling = true;
  function tick(){
    let stillMoving = false;
    nodes.forEach(n => {
      const dx = n.tx - n.x, dy = n.ty - n.y;
      n.x += dx * 0.08; n.y += dy * 0.08;
      if (Math.abs(dx) > 0.3 || Math.abs(dy) > 0.3) stillMoving = true;
    });
    positionScene();
    if (stillMoving) requestAnimationFrame(tick);
    else settling = false;
  }

  function relayout(){
    computeTargets();
    if (reduceMotion){
      nodes.forEach(n => { n.x = n.tx; n.y = n.ty; });
      positionScene();
    } else {
      // paint the current (pre-settle) positions immediately, so the scene
      // is never blank while waiting on a requestAnimationFrame callback —
      // browsers can defer/pause rAF entirely for a tab that isn't focused,
      // which otherwise left the graph unpositioned until you switched back
      positionScene();
      settling = true;
      requestAnimationFrame(tick);
    }
  }

  // School, RA, and Lab slowly drift around To-do along their orbit ring
  // — this runs continuously, separately from the initial settle-in tween
  let orbitLastTs = null;
  let orbitStarted = false;

  // the second hand spins immediately on load — its own lightweight
  // rAF loop, separate from orbitFrame's deliberate startup delay below
  let decorLastTs = null;
  let handAngle = 0;
  function decorFrame(ts){
    if (decorLastTs === null) decorLastTs = ts;
    const dt = (ts - decorLastTs) / 1000;
    decorLastTs = ts;
    if (gEls.handWrap){
      handAngle = (handAngle + (360/12) * dt) % 360;
      gEls.handWrap.setAttribute('transform', `rotate(${handAngle.toFixed(2)})`);
    }
    requestAnimationFrame(decorFrame);
  }
  if (!reduceMotion) requestAnimationFrame(decorFrame);

  function orbitFrame(ts){
    if (orbitLastTs === null) orbitLastTs = ts;
    const dt = (ts - orbitLastTs) / 1000;
    orbitLastTs = ts;

    ['school', 'ra', 'lab'].forEach(hub => {
      const o = ORBIT[hub];
      o.angle += o.speed * dt;
      const anchor = HUB_ANCHORS[hub];
      anchor.x = Math.cos(o.angle) * o.radius;
      anchor.y = Math.sin(o.angle) * o.radius;
      if (gEls.miniHubs && gEls.miniHubs[hub]){
        gEls.miniHubs[hub].setAttribute('transform', `translate(${anchor.x},${anchor.y})`);
      }
    });

    nodes.forEach(n => {
      if (n.hub !== 'school' && n.hub !== 'ra' && n.hub !== 'lab') return;
      const anchor = HUB_ANCHORS[n.hub];
      n.x = anchor.x + (n.relX || 0);
      n.y = anchor.y + (n.relY || 0);
      n.tx = n.x; n.ty = n.y;
      if (n._group) n._group.setAttribute('transform', `translate(${n.x},${n.y})`);
      if (n._line){
        n._line.setAttribute('x1', anchor.x); n._line.setAttribute('y1', anchor.y);
        n._line.setAttribute('x2', n.x); n._line.setAttribute('y2', n.y);
      }
    });

    // keep any open task-detail chain glued to its star as it moves
    updateChainPosition();

    requestAnimationFrame(orbitFrame);
  }
  if (!reduceMotion){
    if (!orbitStarted){
      orbitStarted = true;
      setTimeout(() => requestAnimationFrame(orbitFrame), 1500);
    }
  }

  svg.addEventListener('pointerdown', e => {
    panning = true; panStart = {x: e.clientX - pan.x, y: e.clientY - pan.y};
    svg.classList.add('dragging');
  });
  window.addEventListener('pointermove', e => {
    if (!panning) return;
    pan.x = e.clientX - panStart.x; pan.y = e.clientY - panStart.y;
    positionScene();
  });
  window.addEventListener('pointerup', () => { panning = false; svg.classList.remove('dragging'); });

  window.addEventListener('resize', () => {
    W = window.innerWidth; H = window.innerHeight; cx = W/2; cy = H/2;
    positionScene();
  });

  document.getElementById('home-icon-btn').addEventListener('click', () => zoomOutHome());

  function removeNode(id){
    nodes = nodes.filter(n => n.id !== id);
    saveNodes();
    buildScene();
    relayout();
  }

  // ---------- Next Class / Next Shift: linked Google Calendars ----------
  // one Google API key, two separate calendar IDs — one for classes,
  // one for shifts. Stored under a dedicated key so it syncs across
  // devices the same way everything else on the site does.
  const SCHEDULE_WORKER_URL = 'https://site-sync.carlosaq0501.workers.dev/'; // same Worker as sync.js
  function loadCalConfig(){
    try {
      const raw = localStorage.getItem('schedule-calendars-config');
      return raw ? JSON.parse(raw) : { classIcsUrl: '', shiftIcsUrl: '' };
    } catch(e){ return { classIcsUrl: '', shiftIcsUrl: '' }; }
  }
  function saveCalConfig(cfg){
    SiteSync.save('schedule-calendars-config', cfg);
  }
  function setCalStatus(msg, isError){
