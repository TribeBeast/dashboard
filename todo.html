    const el = document.getElementById('cal-modal-status');
    if (!el) return;
    el.textContent = msg;
    el.style.color = isError ? '#E4483C' : '';
  }
  // browsers can't fetch most ICS URLs directly (CORS), so this asks
  // the Worker to fetch and parse it server-side instead — same Worker
  // that already handles sync and the password check
  async function fetchNextIcsEvent(icsUrl){
    const res = await fetch(SCHEDULE_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'fetchIcs', url: icsUrl }),
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || ('Request failed (' + res.status + ')'));
    return data.event || null;
  }
  function formatEventRange(ev){
    if (!ev) return '—';
    const name = ev.summary || '(untitled)';
    if (ev.allDay){
      return name; // all-day event — no meaningful time range to show
    }
    const start = new Date(ev.start);
    const end = new Date(ev.end);
    const startTime = start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const endTime = end.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    return `${name} ${startTime}–${endTime}`;
  }
  // returns an array of per-calendar error messages (empty if every
  // linked calendar synced fine) — each calendar is still fetched
  // independently so one failing doesn't block the other from updating,
  // but the caller can now actually see what went wrong, unlike before
  async function refreshScheduleCalendars(){
    const cfg = loadCalConfig();
    const errors = [];
    if (cfg.classIcsUrl){
      try {
        const ev = await fetchNextIcsEvent(cfg.classIcsUrl);
        const el = document.getElementById('topbar-next-class');
        if (el) el.textContent = formatEventRange(ev);
      } catch(e){ errors.push('Class: ' + e.message); }
    }
    if (cfg.shiftIcsUrl){
      try {
        const ev = await fetchNextIcsEvent(cfg.shiftIcsUrl);
        const el = document.getElementById('topbar-next-shift');
        if (el) el.textContent = formatEventRange(ev);
      } catch(e){ errors.push('Shift: ' + e.message); }
    }
    return errors;
  }
  function initCalSettingsUI(){
    const overlay = document.getElementById('cal-modal-overlay');
    const btn = document.getElementById('topbar-cal-settings-btn');
    if (!overlay || !btn) return;
    btn.addEventListener('click', () => {
      const cfg = loadCalConfig();
      document.getElementById('cal-class-ics').value = cfg.classIcsUrl || '';
      document.getElementById('cal-shift-ics').value = cfg.shiftIcsUrl || '';
      setCalStatus('');
      overlay.classList.add('open');
      buildModalFrame('cal-modal', 'cal-modal-frame');
    });
    document.getElementById('cal-modal-cancel').addEventListener('click', () => overlay.classList.remove('open'));
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
    document.getElementById('cal-modal-save').addEventListener('click', async () => {
      const cfg = {
        classIcsUrl: document.getElementById('cal-class-ics').value.trim(),
        shiftIcsUrl: document.getElementById('cal-shift-ics').value.trim(),
      };
      if (!cfg.classIcsUrl && !cfg.shiftIcsUrl){
        setCalStatus('Add at least one calendar\'s ICS URL.', true);
        return;
      }
      saveCalConfig(cfg);
      setCalStatus('Syncing…');
      const errors = await refreshScheduleCalendars();
      if (errors.length){
        setCalStatus(errors.join(' · '), true);
      } else {
        setCalStatus('Synced.');
      }
    });
  }

  // clock — fixed to the top-right of the viewport, independent of
  // the pannable graph
  function updateClock(){
    const now = new Date();
    document.getElementById('topbar-clock-time').textContent =
      now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    document.getElementById('topbar-clock-date').textContent =
      now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
    updateDueSoon();
  }
  // "Due Soon" reads the same To-do task data the To-do page itself
  // uses (alltodo-nodes), so it works from any page without needing
  // its own separate data entry. "Next Class" and "Next Shift" are
  // populated from linked Google Calendars — see the settings gear on
  // the clock widget, and refreshScheduleCalendars() above.
  // dueDate is captured as date+time (e.g. "2026-10-03T15:00") from
  // the To-do page's datetime-local input; older tasks saved before
  // that change only have a plain date ("2026-09-18") and fall back to
  // showing just the date since there's no real time to show
  function updateDueSoon(){
    const el = document.getElementById('topbar-due-soon');
    if (!el) return;
    let tasks = [];
    try {
      const raw = localStorage.getItem('alltodo-nodes');
      tasks = raw ? JSON.parse(raw) : [];
    } catch(e){}
    const now = Date.now();
    let nearest = null;
    tasks.forEach(t => {
      if (!t.dueDate) return;
      const hasTime = t.dueDate.includes('T');
      const d = hasTime ? new Date(t.dueDate) : new Date(t.dueDate + 'T23:59:59');
      const due = d.getTime();
      if (!isNaN(due) && due >= now && (!nearest || due < nearest.due)){
        nearest = { name: t.name, due, hasTime, date: d };
      }
    });
    if (!nearest){
      el.textContent = '—';
    } else if (nearest.hasTime){
      el.textContent = nearest.name + ' ' + nearest.date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    } else {
      el.textContent = nearest.name + ' ' + nearest.date.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }
  }
  updateClock();
  setInterval(updateClock, 1000*15);

  // ---------- add modal ----------
  const overlay = document.getElementById('modal-overlay');

  const modalSvgNS = 'http://www.w3.org/2000/svg';
  const STAR_PATH = 'M0,-10 C1.1,-3.3 3.3,-1.1 10,0 C3.3,1.1 1.1,3.3 0,10 C-1.1,3.3 -3.3,1.1 -10,0 C-3.3,-1.1 -1.1,-3.3 0,-10 Z';

  function buildModalFrame(boxId, svgId){
    boxId = boxId || 'modal';
    svgId = svgId || 'modal-frame';
    const modal = document.getElementById(boxId);
    const svg = document.getElementById(svgId);
    if (!modal || !svg) return;
    const w = modal.offsetWidth, h = modal.offsetHeight;
    if (!w || !h) return;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.innerHTML = '';

    const defs = document.createElementNS(modalSvgNS, 'defs');
    const glow = document.createElementNS(modalSvgNS, 'filter');
    glow.setAttribute('id', 'frameGlow');
    glow.setAttribute('x', '-60%'); glow.setAttribute('y', '-60%');
    glow.setAttribute('width', '220%'); glow.setAttribute('height', '220%');
    glow.innerHTML = '<feGaussianBlur stdDeviation="3.4"/>';
    defs.appendChild(glow);
    svg.appendChild(defs);

    // a solid, glowing border — its corners land exactly on each star's
    // center below, so the frame reads as running straight through them.
    // built from a soft blurred copy underneath a crisp solid line on top.
    const x = 1, y = 1, rw = w - 2, rh = h - 2;
    const glowRect = document.createElementNS(modalSvgNS, 'rect');
    glowRect.setAttribute('x', x); glowRect.setAttribute('y', y);
    glowRect.setAttribute('width', rw); glowRect.setAttribute('height', rh);
    glowRect.setAttribute('fill', 'none');
    glowRect.setAttribute('stroke', '#EDEBF7');
    glowRect.setAttribute('stroke-width', '2.5');
    glowRect.setAttribute('opacity', '0.45');
    glowRect.setAttribute('filter', 'url(#frameGlow)');
    svg.appendChild(glowRect);

    const rect = document.createElementNS(modalSvgNS, 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', rw); rect.setAttribute('height', rh);
    rect.setAttribute('fill', 'none');
    rect.setAttribute('stroke', '#EDEBF7');
    rect.setAttribute('stroke-width', '1.1');
    rect.setAttribute('opacity', '0.9');
    svg.appendChild(rect);

    [[0,0], [w,0], [0,h], [w,h]].forEach(([sx, sy]) => {
      const g = document.createElementNS(modalSvgNS, 'g');
      g.setAttribute('transform', `translate(${sx},${sy}) scale(1.05)`);
      const haloDot = document.createElementNS(modalSvgNS, 'circle');
      haloDot.setAttribute('r', 9);
      haloDot.setAttribute('fill', '#EDEBF7');
      haloDot.setAttribute('opacity', '0.35');
      haloDot.setAttribute('filter', 'url(#frameGlow)');
      g.appendChild(haloDot);
      // static — no glimmer animation, just a steady glow
      const star = document.createElementNS(modalSvgNS, 'path');
      star.setAttribute('class', 'frame-star');
      star.setAttribute('d', STAR_PATH);
      star.style.filter = 'url(#frameGlow)';
      g.appendChild(star);
      svg.appendChild(g);
    });
  }

  document.getElementById('add-btn').addEventListener('click', () => {
    document.getElementById('f-name').value = '';
    document.getElementById('f-subject').value = '';
    document.getElementById('f-due').value = '';
    document.getElementById('f-url').value = '';
    document.getElementById('f-color').value = '#2ECC71';
    overlay.classList.add('open');
    document.getElementById('f-name').focus();
    buildModalFrame();
  });
  document.getElementById('cancel-btn').addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

  const LAYOUT_CATS = ['apps', 'social', 'projects', 'other'];

  document.getElementById('save-btn').addEventListener('click', () => {
    const hub = document.getElementById('f-hub').value;
    const name = document.getElementById('f-name').value.trim();
    const subject = document.getElementById('f-subject').value.trim();
    const dueDate = document.getElementById('f-due').value;
    const url = document.getElementById('f-url').value.trim();
    const color = document.getElementById('f-color').value;
    if (!name) return;
    // spread new tasks across all four angle slots rather than letting
    // them all fall back to the same default direction
    const category = LAYOUT_CATS[nodes.length % LAYOUT_CATS.length];
    nodes.push({ id: 'n'+Date.now(), name, url, subject, dueDate, color, category, hub });
    saveNodes();
    overlay.classList.remove('open');
    buildScene();
    relayout();
  });

  // ---------- init ----------
  (async function init(){
    await loadState();
    buildScene();
    relayout();
    // fade the whole graph in, rather than it popping in the instant
    // buildScene() finishes — respects reduced-motion by skipping
    // straight to visible instead of animating
    if (reduceMotion){
      svg.style.opacity = '1';
    } else {
      setTimeout(() => { svg.style.opacity = '1'; }, 60);
    }
    initCalSettingsUI();
    refreshScheduleCalendars();
    setInterval(refreshScheduleCalendars, 10 * 60 * 1000);
  })();
})();
</script>
</body>
</html>
